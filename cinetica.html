/* --------------------------------------------------------------------------
   FADE DE OBJETOS 3D — desvanecer(grupo, 0|1, ms)
   --------------------------------------------------------------------------
   Serve para "esvaziar a bancada" na abertura sem destruir nada: no fim do
   fade o grupo só vira visible=false. Os béqueres continuam borbulhando, o
   Bunsen continua no lugar — é material GUARDADO, pronto para voltar com
   trazerEquipamentos().

   Dois detalhes que não são óbvios:

   · MeshToonMaterial e MeshStandardMaterial nascem com transparent:false, e
     nesse estado a opacidade é simplesmente IGNORADA — o objeto sumiria de
     uma vez. Por isso ligamos transparent durante o fade e devolvemos o valor
     original quando ele volta ao normal (transparent:true muda a ordenação de
     render e não deve ficar ligado à toa).
   · a opacidade-base de cada material é guardada em userData na primeira
     passada. Sem isso, um segundo fade partiria da opacidade já reduzida e o
     vidro do béquer (0.20) iria clareando a cada ida e volta.
   -------------------------------------------------------------------------- */
let _fades = [];

function _materiaisDe(obj){
  const vistos = new Set(), lista = [];
  obj.traverse((o)=>{
    if(!o.material) return;
    const ms = Array.isArray(o.material) ? o.material : [o.material];
    ms.forEach((m)=>{
      if(vistos.has(m)) return;
      vistos.add(m);
      if(m.userData._op0 === undefined){
        m.userData._op0 = (m.opacity === undefined) ? 1 : m.opacity;
        m.userData._tr0 = !!m.transparent;
      }
      lista.push(m);
    });
  });
  return lista;
}

function _aplicarFade(mats, k){
  for(let i = 0; i < mats.length; i++){
    const m = mats[i];
    m.transparent = (k < .999) ? true : m.userData._tr0;
    m.opacity     = m.userData._op0 * k;
  }
}

/* para = 1 (aparecer) ou 0 (sumir). ms <= 0 aplica na hora. */
function desvanecer(obj, para, ms, aoFim){
  if(!obj) return;
  const mats = _materiaisDe(obj);
  const de = (obj.userData._fadeK === undefined) ? (obj.visible ? 1 : 0)
                                                 : obj.userData._fadeK;
  _fades = _fades.filter(f => f.obj !== obj);   // no máximo um fade por objeto
  if(para > 0) obj.visible = true;              // precisa render para aparecer

  /* O mapa de sombras é binário: ignora opacidade. Sem isto, a bancada
     esvaziaria enquanto as sombras dos béqueres continuavam cheias no tampo,
     sumindo de estalo só no último frame. Desligamos a projeção já na saída
     e devolvemos na entrada — cada malha volta ao que configurarSombras()
     tinha decidido para ela. */
  obj.traverse((o)=>{
    if(o.isMesh) o.castShadow = (para > 0) && (o.userData._projeta0 === true);
  });

  if(!ms || ms <= 0){
    obj.userData._fadeK = para;
    _aplicarFade(mats, para);
    obj.visible = para > 0;
    if(aoFim) aoFim();
    return;
  }
  _fades.push({ obj, mats, de, para, t:0, dur: ms / 1000, aoFim });
}

function tickFades(dt){
  for(let i = _fades.length - 1; i >= 0; i--){
    const f = _fades[i];
    f.t += dt;
    const p = clamp(f.t / f.dur, 0, 1);
    const k = lerp(f.de, f.para, easeInOutCubic(p));
    f.obj.userData._fadeK = k;
    _aplicarFade(f.mats, k);
    if(p >= 1){
      f.obj.visible = f.para > 0;    // guardado: sai do render, fica na cena
      _fades.splice(i, 1);
      if(f.aoFim) f.aoFim();
    }
  }
}

/* ==========================================================================
   7. CENA 3D — bancada de reações + arena molecular
   ========================================================================== */
let renderer, scene, camera, relogio;
let raizCena = null;          // grupo raiz da cena montada
let cenaMontada = null;       // 'bancada' | 'arena' | 'quadro'
let bancada = null;           // referências da cena de bancada
let arena = null;             // referências da arena molecular
const atualizadores = [];     // funções (dt) => {} chamadas todo frame

/* ---- material toon com contorno ---- */
let mapaToon = null;

/* Texturas reaproveitadas entre cenas — limparGrupo() nunca as descarta. */
const TEXTURAS_COMPARTILHADAS = new Set();
function gradienteToon(){
  if(mapaToon) return mapaToon;
  /* Degraus de luz do toon shading. O shader lê o texel em .rgb, então o
     valor precisa estar replicado nos 3 canais — por isso RGBAFormat e não
     RedFormat (com RedFormat, G e B vêm zerados e a cena inteira fica rosa). */
  /* 5 degraus, e o mais escuro em 74 (29%) em vez de 46 (18%). Com quatro
     degraus e um piso tão baixo, todo lado que não olhava para a key light
     virava um borrão preto: a madeira perdia o veio e o béquer perdia o
     contorno do vidro. Mais um degrau dá a meia-luz que faltava sem tirar
     a banda dura, que é o que faz o desenho parecer desenho. */
  const niveis = [74, 130, 180, 220, 255];   // sombra funda → luz cheia
  const dados = new Uint8Array(niveis.length * 4);
  for(let i = 0; i < niveis.length; i++){
    dados[i*4] = dados[i*4+1] = dados[i*4+2] = niveis[i];
    dados[i*4+3] = 255;
  }
  mapaToon = new THREE.DataTexture(dados, niveis.length, 1, THREE.RGBAFormat);
  mapaToon.minFilter = mapaToon.magFilter = THREE.NearestFilter;
  mapaToon.needsUpdate = true;
  return mapaToon;
}
function toon(cor, extra){
  return new THREE.MeshToonMaterial(Object.assign({
    color: cor, gradientMap: gradienteToon()
  }, extra || {}));
}
function contorno(mesh, esp){
  const m = new THREE.Mesh(
    mesh.geometry,
    new THREE.MeshBasicMaterial({ color:0x0b0b0a, side:THREE.BackSide })
  );
  m.scale.multiplyScalar(esp || 1.045);
  m.renderOrder = -1;
  /* A casca é uma cópia INFLADA e virada do avesso do próprio objeto: se
     projetasse sombra, cada objeto ganharia uma segunda sombra maior que
     ele, deslocada. Fica fora do mapa de sombras. */
  m.userData.semSombra = true;
  mesh.add(m);
  return mesh;
}
function vidro(cor){
  return new THREE.MeshPhongMaterial({
    color: cor || CORES.vidro, transparent:true, opacity:.20,
    shininess:110, specular:0xffffff, side:THREE.DoubleSide, depthWrite:false
  });
}

/* ==========================================================================
   TEXTURAS PROCEDURAIS — madeira e metal
   --------------------------------------------------------------------------
   Geradas em <canvas> no boot: nada de arquivo externo, o PWA continua
   100% offline. Cada uma é criada uma única vez e reaproveitada.
   ========================================================================== */

/* Ruído barato (soma de senos) — suficiente para veio de madeira. */
function _turb(x, y){
  return Math.sin(x * 0.9 + Math.sin(y * 0.5) * 2.1) * 0.55
       + Math.sin(x * 2.3 + 1.7) * Math.sin(y * 0.31) * 0.28
       + Math.sin(x * 5.1 + y * 0.9) * 0.12;
}

let _texMadeira = null;
function texturaMadeira(){
  if(_texMadeira) return _texMadeira;
  const N = 512;
  const cv = document.createElement('canvas'); cv.width = cv.height = N;
  const c = cv.getContext('2d');
  const img = c.createImageData(N, N);
  const d = img.data;

  /* Duas cores de madeira (clara e escura) que serão misturadas pelo anel.
     Carvalho, não mogno: o par antigo ([146,96,58] / [78,44,26]) era muito
     saturado no vermelho e, multiplicado pela cor do material, deixava o
     tampo cor de vinho. */
  const clara  = [158, 124, 88];
  const escura = [ 92,  66, 44];

  for(let y = 0; y < N; y++){
    for(let x = 0; x < N; x++){
      const u = x / N * 10, v = y / N * 10;
      /* anéis de crescimento: coordenada distorcida pela turbulência */
      const g = u * 2.4 + _turb(u, v) * 1.9;
      let anel = Math.abs(Math.sin(g * Math.PI));
      anel = Math.pow(anel, 0.65);
      /* fibras finas na direção do veio */
      const fibra = (Math.sin(v * 190 + Math.sin(u * 7) * 3) * 0.5 + 0.5) * 0.10;
      /* poros aleatórios */
      const poro = Math.random() * 0.055;
      const t = clamp(anel * 0.82 + fibra - poro, 0, 1);

      const i = (y * N + x) * 4;
      d[i]     = escura[0] + (clara[0] - escura[0]) * t;
      d[i + 1] = escura[1] + (clara[1] - escura[1]) * t;
      d[i + 2] = escura[2] + (clara[2] - escura[2]) * t;
      d[i + 3] = 255;
    }
  }
  c.putImageData(img, 0, 0);

  _texMadeira = new THREE.CanvasTexture(cv);
  TEXTURAS_COMPARTILHADAS.add(_texMadeira);
  _texMadeira.wrapS = _texMadeira.wrapT = THREE.RepeatWrapping;
  _texMadeira.anisotropy = 8;
  return _texMadeira;
}

/* Mapa de relevo da madeira (mesma imagem em tons de cinza serve de bump). */
let _texMetal = null;
function texturaMetal(){
  if(_texMetal) return _texMetal;
  const W = 512, H = 512;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const c = cv.getContext('2d');
  c.fillStyle = '#9aa0a6'; c.fillRect(0, 0, W, H);
  /* metal escovado: riscos horizontais finos de brilho variável */
  for(let i = 0; i < 5200; i++){
    const y = Math.random() * H;
    const x = Math.random() * W;
    const comp = 12 + Math.random() * 120;
    const luz = Math.random();
    c.strokeStyle = luz > .5
      ? 'rgba(255,255,255,' + (0.03 + Math.random() * 0.12) + ')'
      : 'rgba(0,0,0,'       + (0.03 + Math.random() * 0.12) + ')';
    c.lineWidth = Math.random() < .8 ? 1 : 2;
    c.beginPath(); c.moveTo(x, y); c.lineTo(x + comp, y + (Math.random() - .5) * .8); c.stroke();
  }
  _texMetal = new THREE.CanvasTexture(cv);
  TEXTURAS_COMPARTILHADAS.add(_texMetal);
  _texMetal.wrapS = _texMetal.wrapT = THREE.RepeatWrapping;
  _texMetal.anisotropy = 8;
  return _texMetal;
}

/* --------------------------------------------------------------------------
   Ambiente que o METAL reflete. Sem envMap, MeshStandardMaterial com
   metalness alto renderiza praticamente preto.
   O cubemap cru NÃO serve direto: precisa passar pelo PMREMGenerator para o
   borrão por rugosidade funcionar. Por isso é montado em prepararAmbiente(),
   chamado logo depois que o renderer existe.
   -------------------------------------------------------------------------- */
let _ambiente = null;
function ambienteReflexo(){ return _ambiente; }

function prepararAmbiente(){
  const faces = [];
  for(let i = 0; i < 6; i++){
    const N = 256;
    const cv = document.createElement('canvas'); cv.width = cv.height = N;
    const c = cv.getContext('2d');
    /* Tudo em CINZA NEUTRO: é isto que o metal reflete. Com o ambiente em
       tons de vinho, o aço do tripé e do Bunsen saía cor de cobre. */
    if(i === 2){                     /* +Y — teto: as luminárias do laboratório */
      c.fillStyle = '#5e5c5a'; c.fillRect(0, 0, N, N);
      const g = c.createRadialGradient(N*.5, N*.42, 6, N*.5, N*.42, N*.62);
      g.addColorStop(0, '#ffffff'); g.addColorStop(.35, '#eae7e3');
      g.addColorStop(.75, '#8b8885'); g.addColorStop(1, '#3f3d3b');
      c.fillStyle = g; c.fillRect(0, 0, N, N);
    } else if(i === 3){              /* -Y — piso escuro */
      c.fillStyle = '#1e1d1c'; c.fillRect(0, 0, N, N);
    } else {                         /* laterais — horizonte claro em cima */
      const g = c.createLinearGradient(0, 0, 0, N);
      g.addColorStop(0, '#d6d3cf'); g.addColorStop(.34, '#8a8784');
      g.addColorStop(.62, '#454341'); g.addColorStop(1, '#171716');
      c.fillStyle = g; c.fillRect(0, 0, N, N);
      /* faixa de luz do teto refletida na parede */
      c.fillStyle = 'rgba(255,245,235,.30)';
      c.fillRect(0, N * .10, N, N * .06);
    }
    faces.push(cv);
  }
  const cubo = new THREE.CubeTexture(faces);
  cubo.needsUpdate = true;

  const pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileCubemapShader();
  _ambiente = pmrem.fromCubemap(cubo).texture;
  pmrem.dispose();
  cubo.dispose();
}

/* --------------------------------------------------------------------------
   TEXTURA DA PAREDE LATERAL — "slide de apresentação"
   Tom sobre tom: todos os elementos ficam a poucos por cento de luminância do
   fundo, para lerem como marca d'água e nunca competirem com a bancada.
   Elementos típicos de um tema de PowerPoint: faixas diagonais nos cantos,
   uma barra de acento e um watermark central — aqui, a curva da energia de
   ativação, que é o símbolo da cinética.
   -------------------------------------------------------------------------- */
let _texParede = null;
function texturaParedeSlide(){
  if(_texParede) return _texParede;
  const W = 1400, H = 900;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const c = cv.getContext('2d');

  /* 1) base: gradiente vertical (mais claro em cima, onde bate a luz) */
  const g = c.createLinearGradient(0, 0, 0, H);
  /* Base em grafite neutro. As faixas e as moléculas desenhadas por cima
     continuam com os acentos do tema — o que sai do vermelho é a PAREDE. */
  g.addColorStop(0,   '#2a2928');
  g.addColorStop(.55, '#1c1b1a');
  g.addColorStop(1,   '#131312');
  c.fillStyle = g; c.fillRect(0, 0, W, H);

  /* --- ÁREA DE SLIDE ---------------------------------------------------
     A parede é grande (22x14) mas a câmera de referência (CAM_PAREDE) só
     enquadra um recorte dela: da metade de baixo para cima. Compomos o
     "slide" dentro dessa área, em coordenadas relativas — assim os cantos
     e o rodapé caem onde a câmera realmente olha, em vez de ficarem fora
     de quadro. Fora da área, sobra só o gradiente de fundo.
     ---------------------------------------------------------------------- */
  const SX = W * .03, SW = W * .94;
  const SY = H * .26, SH = H * .72;
  const sx = (u) => SX + SW * u;          // 0..1 → x dentro do slide
  const sy = (v) => SY + SH * v;          // 0..1 → y dentro do slide

  /* 2) faixas diagonais dos cantos do slide */
  const faixa = (pts, cor) => {
    c.fillStyle = cor; c.beginPath();
    c.moveTo(sx(pts[0][0]), sy(pts[0][1]));
    for(let i = 1; i < pts.length; i++) c.lineTo(sx(pts[i][0]), sy(pts[i][1]));
    c.closePath(); c.fill();
  };
  /* canto superior direito */
  faixa([[.60,0],[1,0],[1,.40],[.80,0]], 'rgba(255,157,51,.05)');
  faixa([[.78,0],[1,0],[1,.23]],         'rgba(255,59,48,.06)');
  faixa([[.90,0],[1,0],[1,.09]],         'rgba(255,196,107,.07)');
  /* canto inferior esquerdo */
  faixa([[0,1],[.34,1],[0,.62]],         'rgba(255,157,51,.04)');
  faixa([[0,1],[.18,1],[0,.81]],         'rgba(255,59,48,.05)');

  /* ---- ferramentas de desenho químico (tudo tom sobre tom) ---- */
  const rgba = (r, g2, b, a) => 'rgba(' + r + ',' + g2 + ',' + b + ',' + a + ')';
  const BRANCO = (a) => rgba(255, 255, 255, a);
  const AMBAR  = (a) => rgba(255, 157, 51, a);
  const AZUL   = (a) => rgba(111, 183, 255, a);
  const ROXO   = (a) => rgba(200, 107, 255, a);

  /* Fórmula/equação escrita. */
  const formula = (txt, u, v, tam, alpha, cor) => {
    c.save();
    c.font = '600 ' + tam + 'px "Segoe UI", system-ui, Roboto, Arial, sans-serif';
    c.fillStyle = (cor || BRANCO)(alpha);
    c.textAlign = 'left'; c.textBaseline = 'middle';
    c.fillText(txt, sx(u), sy(v));
    c.restore();
  };

  /* Átomo: círculo de contorno com o símbolo dentro, como num diagrama de
     ligações. Preenchimento chapado deixaria o símbolo escuro sobre um
     círculo quase transparente — some no fundo. */
  const atomo = (x, y, r, alpha, rot) => {
    c.fillStyle = BRANCO(alpha * .45);
    c.beginPath(); c.arc(x, y, r, 0, 6.284); c.fill();
    c.strokeStyle = BRANCO(alpha * 1.7); c.lineWidth = Math.max(1.5, r * .13);
    c.beginPath(); c.arc(x, y, r, 0, 6.284); c.stroke();
    if(rot){
      c.font = '700 ' + Math.round(r * 1.02) + 'px "Segoe UI", system-ui, sans-serif';
      c.fillStyle = BRANCO(Math.min(.30, alpha * 2.4));
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(rot, x, y + 1);
    }
  };
  /* Ligação simples ou dupla entre dois pontos. */
  const ligacao = (x1, y1, x2, y2, alpha, dupla, esp) => {
    c.strokeStyle = BRANCO(alpha); c.lineWidth = esp || 5; c.lineCap = 'round';
    if(!dupla){
      c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); return;
    }
    const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1;
    const nx = -dy / L * (esp || 5) * .9, ny = dx / L * (esp || 5) * .9;
    c.beginPath(); c.moveTo(x1+nx, y1+ny); c.lineTo(x2+nx, y2+ny); c.stroke();
    c.beginPath(); c.moveTo(x1-nx, y1-ny); c.lineTo(x2-nx, y2-ny); c.stroke();
  };

  /* ---- 3) ESTRUTURAS MOLECULARES ---- */

  /* Benzeno: hexágono com o círculo aromático. */
  const benzeno = (u, v, r, alpha) => {
    const x = sx(u), y = sy(v), p = [];
    for(let i = 0; i < 6; i++){
      const a = -Math.PI/2 + i * Math.PI/3;
      p.push([x + Math.cos(a)*r, y + Math.sin(a)*r]);
    }
    c.strokeStyle = BRANCO(alpha); c.lineWidth = r*.10; c.lineJoin = 'round';
    c.beginPath(); c.moveTo(p[0][0], p[0][1]);
    for(let i = 1; i < 6; i++) c.lineTo(p[i][0], p[i][1]);
    c.closePath(); c.stroke();
    c.beginPath(); c.arc(x, y, r*.58, 0, 6.284); c.stroke();
  };

  /* Água: O central com dois H em ângulo (~105°). */
  const agua = (u, v, r, alpha) => {
    const x = sx(u), y = sy(v), d = r*2.05;
    const a1 = -0.35, a2 = -Math.PI + 0.35;
    const h1 = [x + Math.cos(a1)*d, y + Math.sin(a1)*d];
    const h2 = [x + Math.cos(a2)*d, y + Math.sin(a2)*d];
    ligacao(x, y, h1[0], h1[1], alpha*.85, false, r*.30);
    ligacao(x, y, h2[0], h2[1], alpha*.85, false, r*.30);
    atomo(x, y, r, alpha, 'O');
    atomo(h1[0], h1[1], r*.62, alpha, 'H');
    atomo(h2[0], h2[1], r*.62, alpha, 'H');
  };

  /* Gás carbônico: O=C=O linear com ligações duplas. */
  const gasCarbonico = (u, v, r, alpha) => {
    const x = sx(u), y = sy(v), d = r*2.25;
    ligacao(x - d, y, x, y, alpha*.85, true, r*.20);
    ligacao(x, y, x + d, y, alpha*.85, true, r*.20);
    atomo(x - d, y, r*.85, alpha, 'O');
    atomo(x + d, y, r*.85, alpha, 'O');
    atomo(x, y, r, alpha, 'C');
  };

  /* Amônia: N com três H. */
  const amonia = (u, v, r, alpha) => {
    const x = sx(u), y = sy(v), d = r*2.05;
    [-Math.PI/2, Math.PI/6, Math.PI - Math.PI/6].forEach((a)=>{
      const hx = x + Math.cos(a)*d, hy = y + Math.sin(a)*d;
      ligacao(x, y, hx, hy, alpha*.85, false, r*.28);
      atomo(hx, hy, r*.60, alpha, 'H');
    });
    atomo(x, y, r, alpha, 'N');
  };

  /* Metano: C com quatro H. */
  const metano = (u, v, r, alpha) => {
    const x = sx(u), y = sy(v), d = r*2.0;
    [-Math.PI/2, 0, Math.PI/2, Math.PI].forEach((a)=>{
      const hx = x + Math.cos(a)*d, hy = y + Math.sin(a)*d;
      ligacao(x, y, hx, hy, alpha*.8, false, r*.26);
      atomo(hx, hy, r*.55, alpha, 'H');
    });
    atomo(x, y, r, alpha, 'C');
  };

  /* Gás oxigênio: O=O. */
  const oxigenio = (u, v, r, alpha) => {
    const x = sx(u), y = sy(v), d = r*1.35;
    ligacao(x - d, y, x + d, y, alpha*.85, true, r*.22);
    atomo(x - d, y, r, alpha, 'O');
    atomo(x + d, y, r, alpha, 'O');
  };

  /* Distribuição em faixas horizontais, dimensionada para não haver
     sobreposição entre equações vizinhas nem com as estruturas. */
  gasCarbonico(.07, .10, 18, .044);
  benzeno(     .87, .15, 40, .050);
  oxigenio(    .14, .46, 16, .040);
  metano(      .08, .65, 21, .042);
  agua(        .53, .67, 20, .046);
  amonia(      .91, .69, 20, .042);

  /* ---- 4) EQUAÇÕES E LEIS ---- */
  /* lei da velocidade e Arrhenius — o coração da cinética */
  formula('v = k · [A]ᵐ · [B]ⁿ',                 .28, .10, 38, .062, AZUL);
  /* decomposição da água oxigenada: a reação-símbolo da catálise */
  formula('2 H₂O₂  →  2 H₂O  +  O₂',            .05, .30, 46, .068, AMBAR);
  formula('Ea',                                  .52, .25, 30, .046, AMBAR);
  formula('2 SO₂ + O₂ → 2 SO₃',                  .64, .32, 26, .038);
  formula('k = A · e^(−Ea/RT)',                  .30, .47, 34, .056, ROXO);
  formula('V₂O₅',                                .88, .44, 24, .036, ROXO);
  formula('MnO₂',                                .27, .61, 28, .042, ROXO);
  formula('ΔH',                                  .73, .60, 26, .040, AZUL);
  /* síntese de Haber, ataque do zinco e efervescência do carbonato */
  formula('N₂ + 3 H₂  ⇌  2 NH₃',                 .04, .83, 32, .046);
  formula('Zn + 2 HCl → ZnCl₂ + H₂',             .35, .85, 24, .034);
  formula('v = ΔC / Δt',                         .72, .83, 34, .056, AMBAR);
  formula('CaCO₃ + 2 HCl → CaCl₂ + H₂O + CO₂',   .12, .93, 24, .036);

  /* 6) barra de acento do rodapé do slide */
  c.fillStyle = 'rgba(255,59,48,.14)';
  c.fillRect(sx(0), sy(.97), SW, 5);
  c.fillStyle = 'rgba(255,157,51,.26)';
  c.fillRect(sx(.04), sy(.97) - 1, SW*.17, 7);
  /* filete fino no topo do slide, como cabeçalho de template */
  c.fillStyle = 'rgba(255,157,51,.09)';
  c.fillRect(sx(0), sy(.02), SW, 3);

  /* 7) vinheta para as bordas não brigarem com o canto da sala */
  const v = c.createRadialGradient(W*.5, H*.45, H*.30, W*.5, H*.5, H*.95);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,.45)');
  c.fillStyle = v; c.fillRect(0, 0, W, H);

  _texParede = new THREE.CanvasTexture(cv);
  TEXTURAS_COMPARTILHADAS.add(_texParede);
  _texParede.anisotropy = 8;
  return _texParede;
}

/* --------------------------------------------------------------------------
   QUADRO DA PAREDE DO FUNDO — texto CRAVADO na textura
   --------------------------------------------------------------------------
   O texto do quadro NÃO é um overlay de DOM: ele é pintado num <canvas> que
   vira a textura do plano do quadro (10.5 x 5.6 em z = -6.05). Consequências
   que justificam a escolha:

     · o texto é geometria de cena — mudar a câmera não o apaga, ele fica lá,
       em perspectiva, como se estivesse escrito no quadro mesmo;
     · o canvas e a textura são ÚNICOS e vivem fora das cenas (registrados em
       TEXTURAS_COMPARTILHADAS). prepararBancada/Quadro/Arena chamam novaRaiz()
       e reconstroem criarSala() a cada troca de faixa — se o estado morasse
       no mesh, o texto sumiria na primeira troca. Por isso o conteúdo mora em
       QUADRO_TXT e criarSala() só pendura a textura já pintada.

   MeshBasicMaterial (não toon): as luzes do laboratório são fracas de
   propósito e um material que recebe luz deixaria o texto ilegível. O
   degradê de "luz batendo no quadro" já vem pintado no próprio canvas.

   ÁREA ÚTIL: o quadro tem 10.5 x 5.6 e a tela quase nunca enquadra tudo, então
   o layout depende da ORIENTAÇÃO — ver LAYOUT_QUADRO:

     paisagem  a CAM_QUADRO_DEF corta a faixa de cima do quadro (o topo do
               plano fica fora do frustum) mas sobra largura de sobra. Texto
               ocupando quase toda a largura, título a 18% da altura.
     retrato   a tela é estreita: com a largura toda, as pontas do texto caem
               fora. Texto numa COLUNA central de 60% da largura, que a
               CAM_QUADRO_DEF_P consegue enquadrar inteira. Em compensação o
               quadro cabe todo na vertical, então dá para usar o topo.

   pintarQuadro() é chamada de novo em aoRedimensionar(): girar o aparelho
   troca o layout na hora.
   -------------------------------------------------------------------------- */
const QUADRO_W = 1920, QUADRO_H = 1024;      // 1.875 = 10.5/5.6, o mesmo do plano

/* Estado do que está escrito. `revelado` = nº de caracteres já "digitados". */
const QUADRO_TXT = {
  titulo:    'Cinética Química',
  rotulo:    '',
  definicao: '',
  /* Rótulo e definição são digitados SEPARADAMENTE (em tempos diferentes do
     áudio), então cada um tem seu próprio contador de caracteres revelados e
     sua própria barra de digitação. */
  revelado:  0,
  caret:     false,
  reveladoRotulo: 0,
  caretRotulo:    false
};

/* Um layout por orientação. u/v são frações da textura (0..1).
     colEsq/colDir  coluna de texto      tituloV  baseline do título
     tituloU        centro do título — o KNOB para deslocar só ele
     rotuloV        baseline de "Definição:"
     defV           baseline da 1ª linha da definição
     linha          altura de linha, em px de textura                       */
const LAYOUT_QUADRO = {
  paisagem: { colEsq:.095, colDir:.905, tituloU:.500,
              tamTitulo:104, tamRotulo:68, tamDef:68,
              tituloV:.255, fileteV:.305, rotuloV:.445, defV:.575, linha:92 },

  /* RETRATO — calibrado para a CAM_QUADRO_DEF_P. ESTES SÃO OS KNOBS:
       colEsq/colDir  movem e estreitam a coluna de texto
       tituloU        move SÓ o título na horizontal
       tituloV/rotuloV/defV   sobem e descem cada bloco

     A coluna é deslocada para a direita porque o eixo daquela câmera é
     oblíquo: o centro do quadro (x = 0) aparece 0.74 à esquerda do centro
     da tela. Com a coluna simétrica em .200–.800, a margem esquerda do texto
     nascia por cima da borda da tela.
     Do jeito que está, o centro da coluna (.5715) cai praticamente em cima
     do centro da tela, e tituloU .550 deixa o título um tico à esquerda dele.

     Fontes 30% menores que a calibragem anterior. Não é perda de tamanho na
     tela: a câmera nova olha o quadro de 16.6 de distância contra 24.1 da
     anterior, então a definição sai com ~14px de tela nos dois casos. */
  /* Uma "linha" de deslocamento = 63px de textura, a entrelinha anterior.
     A textura é isotrópica (1920x1024 sobre 10.5x5.6: 10.5/1920 = 5.6/1024),
     então esses 63px valem a mesma distância na horizontal e na vertical —
     dá para usar a entrelinha como régua para mover na horizontal.
       título      -15%, e no total 2 + 1.5 linhas à esquerda
                   (.550 -> .484 -> .4395). As 1.5 usam a entrelinha ATUAL
                   (57px), que é o espaçamento que se vê na tela.
       rótulo/def  -10% e 0.75 linha à esquerda. A margem esquerda do texto é
                   o gargalo: a borda da tela fica em ndcX -1.00 e o texto
                   nasce a -0.93. Referência de medida = celular em pé
                   390x844, onde 0.75 linha para em -0.98. ATENÇÃO ao mexer:
                   1 linha inteira já iria a -1.04 e cortaria o primeiro
                   caractere; e em aparelhos de proporção mais estreita
                   (412x915) este valor já encosta em -1.01. O valor seguro
                   em qualquer celular é 0.5 linha (colEsq .2596).
     A entrelinha acompanha o corpo da definição (41 -> 37 pediu 57 -> 51),
     senão o bloco ficaria frouxo com a letra menor. */
  retrato:  { colEsq:.2514, colDir:.8424, tituloU:.4395,
              tamTitulo:66, tamRotulo:48, tamDef:37,
              tituloV:.150, fileteV:.200, rotuloV:.330, defV:.455, linha:51 }
};
function ehRetrato(){ return window.innerHeight > window.innerWidth; }
function layoutQuadro(){ return ehRetrato() ? LAYOUT_QUADRO.retrato : LAYOUT_QUADRO.paisagem; }

let _cvQuadro = null, _ctxQuadro = null, _texQuadro = null;

function texturaQuadro(){
  if(_texQuadro) return _texQuadro;
  _cvQuadro = document.createElement('canvas');
  _cvQuadro.width = QUADRO_W; _cvQuadro.height = QUADRO_H;
  _ctxQuadro = _cvQuadro.getContext('2d');
  _texQuadro = new THREE.CanvasTexture(_cvQuadro);
  _texQuadro.anisotropy = 8;
  TEXTURAS_COMPARTILHADAS.add(_texQuadro);   // sobrevive ao desmonte das cenas
  pintarQuadro();
  return _texQuadro;
}

/* Quebra o texto em linhas usando a largura REAL medida no canvas.
   A quebra é calculada sobre o texto COMPLETO, nunca sobre o pedaço já
   revelado: senão as linhas se reorganizariam a cada letra e o texto
   "pularia" durante a digitação.

   '\n' é quebra obrigatória — é assim que o autor manda no corte da frase.
   Dentro de cada trecho ainda vale a quebra por largura, para o trecho não
   estourar a coluna estreita do retrato.

   IMPORTANTE para a digitação: tanto o espaço quanto o '\n' ocupam UM
   caractere do texto original, e é por isso que pintarQuadro() desconta
   `linha.length + 1` por linha ao contar o que já foi revelado. */
function quebrarLinhas(c, txt, larguraMax){
  const linhas = [];
  String(txt).split('\n').forEach((trecho)=>{
    const palavras = trecho.split(/\s+/).filter(Boolean);
    if(!palavras.length){ linhas.push(''); return; }
    let atual = '';
    for(let i = 0; i < palavras.length; i++){
      const teste = atual ? atual + ' ' + palavras[i] : palavras[i];
      if(atual && c.measureText(teste).width > larguraMax){
        linhas.push(atual); atual = palavras[i];
      } else {
        atual = teste;
      }
    }
    if(atual) linhas.push(atual);
  });
  return linhas;
}

function pintarQuadro(){
  if(!_ctxQuadro) return;
  const c = _ctxQuadro, W = QUADRO_W, H = QUADRO_H;
  const FONTE = '"Segoe UI", system-ui, Roboto, Arial, sans-serif';

  /* ---- 1) fundo do quadro — grafite neutro, sem vinho ---- */
  const g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0,   '#232322');   // luz do teto bate em cima
  g.addColorStop(.45, '#191918');
  g.addColorStop(1,   '#131312');
  c.fillStyle = g; c.fillRect(0, 0, W, H);

  /* Brilho suave no canto superior esquerdo (a key light vem da direita/alto,
     mas o quadro é fosco: um clarão discreto tira o ar de retângulo chapado). */
  const br = c.createRadialGradient(W*.30, H*.16, 20, W*.30, H*.16, W*.62);
  br.addColorStop(0, 'rgba(255,250,244,.05)');
  br.addColorStop(1, 'rgba(255,250,244,0)');
  c.fillStyle = br; c.fillRect(0, 0, W, H);

  /* Fio interno, como a borda de um quadro branco de sala de aula. Cinza, e
     não rubi: a borda do quadro não entra no tema vermelho. */
  c.strokeStyle = 'rgba(255,255,255,.10)'; c.lineWidth = 4;
  c.strokeRect(W*.035, H*.055, W*.93, H*.885);

  /* ---- 2) área útil: depende da orientação (ver LAYOUT_QUADRO) ---- */
  const L = layoutQuadro();
  const ESQ = W * L.colEsq, DIR = W * L.colDir, LARG = DIR - ESQ;

  /* ---- 3) título ---- */
  if(QUADRO_TXT.titulo){
    c.font = '800 ' + L.tamTitulo + 'px ' + FONTE;
    c.textAlign = 'center'; c.textBaseline = 'alphabetic';
    const gt = c.createLinearGradient(ESQ, 0, DIR, 0);
    gt.addColorStop(0,   '#ff3b30');
    gt.addColorStop(.55, '#ff9d33');
    gt.addColorStop(1,   '#ff5a3c');
    c.fillStyle = gt;
    /* tituloU e não o centro da coluna: no retrato o título fica um pouco à
       esquerda do miolo do texto, para assentar melhor no enquadramento. */
    c.fillText(QUADRO_TXT.titulo, W * L.tituloU, H * L.tituloV);

    /* Filete sob o título. */
    const gl = c.createLinearGradient(ESQ, 0, DIR, 0);
    gl.addColorStop(0,   'rgba(255,59,48,0)');
    gl.addColorStop(.5,  'rgba(255,157,51,.55)');
    gl.addColorStop(1,   'rgba(255,59,48,0)');
    c.fillStyle = gl; c.fillRect(ESQ, H * L.fileteV, LARG, 3);
  }

  /* ---- 4) rótulo ("Definição:"), também revelado letra a letra ---- */
  c.textAlign = 'left';
  if(QUADRO_TXT.rotulo){
    c.font = '800 ' + L.tamRotulo + 'px ' + FONTE;
    c.fillStyle = '#ff9d33';
    const visR = QUADRO_TXT.rotulo.slice(0, QUADRO_TXT.reveladoRotulo);
    const yR = H * L.rotuloV;
    c.fillText(visR, ESQ, yR);
    if(QUADRO_TXT.caretRotulo){
      c.fillRect(ESQ + c.measureText(visR).width + 6,
                 yR - L.tamRotulo * .74, 5, L.tamRotulo * .9);
    }
  }

  /* ---- 5) definição, revelada caractere a caractere ---- */
  if(QUADRO_TXT.definicao){
    c.font = '600 ' + L.tamDef + 'px ' + FONTE;
    c.fillStyle = '#f6ece9';
    const linhas = quebrarLinhas(c, QUADRO_TXT.definicao, LARG);
    let restam = QUADRO_TXT.revelado;
    let y = H * L.defV;

    for(let i = 0; i < linhas.length; i++){
      const linha = linhas[i];
      if(restam <= 0) break;
      const visivel = linha.slice(0, restam);
      c.fillText(visivel, ESQ, y);

      /* Barra de digitação no fim do que já apareceu. Só na linha CORRENTE:
         visivel.length === restam significa que a revelação parou aqui. */
      if(QUADRO_TXT.caret && visivel.length === restam){
        const x = ESQ + c.measureText(visivel).width + 8;
        c.fillStyle = '#ff3b30';
        c.fillRect(x, y - L.tamDef * .74, 6, L.tamDef * .9);
        c.fillStyle = '#f6ece9';
      }
      /* +1 pelo espaço que a quebra de linha consumiu do texto original. */
      restam -= linha.length + 1;
      y += L.linha;
    }
  }

  _texQuadro.needsUpdate = true;
}

/* ---- API do quadro (usada pela coreografia das faixas) ---- */

/* Troca o conteúdo. Campos omitidos ficam como estão; passe '' para apagar. */
function quadroDefinir(op){
  op = op || {};
  if(op.titulo !== undefined) QUADRO_TXT.titulo = op.titulo;
  if(op.rotulo !== undefined){
    QUADRO_TXT.rotulo = op.rotulo;
    /* Sem `revelarRotulo`, o rótulo entra INTEIRO. Quem digita letra a letra
       é digitarNoQuadro(txt, t0, t1, 'rotulo'), que passa 0 aqui. */
    QUADRO_TXT.reveladoRotulo = (op.revelarRotulo === undefined)
      ? op.rotulo.length : op.revelarRotulo;
    QUADRO_TXT.caretRotulo = false;
  }
  if(op.definicao !== undefined){
    QUADRO_TXT.definicao = op.definicao;
    QUADRO_TXT.revelado  = op.revelado || 0;
    QUADRO_TXT.caret     = false;      // texto novo: sem barra de digitação
  }
  if(op.revelado !== undefined) QUADRO_TXT.revelado = op.revelado;
  pintarQuadro();
}

/* Quantos caracteres estão visíveis. `campo` é 'definicao' (padrão) ou
   'rotulo'. Só repinta se mudou algo — isto roda a cada frame da digitação e
   o canvas é grande. */
function quadroRevelar(n, caret, campo){
  const alvo   = (campo === 'rotulo') ? 'rotulo' : 'definicao';
  const chaveN = (alvo === 'rotulo') ? 'reveladoRotulo' : 'revelado';
  const chaveC = (alvo === 'rotulo') ? 'caretRotulo'    : 'caret';
  const novoN = clamp(Math.floor(n), 0, QUADRO_TXT[alvo].length);
  const novoC = !!caret;
  if(novoN === QUADRO_TXT[chaveN] && novoC === QUADRO_TXT[chaveC]) return;
  QUADRO_TXT[chaveN] = novoN;
  QUADRO_TXT[chaveC] = novoC;
  pintarQuadro();
}

/* Volta o quadro ao estado "só o título" — usado quando o painel de gráfico
   vai cobrir o quadro e o texto embaixo viraria sujeira visual. */
function quadroLimpar(){
  QUADRO_TXT.rotulo = ''; QUADRO_TXT.definicao = '';
  QUADRO_TXT.revelado = 0; QUADRO_TXT.caret = false;
  QUADRO_TXT.reveladoRotulo = 0; QUADRO_TXT.caretRotulo = false;
  pintarQuadro();
}

/* ---- Materiais prontos ---- */
/* Madeira realista para o tampo e os pés da bancada. */
function madeira(op){
  op = Object.assign({ repeteU:2.2, repeteV:1, cor:0xffffff, rugosidade:.62 }, op || {});
  const tex = texturaMadeira().clone();
  tex.needsUpdate = true;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(op.repeteU, op.repeteV);
  return new THREE.MeshStandardMaterial({
    map: tex, bumpMap: tex, bumpScale: .012,
    color: op.cor, roughness: op.rugosidade, metalness: .04,
    envMap: ambienteReflexo(), envMapIntensity: .35
  });
}
/* Metal escovado para tripés, bico de Bunsen e aros. */
function metal(op){
  op = Object.assign({ cor:0xb9bec4, rugosidade:.34, repete:1.4, intensidade:1.5 }, op || {});
  const tex = texturaMetal().clone();
  tex.needsUpdate = true;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(op.repete, op.repete);
  return new THREE.MeshStandardMaterial({
    map: tex, color: op.cor,
    metalness: .96, roughness: op.rugosidade,
    envMap: ambienteReflexo(), envMapIntensity: op.intensidade
  });
}

/* --------------------------- inicialização 3D --------------------------- */
function iniciar3D(){
  const cv = $('cena3d');
  renderer = new THREE.WebGLRenderer({ canvas:cv, antialias:true, alpha:false });
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  /* Sombras: é o que dava mais falta. Sem elas os béqueres pareciam colados
     na bancada por Photoshop, sem peso e sem contato com o tampo.
     PCFSoft com mapa de 1024 — a cena tem poucas dezenas de malhas, então o
     passe extra de profundidade é barato até no celular. */
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  /* Encoding LINEAR de propósito: assim as cores hex dos materiais aparecem
     como foram escolhidas na paleta do CSS. Com sRGBEncoding, o gama clareia
     demais os tons escuros e a bancada perde o clima de laboratório. */

  scene = new THREE.Scene();
  scene.background = new THREE.Color(CORES.bg);
  scene.fog = new THREE.Fog(CORES.bg, 14, 34);

  camera = new THREE.PerspectiveCamera(48, window.innerWidth/window.innerHeight, .1, 200);
  relogio = new THREE.Clock();

  /* Precisa do renderer pronto: gera o envMap (PMREM) usado pelos metais. */
  prepararAmbiente();

  /* Luzes — CALIBRADAS: no toon shading cada luz devolve até 1.0 de
     irradiância e elas SOMAM. Intensidades altas estouram a cena em branco.
     O total aqui fica ~1.24: um pouco abaixo do que era, porque a rampa toon
     agora tem o piso mais alto e a mesma soma clarearia demais.

     Nenhuma luz é vermelha: a rim light já foi rubi e banhava a sala de
     vinho. O contraste de temperatura vem da fill AZULADA contra a key
     branco-quente — é o que dá volume sem sujar a cor da madeira. */

  /* Ambiente. O chão da hemisférica é um marrom de madeira, não cinza: é a
     luz que ricocheteia do tampo e sobe. Sem esse quique, a barriga dos
     béqueres e a parte de baixo dos tripés ficavam mortas. */
  scene.add(new THREE.HemisphereLight(0xfff0e6, 0x3a3026, .30));

  /* KEY — a janela/luminária principal, alta e à direita. É a única que
     projeta sombra: duas sombras cruzadas em cena de bancada viram sujeira. */
  const key = new THREE.DirectionalLight(0xfff0d8, .52);
  key.position.set(5, 9, 6);
  key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024);
  /* Frustum colado na bancada (13 x 6) e não na cena inteira: quanto menor a
     caixa, mais texels de sombra sobram por centímetro e mais limpa fica a
     borda. near/far cobrem a distância da luz até o chão em -3.6. */
  const cs = key.shadow.camera;
  cs.left = -11; cs.right = 11; cs.top = 11; cs.bottom = -11;
  cs.near = 1;   cs.far = 30;
  /* normalBias é o que mata o acne (as listras na madeira): empurra a
     amostra ao longo da normal, em vez de achatar tudo com bias negativo,
     que descolaria a sombra do pé do objeto. */
  key.shadow.bias = -0.0005;
  key.shadow.normalBias = 0.03;
  scene.add(key); scene.add(key.target);

  /* FILL azulada, do lado oposto: abre a sombra sem apagá-la. */
  const fill = new THREE.DirectionalLight(CORES.frio, .16);
  fill.position.set(-6, 4, -4); scene.add(fill);

  /* RIM: lâmpada do teto entre a bancada e a parede. Separa a silhueta dos
     objetos do fundo escuro. */
  const rim = new THREE.PointLight(0xffe9d6, .26, 20);
  rim.position.set(0, 5.5, -3); scene.add(rim);

  irParaCamera(CAM_GERAL, false);
  window.addEventListener('resize', aoRedimensionar);
  aoRedimensionar();
}

function aoRedimensionar(){
  const w = window.innerWidth, h = window.innerHeight;
  if(renderer){ renderer.setSize(w, h, false); }
  if(camera){ camera.aspect = w / h; camera.updateProjectionMatrix(); }
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cvConfete.width = w * dpr; cvConfete.height = h * dpr;
  cvConfete.style.width = w + 'px'; cvConfete.style.height = h + 'px';
  /* Girar o aparelho troca o layout do texto do quadro (coluna larga em
     paisagem, estreita em retrato) — ver LAYOUT_QUADRO. */
  pintarQuadro();
}

/* -------------------- montagem / desmontagem de cenas -------------------- */
function limparGrupo(g){
  if(!g) return;
  g.traverse((o)=>{
    if(o.geometry) o.geometry.dispose();
    if(o.material){
      const ms = Array.isArray(o.material) ? o.material : [o.material];
      ms.forEach((m)=>{
        /* madeira()/metal() clonam a textura por material — liberamos os
           clones para não vazar VRAM a cada remontagem de cena.
           As texturas-BASE (madeira, metal, parede) são reaproveitadas entre
           cenas: se forem descartadas aqui, a próxima montagem renderiza sem
           elas. Por isso ficam registradas em TEXTURAS_COMPARTILHADAS. */
        ['map','bumpMap','roughnessMap','normalMap','emissiveMap'].forEach((k)=>{
          if(m[k] && !TEXTURAS_COMPARTILHADAS.has(m[k])) m[k].dispose();
        });
        m.dispose();
      });
    }
  });
  if(g.parent) g.parent.remove(g);
}
function desmontarCena(){
  /* Antes de descartar: limparGrupo() dá dispose() nos materiais, e um fade
     em curso continuaria escrevendo opacidade em material morto. */
  _fades.length = 0;
  limparGrupo(raizCena);
  raizCena = null; cenaMontada = null; bancada = null; arena = null;
  torneiras = null;              // foram junto com a raiz
  atualizadores.length = 0;
}
function novaRaiz(){
  desmontarCena();
  raizCena = new THREE.Group();
  scene.add(raizCena);
  return raizCena;
}

/* --------------------------------------------------------------------------
   SOMBRAS — quem projeta e quem recebe.
   Chamada no fim de cada preparar*(), porque as flags morrem junto com a cena.

   As três exclusões, e por quê:

   · userData.semSombra — as cascas de contorno() e qualquer coisa marcada à
     mão. Uma casca inflada projetaria uma segunda sombra maior que o objeto.
   · material transparente — vidro do béquer, bolhas, chama do Bunsen, caixa
     da arena. O mapa de sombras é binário: não enxerga opacidade, então o
     vidro projetaria uma mancha preta sólida, que é pior do que não projetar.
   · PlaneGeometry — parede, quadro, moldura e chão. São planos enormes; se
     projetassem, a parede jogaria sombra sobre a sala inteira. Recebem, que
     é o que interessa neles.
   -------------------------------------------------------------------------- */
function configurarSombras(raiz){
  if(!raiz) return;
  raiz.traverse((o)=>{
    if(!o.isMesh) return;
    if(o.userData.semSombra){ o.castShadow = false; o.receiveShadow = false; return; }
    const m = Array.isArray(o.material) ? o.material[0] : o.material;
    const opaco  = !!m && !m.transparent;
    const plano  = !!o.geometry && o.geometry.type === 'PlaneGeometry';
    o.castShadow    = opaco && !plano;
    o.receiveShadow = true;
    /* Guardado para desvanecer() saber ao que voltar depois de um fade. */
    o.userData._projeta0 = o.castShadow;
  });
}

/* -------------------------- peças reutilizáveis -------------------------- */

/* Tampo + pés da bancada + parede/quadro ao fundo. */
function criarSala(){
  const g = new THREE.Group();

  /* Tampo em MADEIRA (textura procedural com veios + bump). */
  const tampo = new THREE.Mesh(new THREE.BoxGeometry(13, .38, 6),
    madeira({ repeteU:3.0, repeteV:1.35, cor:0xdcc3a4, rugosidade:.58 }));
  tampo.position.set(0, -.19, 0); g.add(tampo);

  /* Friso da borda: madeira mais escura e mais fechada. */
  const borda = new THREE.Mesh(new THREE.BoxGeometry(13.2, .1, 6.2),
    madeira({ repeteU:6, repeteV:1, cor:0x8f6f52, rugosidade:.5 }));
  borda.position.set(0, .01, 0); g.add(borda);

  /* Pés de madeira escura. */
  [[-5.6, -2.2], [5.6, -2.2], [-5.6, 2.2], [5.6, 2.2]].forEach(([x, z])=>{
    const pe = new THREE.Mesh(new THREE.BoxGeometry(.3, 3.2, .3),
      madeira({ repeteU:1, repeteV:4, cor:0x7d5f45, rugosidade:.68 }));
    pe.position.set(x, -1.95, z); g.add(pe);
  });

  /* Parede + quadro de projeção ao fundo. */
  const parede = new THREE.Mesh(new THREE.PlaneGeometry(30, 16), toon(CORES.parede));
  parede.position.set(0, 4, -6.2); g.add(parede);

  /* O quadro carrega a textura de canvas onde o texto fica CRAVADO — ver
     texturaQuadro(). Como a textura é compartilhada e vive fora das cenas,
     o que estiver escrito sobrevive a toda remontagem de cena. */
  /* fog:false — a névoa da cena começa em 14 e o quadro fica a 11 (paisagem)
     ou 21 (retrato) da câmera da definição. Com névoa, o texto perderia mais
     de um terço do contraste justo no enquadramento em pé. */
  const quadro = new THREE.Mesh(new THREE.PlaneGeometry(10.5, 5.6),
    new THREE.MeshBasicMaterial({ map: texturaQuadro(), fog: false }));
  quadro.position.set(0, 3.4, -6.05); g.add(quadro);
  const moldura = new THREE.Mesh(new THREE.PlaneGeometry(11, 6.1), toon(CORES.moldura));
  moldura.position.set(0, 3.4, -6.1); g.add(moldura);
  g.userData.quadro = quadro;

  /* --- Parede LATERAL esquerda, no estilo "slide de apresentação" ---
     Fica além da bancada (que vai até x = -6.5) para não cortá-la.
     Enquadramento de referência:
       { theta: 1.50, phi: 1.38, dist: 4.7, target:[1.2,3.6,-1.1] }  = CAM_PAREDE
     MeshBasicMaterial de propósito: o desenho é tom sobre tom e as luzes da
     cena são fracas — com material que recebe luz, a marca d'água sumiria.
     O gradiente de "iluminação" já está pintado na própria textura. */
  const paredeLateral = new THREE.Mesh(
    new THREE.PlaneGeometry(22, 14),
    new THREE.MeshBasicMaterial({ map: texturaParedeSlide() })
  );
  paredeLateral.position.set(-7.4, 4, -1);
  paredeLateral.rotation.y = Math.PI / 2;   // vira a face para +X (para a cena)
  g.add(paredeLateral);
  g.userData.paredeLateral = paredeLateral;

  /* Chão discreto */
  const chao = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), toon(CORES.chao));
  chao.rotation.x = -Math.PI/2; chao.position.y = -3.6; g.add(chao);

  return g;
}

/* ---- Béquer com líquido, comprimido e bolhas.
   'taxa' controla quantas bolhas nascem por segundo = VELOCIDADE visual. ---- */
function criarBequer(op){
  op = Object.assign({ x:0, z:0, r:.75, h:1.7, corLiq:CORES.frio, taxa:.5, po:false }, op);
  const g = new THREE.Group();
  g.position.set(op.x, 0, op.z);

  /* copo (vidro) */
  const copo = new THREE.Mesh(
    new THREE.CylinderGeometry(op.r, op.r * .93, op.h, 26, 1, true), vidro());
  copo.position.y = op.h / 2 + .06; g.add(copo);

  const fundo = new THREE.Mesh(new THREE.CylinderGeometry(op.r*.93, op.r*.93, .08, 26), vidro());
  fundo.position.y = .1; g.add(fundo);

  const aro = new THREE.Mesh(new THREE.TorusGeometry(op.r, .045, 10, 34),
    metal({ cor:0xd6dde3, rugosidade:.22, repete:3 }));
  aro.rotation.x = Math.PI/2; aro.position.y = op.h + .06; g.add(aro);

  /* líquido */
  const alturaLiq = op.h * .68;
  const liq = new THREE.Mesh(
    new THREE.CylinderGeometry(op.r*.9, op.r*.87, alturaLiq, 26),
    toon(op.corLiq, { transparent:true, opacity:.72 }));
  liq.position.y = alturaLiq/2 + .12; g.add(liq);

  /* comprimido efervescente: inteiro (disco) ou em pó (grãozinhos) */
  const compr = new THREE.Group(); compr.position.y = .32; g.add(compr);
  function montarComprimido(emPo){
    while(compr.children.length) compr.remove(compr.children[0]);
    if(emPo){
      for(let i = 0; i < 26; i++){
        const gr = new THREE.Mesh(new THREE.IcosahedronGeometry(.055, 0), toon(0xf3f7ee));
        const a = Math.random() * Math.PI * 2, rr = Math.random() * op.r * .72;
        gr.position.set(Math.cos(a)*rr, Math.random()*.14, Math.sin(a)*rr);
        compr.add(gr);
      }
    } else {
      const d = new THREE.Mesh(new THREE.CylinderGeometry(.34, .34, .13, 22), toon(0xf3f7ee));
      compr.add(d);
    }
  }
  montarComprimido(op.po);

  /* pool de bolhas */
  const geoB = new THREE.SphereGeometry(.055, 8, 6);
  const matB = new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:.85 });
  const MAXB = 90, bolhas = [];
  for(let i = 0; i < MAXB; i++){
    const b = new THREE.Mesh(geoB, matB);
    b.visible = false; b.userData.viva = false;
    g.add(b); bolhas.push(b);
  }

  const est = { taxa: op.taxa, acumulador: 0, alturaLiq, r: op.r, po: op.po };

  function nascerBolha(){
    for(let i = 0; i < MAXB; i++){
      const b = bolhas[i];
      if(b.userData.viva) continue;
      const a = Math.random()*Math.PI*2, rr = Math.random()*est.r*.72;
      b.position.set(Math.cos(a)*rr, .3, Math.sin(a)*rr);
      const e = .5 + Math.random()*1.1;
      b.scale.setScalar(e);
      b.userData.viva = true;
      b.userData.vy = .55 + Math.random()*.8;
      b.userData.fase = Math.random()*6.28;
      b.visible = true;
      return;
    }
  }
  function atualizar(dt){
    est.acumulador += est.taxa * dt * 9;
    while(est.acumulador >= 1){ est.acumulador -= 1; nascerBolha(); }
    for(let i = 0; i < MAXB; i++){
      const b = bolhas[i];
      if(!b.userData.viva) continue;
      b.position.y += b.userData.vy * dt * (1 + est.taxa*.22);
      b.position.x += Math.sin(performance.now()*.004 + b.userData.fase) * dt * .12;
      if(b.position.y > alturaLiq + .1){ b.userData.viva = false; b.visible = false; }
    }
    /* leve balanço do líquido quando está rápido */
    liq.scale.x = liq.scale.z = 1 + Math.sin(performance.now()*.006) * .006 * est.taxa;
  }

  return {
    grupo:g, estado:est, atualizar,
    setTaxa(v){ est.taxa = v; },
    setPo(v){ est.po = v; montarComprimido(v); },
    setCorLiquido(c){ liq.material.color.setHex(c); },
    posicao(){ return new THREE.Vector3(op.x, op.h*.6, op.z); },
    /* usado no quiz 3D: alvo clicável */
    alvos: [copo, liq, fundo]
  };
}

/* ---- Bico de Bunsen com chama animada ---- */
function criarBunsen(x, z){
  const g = new THREE.Group(); g.position.set(x, 0, z);
  /* Bico de Bunsen: METAL escovado. */
  const base = new THREE.Mesh(new THREE.CylinderGeometry(.42, .5, .16, 24),
    metal({ cor:0x8f9499, rugosidade:.42, repete:2 }));
  base.position.y = .08; g.add(base);
  const tubo = new THREE.Mesh(new THREE.CylinderGeometry(.13, .16, 1.0, 20),
    metal({ cor:0xc2c8ce, rugosidade:.26, repete:1.2 }));
  tubo.position.y = .6; g.add(tubo);
  /* colar de regulagem de ar */
  const colar = new THREE.Mesh(new THREE.CylinderGeometry(.175, .175, .17, 20),
    metal({ cor:0x6f757b, rugosidade:.5, repete:2.4 }));
  colar.position.y = .3; g.add(colar);

  const chama = new THREE.Group(); chama.position.y = 1.08; chama.visible = false; g.add(chama);
  const c1 = new THREE.Mesh(new THREE.ConeGeometry(.20, .82, 14),
    new THREE.MeshBasicMaterial({ color:CORES.quente, transparent:true, opacity:.85 }));
  c1.position.y = .41; chama.add(c1);
  const c2 = new THREE.Mesh(new THREE.ConeGeometry(.11, .46, 12),
    new THREE.MeshBasicMaterial({ color:CORES.frio, transparent:true, opacity:.9 }));
  c2.position.y = .23; chama.add(c2);

  const luz = new THREE.PointLight(CORES.quente, 0, 6); luz.position.y = 1.4; g.add(luz);

  let ligado = false, intensidade = 0;
  function atualizar(dt){
    intensidade += ((ligado ? 1 : 0) - intensidade) * Math.min(1, dt * 3.2);
    chama.visible = intensidade > .02;
    const osc = 1 + Math.sin(performance.now()*.018) * .10;
    chama.scale.set(intensidade*osc, intensidade*(1.9 - osc*.9) , intensidade*osc);
    luz.intensity = intensidade * 1.6;
  }
  return {
    grupo:g, atualizar,
    ligar(v){ ligado = v; },
    estaLigado(){ return ligado; }
  };
}
