<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#150a09">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="imagens/icone-192.png">
<title>Cinética Química — Audiobook Animado</title>
<style>
/* ==========================================================================
   PALETA / TOKENS
   ========================================================================== */
:root{
  /* ---- TEMA VERMELHO (v1.0.2) ----------------------------------------
     A base é grafite-vinho, não mais verde-petróleo, para o app não se
     confundir com o de Ácidos. O acento de UI passou de verde-limão para
     rubi. O VERDE sobrou só como sinal de ACERTO no quiz (--acerto): num
     tema vermelho, marcar acerto de vermelho brigaria com o erro.        */
  --bg:        #150a09;   /* grafite-vinho escuro (base laboratório) */
  --bg2:       #24110f;
  --painel:    rgba(28,12,11,.88);
  --borda:     rgba(255,59,48,.30);
  --texto:     #f6ece9;
  --texto2:    #bda19b;

  --quente:    #ff9d33;   /* calor / energia de ativação */
  --fogo:      #ff5a3c;   /* vermelho-quente */
  --frio:      #6fb7ff;   /* frio / baixa energia */
  --rubi:      #ff3b30;   /* ACENTO PRINCIPAL da UI (era --lima) */
  --acerto:    #3ddc84;   /* verde esmeralda — só feedback de acerto */
  --roxo:      #c86bff;   /* catalisador / nova rota */
  --cinza:     #7f6f6c;   /* colisão não efetiva */

  --sombra:    0 10px 34px rgba(0,0,0,.55);
  --fonte:     'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
  --mono:      ui-monospace, 'Cascadia Code', 'Consolas', monospace;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{
  margin:0; padding:0; width:100%; height:100%; overflow:hidden;
  background:var(--bg); color:var(--texto); font-family:var(--fonte);
  overscroll-behavior:none; touch-action:manipulation;
}
/* --------------------------------------------------------------------------
   MOLDURA — o app é um aparelho EM PÉ, em qualquer tela
   --------------------------------------------------------------------------
   #app não é mais "a janela": é a moldura de um celular em pé. Numa tela de
   celular ela ocupa tudo; numa janela larga (computador, painel do VS Code
   deitado, celular virado) ela vira uma caixa vertical centrada, com o resto
   da tela em fundo neutro.

   Por que isso existe: o enquadramento da cena e o layout do quadro são
   calibrados para UM formato. Enquanto a janela podia ter qualquer proporção,
   havia duas calibragens para manter em sincronia e elas divergiam — o
   preview mostrava uma coisa e o aparelho outra. Com a moldura, existe um
   formato só, e o que se vê no computador É o que se vê no celular.

   O `transform` não é decoração: elemento transformado vira o BLOCO CONTENDOR
   dos descendentes `position:fixed`. É ele que faz todos os overlays (que são
   fixed) se posicionarem contra a moldura em vez de contra a janela, sem eu
   precisar tocar em nenhum deles.

   E é por isso que a moldura NÃO se centraliza com translate(-50%,-50%): o
   `transform` do #app é disputado. tremerTela() põe a classe .tremendo, cuja
   animação escreve transform próprio — uma centralização por transform seria
   descartada durante o tremor e a moldura pularia para o canto. Centralizar
   por `left` (calculado em px no JS) deixa o transform livre para tremer, e o
   translateZ(0) só precisa existir para o bloco contendor valer.

   --vw / --vh são 1% da MOLDURA, em px, escritos por ajustarMoldura(). O CSS
   inteiro usa calc(var(--vw)*N) no lugar de Nvw justamente porque vw/vh
   seguiriam a janela e escapariam da moldura — num monitor largo, um
   "92vw" viraria 1760px dentro de uma caixa de 519px de largura.

   --------------------------------------------------------------------------
   TAMANHO FIXO, E NÃO SÓ FORMATO FIXO
   --------------------------------------------------------------------------
   Fixar o ASPECTO igualou o 3D — que depende só de aspecto e FOV — e parou
   por aí. A interface continuou diferente, porque quase todo texto é
   clamp(min_px, N * --vw, max_px): numa moldura larga o termo do meio cresce,
   bate no `max` em px e trava. O título, por exemplo, é clamp(15px, 4.2·--vw,
   22px) — a 384 de largura dá 16px (4.2% da moldura), a 700 dá 22px travados
   (3.1%). Mesma cena 3D, tipografia proporcionalmente menor. Era essa a
   diferença que sobrava entre o preview e o aparelho.

   Agora a moldura tem TAMANHO fixo, 384x798 — a medida real do aparelho — e a
   caixa inteira é escalada para caber na janela. Tudo lá dentro passa a
   existir num único sistema de coordenadas: os mesmos --vw, os mesmos px, os
   mesmos clamps, o mesmo canvas. O que muda entre telas é só o fator de
   ampliação da imagem pronta, e ampliação uniforme não muda composição.

   A escala usa a propriedade `scale`, NÃO `transform: scale()`. tremerTela()
   escreve transform próprio e apagaria a escala junto — `scale` é propriedade
   separada, sobrevive ao tremor, e também serve de bloco contendor para os
   descendentes fixed.
   -------------------------------------------------------------------------- */
#app{
  position:fixed; inset:0; overflow:hidden;
  transform:translateZ(0);
  transform-origin:50% 50%;      /* a escala cresce a partir do centro da caixa */
  background:var(--bg);
  /* Valores de partida = 1% de 384x798. ajustarMoldura() reescreve no primeiro
     frame, mas eles precisam existir antes: sem valor, todo calc(var(--vw)*N)
     seria inválido, e uma declaração inválida derruba a regra inteira. */
  --vw:3.84px; --vh:7.98px;
}
/* .moldada solta o inset para o JS mandar em left/top/width/height. Fica
   sempre ligada — o inset:0 acima só vale no instante antes do primeiro
   ajustarMoldura(), para a tela de carregamento não nascer sem tamanho.
   .comBarras é separada porque a borda só existe quando sobra janela em volta;
   numa tela que a caixa preenche ela viraria um fio de 1px na beirada. */
#app.moldada{ inset:auto; }
#app.comBarras{
  box-shadow:0 0 0 1px rgba(255,255,255,.07), 0 24px 80px rgba(0,0,0,.6);
}
/* O fundo FORA da moldura. Sem isto, sobra o branco do documento. */
body{ background:#0a0908; }

/* --------------------------------------------------------------------------
   O CANVAS PRECISA DE TAMANHO EM CSS — e não tinha
   --------------------------------------------------------------------------
   Este era O bug do enquadramento, e ele fingiu ser tudo menos o que era.

   `position:fixed; inset:0` NÃO estica um <canvas>. Canvas é elemento
   SUBSTITUÍDO: com width/height em `auto`, o CSS usa a largura INTRÍNSECA —
   os atributos width/height do elemento — e, como left+right+width ficam
   sobrerrestritos, descarta o `right`. Ou seja: fica do tamanho dos atributos,
   ancorado no canto superior esquerdo.

   E renderer.setSize(w, h, false) escreve exatamente nesses atributos o valor
   w * devicePixelRatio, sem tocar no style — é o que o terceiro parâmetro
   `false` significa. Então o canvas era desenhado com 384*dpr PIXELS DE CSS
   dentro de uma moldura de 384, e o overflow:hidden cortava o excesso:

     preview  dpr 1.50 → canvas 576px em 384  → via-se 2/3 da imagem
     celular  dpr 3.75 → canvas 1152px em 384 → via-se 1/3 da imagem

   Dois terços contra um terço: o celular mostrava a cena 2x maior que o
   preview, ancorada no alto e à esquerda. Era o "zoom demais e em cima".

   Por que demorou a aparecer: o recorte é PROPORCIONAL, então aspecto e FOV
   continuavam batendo perfeitamente entre os aparelhos — todo o diagnóstico
   por esses números dava certo enquanto a imagem estava errada. E o
   #confete, logo abaixo, já tinha style.width/height escritos no JS, o que
   escondia o problema em metade das camadas.

   width/height em 100% resolvem de vez, e o setSize passa a atualizar o style
   também (terceiro parâmetro `true`), para os dois caminhos concordarem.
   -------------------------------------------------------------------------- */
canvas#cena3d{ position:fixed; inset:0; width:100%; height:100%; display:block; z-index:1; }

/* Vinheta suave por cima do 3D, pro texto brilhar */
#vinheta{
  position:fixed; inset:0; z-index:2; pointer-events:none;
  background:radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 40%, rgba(0,0,0,.55) 100%);
}

/* ==========================================================================
   ANIMAÇÕES REUTILIZÁVEIS ("dramáticas")
   ========================================================================== */
@keyframes popIn{
  0%{ transform:scale(.4) translateY(18px); opacity:0; }
  60%{ transform:scale(1.12) translateY(-4px); opacity:1; }
  100%{ transform:scale(1) translateY(0); opacity:1; }
}
@keyframes brilhar{
  0%,100%{ opacity:.35; } 50%{ opacity:1; }
}
@keyframes tremer{
  0%,100%{ transform:translate(0,0) }
  15%{ transform:translate(-11px,5px) rotate(-.5deg) }
  30%{ transform:translate(9px,-7px) rotate(.5deg) }
  45%{ transform:translate(-8px,-4px) }
  60%{ transform:translate(7px,6px) }
  75%{ transform:translate(-4px,3px) }
}
@keyframes flutuar{
  0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-7px) }
}
/* popar()/pulsar() são feitos em JS (Web Animations, composite:'add') para
   não destruir o transform de centralização — ver comentário no JS. */
.tremendo{ animation:tremer .5s ease-in-out both; }

/* ==========================================================================
   OVERLAYS BASE — tudo aparece/some pela classe .show
   ========================================================================== */
.overlay{
  position:fixed; z-index:20; opacity:0; visibility:hidden;
  transition:opacity .45s ease, visibility .45s, transform .45s cubic-bezier(.2,1.2,.4,1);
  pointer-events:none;
}
.overlay.show{ opacity:1; visibility:visible; pointer-events:auto; }
.overlay.semclique, .overlay.semclique.show{ pointer-events:none; }

/* ---------- Título / subtítulo (abertura de seção) ---------- */
#titulo{
  top:12%; left:0; right:0; text-align:center; transform:translateY(16px);
}
#titulo.show{ transform:translateY(0); }
#titulo h1{
  margin:0; font-size:clamp(28px,calc(var(--vw)*6.2),68px); font-weight:800; letter-spacing:.06em;
  text-transform:uppercase; line-height:1.05;
  background:linear-gradient(92deg,var(--rubi),var(--quente) 55%,var(--fogo));
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 6px 22px rgba(255,157,51,.35));
}
#titulo h2{
  margin:.5em auto 0; max-width:22ch; font-size:clamp(13px,calc(var(--vw)*2.4),22px);
  font-weight:500; color:var(--texto2); letter-spacing:.02em;
}

/* ---------- Legenda inferior (máquina de escrever) ---------- */
#legenda{
  left:50%; bottom:calc(var(--vh)*14); transform:translate(-50%,14px);
  width:min(calc(var(--vw)*92),900px); text-align:center;
}
#legenda.show{ transform:translate(-50%,0); }
#legenda .caixa{
  display:inline-block; padding:.65em 1.1em; border-radius:14px;
  background:var(--painel); border:1px solid var(--borda);
  box-shadow:var(--sombra); backdrop-filter:blur(9px);
  font-size:clamp(14px,calc(var(--vw)*2.5),23px); line-height:1.5; color:var(--texto);
}
#legenda .caixa .cursor{
  display:inline-block; width:.55ch; background:var(--rubi);
  animation:brilhar .8s steps(1) infinite; margin-left:2px;
}

/* ---------- Frase no TOPO da tela (dialogo1.1) ----------
   Largura contida para não passar por baixo do botão do sumário, que fica no
   canto superior esquerdo. */
#frase{
  left:50%; top:calc(10% + env(safe-area-inset-top)); transform:translate(-50%,-10px);
  width:min(calc(var(--vw)*80),640px); text-align:center;
}
#frase.show{ transform:translate(-50%,0); }
#frase .caixa{
  display:inline-block; padding:.6em 1em; border-radius:14px;
  background:var(--painel); border:1px solid var(--borda); box-shadow:var(--sombra);
  backdrop-filter:blur(9px);
  font-size:clamp(17px,calc(var(--vw)*4.3),25px); font-weight:700; line-height:1.4; color:var(--texto);
}

/* ---------- Divisão matemática (dialogo1.1) ----------
   Cada parte entra por conta própria: o numerador primeiro, depois o traço
   junto com o denominador. */
/* -40px sobe a divisão duas linhas do próprio corpo (~20px por linha). */
#divisao{
  left:50%; top:50%; transform:translate(-50%, calc(-50% - 40px));
  width:min(calc(var(--vw)*86),560px); text-align:center; z-index:30;
}
#divisao .miolo{ display:inline-block; }
#divisao .parte{
  font-size:clamp(16px,calc(var(--vw)*4.2),24px); font-weight:800; color:var(--quente);
  padding:.12em 0; opacity:0; transform:translateY(7px);
  transition:opacity .6s ease, transform .6s ease;
}
#divisao .parte.vis{ opacity:1; transform:translateY(0); }
#divisao .traco{
  height:3px; width:0; margin:.4em auto; border-radius:3px;
  background:linear-gradient(90deg,var(--rubi),var(--quente),var(--rubi));
  transition:width .55s cubic-bezier(.4,.05,.2,1);
}
#divisao .traco.vis{ width:100%; }

/* ---------- Equação do gotejamento (dialogo1.2) ----------
   Fica 1.5 linha acima de onde a divisão estava: -70px contra os -40px dela
   (a linha do corpo dá ~20px no celular). */
#equacao{
  left:50%; top:50%; transform:translate(-50%, calc(-50% - 70px));
  width:min(calc(var(--vw)*92),600px); text-align:center; z-index:31;
}
/* O "quadrado" que destaca a fórmula. */
#equacao .caixaEq{
  display:inline-flex; align-items:center; gap:.5em;
  padding:.75em 1.1em; border-radius:14px;
  background:rgba(26,11,10,.92); border:2px solid var(--quente);
  box-shadow:0 0 26px rgba(255,157,51,.22), var(--sombra);
  /* vw CRU aqui era divergência de preview: 4vw dá 15px no celular e estoura
     o teto de 23px num monitor, então a mesma equação vinha 50% maior no
     preview e a linha inteira ("V gotejamento = quantidade de gotas") passava
     da moldura. Com --vw a caixa mede o mesmo nos dois — ver o bloco da
     moldura no topo do CSS. */
  font-size:clamp(15px,calc(var(--vw)*4),23px); font-weight:800; color:var(--quente);
  line-height:1.25;
}
#equacao sub{ font-size:.46em; vertical-align:-.15em; letter-spacing:.02em; }

/* Par fantasma/tinta: o fantasma reserva a largura final, a tinta escreve. */
#equacao .escrita{ position:relative; display:inline-block; }
#equacao .fantasma{ visibility:hidden; font-style:normal; }
#equacao .tinta{
  position:absolute; left:0; top:0; white-space:nowrap; font-style:normal;
}

/* A fração empilha numerador, traço e denominador. */
#equacao .fracao{ display:inline-flex; flex-direction:column; align-items:center; }
#equacao .tracoEq{
  display:block; height:3px; width:0; margin:.28em 0; border-radius:3px;
  background:linear-gradient(90deg,var(--rubi),var(--quente),var(--rubi));
  transition:width .5s cubic-bezier(.4,.05,.2,1);
}
#equacao .tracoEq.vis{ width:100%; }

/* O RESULTADO ("Vₐ = 1 gota/s", aos 29 s) nasce FORA do fluxo. Os fantasmas
   reservam largura desde o primeiro frame, então se ele já estivesse na caixa
   aos 3 s a linha inteira — "V gotejamento = quantidade de gotas / intervalo
   de tempo" MAIS o resultado — teria de caber nos 384px da moldura, e não
   cabe. Quando ele entra, o lado esquerdo já encolheu para "Vₐ" e a fração
   para "2 gotas / 2 s". */
#equacao .resultado{ display:none; white-space:nowrap; }
#equacao .resultado.vis{ display:inline; }

/* Aos 34 s ele SAI DA CAIXA e voa para cima da torneira A.
   `position:fixed` e não um transform: com transform ele voaria, mas o buraco
   dele continuaria aberto no meio da fórmula. Fica DENTRO de #equacao de
   propósito — as regras de .escrita/.tinta/sub são todas escopadas nele, e um
   reparent para o #app apagaria a formatação inteira. Em troca, o bloco
   contentor do fixed passa a ser o próprio #equacao (ele tem transform), e é
   por isso que moverResultadoParaTorneira() mede tudo a partir do canto dele.
   A pílula repete a do sprite de anotação (fundo .88, borda de 2px na cor),
   porque é o lugar de uma anotação que ele vai ocupar. */
#equacao .resultado.voando{
  display:inline-block; position:fixed; transform:translate(-50%,-50%);
  padding:.3em .7em; border-radius:999px;
  background:rgba(18,17,16,.88); border:2px solid var(--quente);
  box-shadow:0 0 18px rgba(255,157,51,.28);
  transition:left 1s cubic-bezier(.4,.05,.2,1),
             top  1s cubic-bezier(.4,.05,.2,1),
             transform 1s cubic-bezier(.4,.05,.2,1);
}

/* ---------- Cartão de fórmula ---------- */
#formula{
  left:50%; top:16%; transform:translate(-50%,-14px) scale(.9);
}
#formula.show{ transform:translate(-50%,0) scale(1); }
#formula .caixa{
  font-family:var(--mono); font-size:clamp(19px,calc(var(--vw)*4.4),44px); font-weight:700;
  padding:.5em .95em; border-radius:16px; letter-spacing:.03em;
  background:linear-gradient(180deg,rgba(34,16,14,.95),rgba(26,11,10,.95));
  border:1.5px solid var(--quente); color:var(--quente);
  box-shadow:0 0 34px rgba(255,157,51,.28), var(--sombra);
  white-space:nowrap;
}

/* ---------- Etiquetas flutuantes (badges de conceito) ---------- */
#badges{
  left:50%; top:22%; transform:translateX(-50%);
  display:flex; gap:10px; flex-wrap:wrap; justify-content:center;
  width:min(calc(var(--vw)*94),860px);
}
.badge{
  padding:.45em .95em; border-radius:999px; font-size:clamp(12px,calc(var(--vw)*2.1),17px);
  font-weight:700; letter-spacing:.02em; border:1.5px solid currentColor;
  background:rgba(26,11,10,.85); box-shadow:var(--sombra);
  animation:popIn .5s cubic-bezier(.2,1.5,.4,1) both, flutuar 3.2s ease-in-out infinite;
}
.badge.quente{ color:var(--quente) } .badge.frio{ color:var(--frio) }
.badge.rubi{ color:var(--rubi) }     .badge.roxo{ color:var(--roxo) }
.badge.acerto{ color:var(--acerto) }
.badge.fogo{ color:var(--fogo) }     .badge.cinza{ color:var(--cinza) }

/* ==========================================================================
   PAINEL DE GRÁFICOS (SVG) — o "coração didático"
   ========================================================================== */
#painelGrafico{
  left:50%; top:50%; transform:translate(-50%,-46%) scale(.92);
  /* O terceiro termo (140 de altura) é uma trava de ALTURA disfarçada de
     largura: os SVG têm viewBox 560x330, então a altura acompanha a largura
     (≈ w/1.7 + cabeçalho). Sem ela, uma moldura baixa esticaria o painel para
     760px e o gráfico sairia cortado em cima e embaixo. */
  width:min(calc(var(--vw)*94),760px,calc(var(--vh)*140));
}
#painelGrafico.show{ transform:translate(-50%,-50%) scale(1); }
#painelGrafico .moldura{
  position:relative; border-radius:18px; padding:14px 14px 10px;
  background:linear-gradient(180deg,rgba(30,14,12,.94),rgba(20,10,9,.96));
  border:1px solid var(--borda); box-shadow:var(--sombra);
  backdrop-filter:blur(10px);
}
#painelGrafico .cabG{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  margin:0 4px 6px; min-height:26px;
}
#painelGrafico .tituloG{
  font-size:clamp(12px,calc(var(--vw)*2.1),17px); font-weight:700; letter-spacing:.08em;
  text-transform:uppercase; color:var(--rubi);
}
/* Fórmula exibida DENTRO do painel: o overlay #formula central ficaria
   coberto pelo painel de gráfico, que ocupa quase toda a tela. */
#painelGrafico .formG{
  font-family:var(--mono); font-weight:800; letter-spacing:.02em;
  font-size:clamp(13px,calc(var(--vw)*2.3),21px); color:var(--quente);
  padding:.18em .6em; border-radius:9px; white-space:nowrap;
  border:1.5px solid transparent; opacity:0;
  transition:opacity .35s ease;
}
#painelGrafico .formG.vis{
  opacity:1; border-color:var(--quente);
  background:rgba(26,11,10,.9); box-shadow:0 0 20px rgba(255,157,51,.25);
}
#painelGrafico svg{ width:100%; height:auto; display:block; overflow:visible; }
.g-oculto{ display:none !important; }

/* Elementos comuns dos SVG */
.eixo{ stroke:#8a726c; stroke-width:2; }
.eixo-txt{ fill:var(--texto2); font-size:14px; font-family:var(--fonte); }
.grade{ stroke:rgba(255,255,255,.06); stroke-width:1; }
.rotulo{ font-size:15px; font-weight:700; font-family:var(--fonte); }
.tracejado{ stroke-dasharray:6 6; }
.curva{ fill:none; stroke-linecap:round; stroke-linejoin:round; stroke-width:4; }
.desenhavel{ transition:stroke-dashoffset 1.4s cubic-bezier(.4,.05,.2,1); }
.aparece{ opacity:0; transition:opacity .5s ease, transform .5s cubic-bezier(.2,1.4,.4,1); }
.aparece.vis{ opacity:1; }
/* pulsar() escala grupos <g> do SVG: sem fill-box a origem vira o canto
   do viewport do SVG e a seta "salta" em vez de pulsar no lugar. */
#painelGrafico svg g{ transform-box:fill-box; transform-origin:center; }

/* ---------- Termômetro (fixo à esquerda) ---------- */
#termometro{ left:16px; top:50%; transform:translateY(-50%) scale(.9); }
#termometro.show{ transform:translateY(-50%) scale(1); }
#termometro .caixa{
  padding:10px 12px; border-radius:16px; background:var(--painel);
  border:1px solid var(--borda); box-shadow:var(--sombra); text-align:center;
}
#termometro .valor{
  font-family:var(--mono); font-weight:800; font-size:16px; color:var(--quente);
  margin-top:6px;
}

/* ==========================================================================
   BOTÃO DE PLAY
   ========================================================================== */
#play{
  left:50%; bottom:calc(var(--vh)*4.5); transform:translate(-50%,10px);
  z-index:40;
}
#play.show{ transform:translate(-50%,0); }
#btnPlay{
  display:flex; align-items:center; gap:12px; cursor:pointer;
  padding:14px 30px 14px 22px; border-radius:999px; border:0;
  font-family:var(--fonte); font-size:clamp(15px,calc(var(--vw)*2.6),20px); font-weight:800;
  letter-spacing:.03em; color:#ffece9;
  background:linear-gradient(135deg,var(--rubi),#c4160e);
  box-shadow:0 10px 30px rgba(255,59,48,.35), 0 0 0 6px rgba(255,59,48,.10);
  transition:transform .18s cubic-bezier(.2,1.6,.4,1), box-shadow .2s;
}
#btnPlay:active{ transform:scale(.94); }
#btnPlay .ico{
  width:30px; height:30px; border-radius:50%; background:#ffece9; color:var(--rubi);
  display:grid; place-items:center; font-size:15px;
}

/* ==========================================================================
   SUMÁRIO (navegação rápida)
   ========================================================================== */
#btnSumario{
  position:fixed; z-index:45; top:calc(12px + env(safe-area-inset-top)); left:12px;
  width:46px; height:46px; border-radius:14px; border:1px solid var(--borda);
  background:var(--painel); color:var(--rubi); cursor:pointer;
  display:grid; place-items:center; gap:4px; box-shadow:var(--sombra);
  backdrop-filter:blur(8px); transition:transform .18s;
}
#btnSumario:active{ transform:scale(.9); }
#btnSumario span{ display:block; width:20px; height:2.5px; border-radius:2px; background:currentColor; }

#sumario{
  top:0; left:0; bottom:0; width:min(calc(var(--vw)*86),360px); transform:translateX(-104%);
  z-index:60; background:linear-gradient(180deg,#0d1e19,#081411);
  border-right:1px solid var(--borda); box-shadow:12px 0 40px rgba(0,0,0,.6);
  padding:calc(18px + env(safe-area-inset-top)) 14px 18px; overflow-y:auto;
  opacity:1; visibility:hidden;
}
#sumario.show{ transform:translateX(0); visibility:visible; }
#sumario h3{
  margin:6px 0 14px 6px; font-size:13px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--rubi);
}
.item-sum{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  padding:11px 12px; margin-bottom:7px; border-radius:12px; cursor:pointer;
  background:rgba(255,255,255,.035); border:1px solid transparent;
  color:var(--texto); font-family:var(--fonte); font-size:15px; font-weight:600;
  transition:background .15s, border-color .15s, transform .12s;
}
.item-sum:active{ transform:scale(.98); }
.item-sum:hover{ background:rgba(255,59,48,.10); border-color:var(--borda); }
.item-sum.atual{ background:rgba(255,59,48,.16); border-color:var(--rubi); }
.item-sum .n{
  width:26px; height:26px; flex:0 0 26px; border-radius:8px; display:grid; place-items:center;
  background:rgba(255,59,48,.18); color:var(--rubi); font-size:12px; font-weight:800;
}
#fundoSum{
  position:fixed; inset:0; z-index:55; background:rgba(0,0,0,.55);
  opacity:0; visibility:hidden; transition:opacity .3s, visibility .3s;
}
#fundoSum.show{ opacity:1; visibility:visible; }

/* ==========================================================================
   QUIZ
   ========================================================================== */
/* -92px = três linhas e meia do enunciado (1.45 de entrelinha sobre ~18px de
   fonte no celular). Solta a pergunta do meio da tela e deixa o respiro
   embaixo, onde ficam a legenda e o botão de áudio. */
#quiz{
  left:50%; top:50%; transform:translate(-50%, calc(-50% - 92px));
  width:min(calc(var(--vw)*96),880px); z-index:35;
}
.quiz-card{
  background:linear-gradient(180deg,rgba(32,15,13,.96),rgba(20,10,9,.97));
  border:1px solid var(--borda); border-radius:20px; box-shadow:var(--sombra);
  padding:18px 18px 16px; backdrop-filter:blur(10px);
  transition:transform .5s cubic-bezier(.4,.05,.2,1), opacity .5s;
}
.quiz-card.sai-direita{ transform:translateX(125%); opacity:0; }
.quiz-card.entra-esquerda{ transform:translateX(-125%); opacity:0; transition:none; }

.quiz-topo{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  margin-bottom:10px;
}
.quiz-passo{
  font-size:12px; letter-spacing:.14em; text-transform:uppercase; font-weight:800;
  color:var(--rubi);
}
.quiz-pontos{ font-size:12px; color:var(--texto2); font-family:var(--mono); }
.quiz-barra{ height:4px; border-radius:4px; background:rgba(255,255,255,.08); overflow:hidden; margin-bottom:12px; }
.quiz-barra i{ display:block; height:100%; width:0; background:linear-gradient(90deg,var(--rubi),var(--quente)); transition:width .5s; }

.quiz-enunciado{
  font-size:clamp(15px,calc(var(--vw)*2.6),22px); font-weight:600; line-height:1.45; margin:0 0 12px;
}
.quiz-figura{ display:flex; justify-content:center; margin:0 0 12px; }
.quiz-figura svg{ max-width:100%; height:auto; }
.quiz-figura .emoji{ font-size:clamp(38px,calc(var(--vw)*9),66px); line-height:1; }

.quiz-alts{ display:grid; gap:9px; }
.quiz-alts.duas-col{ grid-template-columns:1fr 1fr; }
/* O :not(.compacta) importa: alternativas longas empilham em tela estreita,
   mas as compactas são curtas de propósito e devem ficar lado a lado. */
@media(max-width:560px){ .quiz-alts.duas-col:not(.compacta){ grid-template-columns:1fr; } }

/* COMPACTA — para respostas de uma palavra ("Torneira A" / "Torneira B").
   Dois botões estreitos, centrados no card, sem o selo de letra à esquerda:
   ali o selo repetiria a informação que já está escrita no botão. */
.quiz-alts.compacta{
  grid-template-columns:repeat(2, minmax(0, 1fr));
  max-width:340px; margin:0 auto; gap:10px;
}
.quiz-alts.compacta .alt{ justify-content:center; text-align:center; padding:13px 10px; }

.alt{
  display:flex; align-items:center; gap:11px; text-align:left; cursor:pointer;
  padding:12px 14px; border-radius:13px; font-family:var(--fonte);
  font-size:clamp(14px,calc(var(--vw)*2.3),18px); font-weight:600; color:var(--texto);
  background:rgba(255,255,255,.04); border:1.5px solid rgba(255,255,255,.09);
  transition:background .15s, border-color .15s, transform .12s, opacity .3s;
  opacity:0; transform:translateY(10px);
}
.alt.vis{ opacity:1; transform:translateY(0); transition:opacity .4s, transform .4s cubic-bezier(.2,1.4,.4,1), background .15s, border-color .15s; }
.alt:active{ transform:scale(.98); }
.alt:hover{ background:rgba(255,59,48,.10); border-color:var(--borda); }
.alt .letra{
  width:28px; height:28px; flex:0 0 28px; border-radius:9px; display:grid; place-items:center;
  background:rgba(255,255,255,.08); font-weight:800; font-size:13px; color:var(--texto2);
}
/* Acerto usa --acerto (verde); erro usa --fogo. Num tema vermelho, marcar
   acerto de vermelho brigaria com a sinalização de erro. */
.alt.certa{ background:rgba(61,220,132,.18); border-color:var(--acerto); color:#fff; }
.alt.certa .letra{ background:var(--acerto); color:#0d2a1a; }
.alt.errada{ background:rgba(255,90,60,.18); border-color:var(--fogo); }
.alt.errada .letra{ background:var(--fogo); color:#fff; }
.alt.travada{ pointer-events:none; }
.alt.apagada{ opacity:.4; }

/* --- Cards de figura clicáveis (ex.: qual colisão forma produto) --- */
.quiz-figs{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
@media(max-width:520px){ .quiz-figs{ grid-template-columns:1fr; } }
.fig-alt{
  cursor:pointer; border-radius:15px; padding:10px; text-align:center;
  background:rgba(255,255,255,.04); border:1.5px solid rgba(255,255,255,.09);
  transition:background .15s, border-color .15s, transform .12s;
  opacity:0; transform:translateY(10px);
}
.fig-alt.vis{ opacity:1; transform:translateY(0); transition:opacity .4s, transform .4s cubic-bezier(.2,1.4,.4,1); }
.fig-alt:active{ transform:scale(.97); }
.fig-alt .rot{ margin-top:6px; font-weight:700; font-size:15px; color:var(--texto2); }
.fig-alt.certa{ background:rgba(61,220,132,.16); border-color:var(--acerto); }
.fig-alt.certa .rot{ color:var(--acerto); }
.fig-alt.errada{ background:rgba(255,90,60,.16); border-color:var(--fogo); }
.fig-alt.travada{ pointer-events:none; }

/* --- Arrastar e soltar --- */
.dnd-alvos{ display:grid; grid-template-columns:repeat(4,1fr); gap:9px; margin-bottom:14px; }
@media(max-width:620px){ .dnd-alvos{ grid-template-columns:repeat(2,1fr); } }
.dnd-alvo{
  min-height:82px; border-radius:14px; padding:8px 6px; text-align:center;
  border:2px dashed rgba(255,255,255,.18); background:rgba(255,255,255,.03);
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:6px;
  transition:border-color .15s, background .15s;
}
.dnd-alvo .cab{ font-size:12px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; color:var(--texto2); }
.dnd-alvo.sobre{ border-color:var(--rubi); background:rgba(255,59,48,.12); }
.dnd-alvo.ok{ border-style:solid; border-color:var(--acerto); background:rgba(61,220,132,.10); }
.dnd-alvo.nok{ border-style:solid; border-color:var(--fogo); }
.dnd-chips{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; min-height:44px; }
.chip{
  padding:9px 13px; border-radius:11px; font-size:14px; font-weight:700; cursor:grab;
  background:linear-gradient(180deg,rgba(255,59,48,.20),rgba(255,59,48,.08));
  border:1.5px solid var(--borda); color:var(--texto); user-select:none;
  touch-action:none; transition:transform .12s, box-shadow .15s;
}
.chip.arrastando{ position:fixed; z-index:200; cursor:grabbing; transform:scale(1.06) rotate(-2deg); box-shadow:0 14px 30px rgba(0,0,0,.6); pointer-events:none; }
.chip.encaixado{ font-size:12.5px; padding:6px 9px; cursor:default; }
/* --- Botão de ação dentro do quiz (ex.: "conferir", "clique na cena") --- */
.quiz-acao{
  margin:12px auto 0; display:block; padding:11px 24px; border-radius:999px; border:0;
  font-family:var(--fonte); font-weight:800; font-size:16px; cursor:pointer; color:#ffece9;
  background:linear-gradient(135deg,var(--rubi),#c4160e); box-shadow:0 8px 22px rgba(255,59,48,.3);
}
.quiz-acao[disabled]{ opacity:.4; pointer-events:none; }

/* --- Aviso "responda na cena 3D" --- */
#quiz3dAviso{
  left:50%; bottom:calc(var(--vh)*16); transform:translate(-50%,10px); z-index:35;
  width:min(calc(var(--vw)*92),620px); text-align:center;
}
#quiz3dAviso.show{ transform:translate(-50%,0); }
#quiz3dAviso .caixa{
  display:inline-block; padding:.7em 1.2em; border-radius:14px;
  background:var(--painel); border:1.5px solid var(--roxo); color:var(--texto);
  box-shadow:0 0 30px rgba(200,107,255,.25), var(--sombra);
  font-size:clamp(14px,calc(var(--vw)*2.4),20px); font-weight:700;
}

/* ==========================================================================
   EFEITOS: confete, flash vermelho, selo de versão, HUD câmera livre
   ========================================================================== */
#confete{ position:fixed; inset:0; width:100%; height:100%; z-index:90; pointer-events:none; }
#flashVermelho{
  position:fixed; inset:0; z-index:88; pointer-events:none; opacity:0;
  background:radial-gradient(ellipse at center, rgba(255,60,40,.15), rgba(255,30,20,.55));
  transition:opacity .12s;
}
#flashVermelho.on{ opacity:1; }
#flashBranco{
  position:fixed; inset:0; z-index:88; pointer-events:none; opacity:0;
  background:#fff; transition:opacity .35s;
}
#flashBranco.on{ opacity:.75; transition:opacity .06s; }

/* ---- Botão de áudio: play/pause + anel de progresso ----
   Fica no canto inferior DIREITO; por isso o selo de versão e o HUD da
   câmera livre foram para o canto esquerdo. */
#botaoAudio{
  position:fixed; z-index:72;
  right:calc(12px + env(safe-area-inset-right));
  bottom:calc(12px + env(safe-area-inset-bottom));
  width:64px; height:64px; padding:0; border:1px solid var(--borda);
  border-radius:50%; background:var(--painel); color:var(--rubi);
  cursor:pointer; display:grid; place-items:center;
  box-shadow:var(--sombra); backdrop-filter:blur(8px);
  opacity:0; visibility:hidden;
  transition:opacity .35s, visibility .35s, transform .16s, box-shadow .3s;
}
#botaoAudio.show{ opacity:1; visibility:visible; }
/* Depois de .show de propósito: no quiz, com o áudio da questão terminado, o
   botão não tem para onde avançar (quem navega é a engine). Apagado, ele
   avisa que ali não há mais nada para clicar. */
#botaoAudio.inerte{ opacity:.3; pointer-events:none; }
#botaoAudio:active{ transform:scale(.92); }

/* O anel ocupa a borda inteira do botão; o -90° faz o preenchimento começar
   às 12h em vez de às 3h. */
#botaoAudio .anel{
  position:absolute; inset:0; width:100%; height:100%;
  transform:rotate(-90deg); pointer-events:none;
}
#botaoAudio .trilhaA{ fill:none; stroke:rgba(255,59,48,.16); stroke-width:5; }
#botaoAudio .progA{
  fill:none; stroke:var(--rubi); stroke-width:5; stroke-linecap:round;
}
/* Glifo em SVG, e não em texto: "▶" e "❚❚" mudam de desenho e de largura
   conforme a fonte que o aparelho tiver. */
#botaoAudio .glifo{ position:relative; width:26px; height:26px; fill:currentColor; }
#botaoAudio .gPause{ display:none; }
#botaoAudio.tocando .gPlay{ display:none; }
#botaoAudio.tocando .gPause{ display:block; }

/* Fim de faixa: o botão chama a atenção para o próximo clique. */
#botaoAudio.pronto{
  box-shadow:var(--sombra), 0 0 0 0 rgba(255,59,48,.5);
  animation:chamarBotao 1.8s ease-out infinite;
}
@keyframes chamarBotao{
  0%   { box-shadow:var(--sombra), 0 0 0 0 rgba(255,59,48,.45); }
  70%  { box-shadow:var(--sombra), 0 0 0 14px rgba(255,59,48,0); }
  100% { box-shadow:var(--sombra), 0 0 0 0 rgba(255,59,48,0); }
}

#versao{
  position:fixed; z-index:70; left:10px; bottom:calc(8px + env(safe-area-inset-bottom));
  padding:5px 11px; border-radius:999px; cursor:pointer; user-select:none;
  font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.06em;
  color:var(--rubi); background:rgba(26,11,10,.75); border:1px solid var(--borda);
  transition:transform .15s, background .2s;
}
#versao:active{ transform:scale(.9); }
#versao.livre{ color:#ffece9; background:var(--rubi); }

/* HUD compacto: só o título e o botão de copiar. */
#hudCamera{
  position:fixed; z-index:70; left:10px; bottom:46px; display:none;
  width:max-content; min-width:124px; max-width:calc(var(--vw)*60);
  padding:8px 9px 9px; border-radius:12px; text-align:center;
  background:rgba(26,11,10,.94); border:1px solid var(--rubi);
  box-shadow:var(--sombra); backdrop-filter:blur(6px);
}
#hudCamera.on{ display:block; }
#hudCamera b{
  display:block; font-family:var(--fonte); font-size:10.5px; font-weight:800;
  letter-spacing:.13em; text-transform:uppercase; color:var(--rubi);
  margin-bottom:7px; line-height:1;
}
/* Leitura do formato da janela: monoespaçada, porque são números para ler e
   comparar entre aparelhos, não texto de interface. */
#hudTela{
  display:block; font-family:ui-monospace, "Cascadia Mono", Consolas, monospace;
  font-size:10.5px; line-height:1.45; color:rgba(255,236,232,.72);
  white-space:nowrap; margin-bottom:7px;
}
/* Dica de pan por mouse: só onde existe mouse. `pointer: coarse` é o dedo. */
#hudDica{
  display:block; font-family:var(--fonte); font-size:10px; font-weight:700;
  letter-spacing:.04em; color:rgba(255,157,51,.80);
  white-space:nowrap; margin-bottom:7px;
}
@media (pointer: coarse){ #hudDica{ display:none; } }

#hudCamera button{
  display:block; width:100%; padding:9px 12px; border-radius:9px;
  border:1px solid var(--rubi); background:rgba(255,59,48,.14); color:var(--rubi);
  font-family:var(--fonte); font-size:12px; font-weight:700; white-space:nowrap;
  cursor:pointer; transition:background .15s, transform .12s;
}
#hudCamera button:active{ background:rgba(255,59,48,.34); transform:scale(.96); }

/* Em câmera livre o canvas engole os gestos do navegador (pinça/scroll),
   senão o Chrome do celular faz zoom da página em vez de mover a câmera. */
canvas#cena3d.livre{ touch-action:none; cursor:grab; }
canvas#cena3d.livre:active{ cursor:grabbing; }

/* Aviso curto no rodapé (copiado, câmera livre ligada…) */
/* 88px, e não 46: abaixo disso o toast passava por trás do botão de áudio. */
#toast{
  position:fixed; z-index:95; left:50%; bottom:calc(88px + env(safe-area-inset-bottom));
  transform:translate(-50%,12px); opacity:0; visibility:hidden; pointer-events:none;
  padding:8px 16px; border-radius:999px; max-width:calc(var(--vw)*88); text-align:center;
  font-family:var(--fonte); font-size:13px; font-weight:700; letter-spacing:.02em;
  background:rgba(26,11,10,.95); border:1px solid var(--rubi); color:var(--rubi);
  box-shadow:var(--sombra); backdrop-filter:blur(6px);
  transition:opacity .25s ease, visibility .25s, transform .25s cubic-bezier(.2,1.4,.4,1);
}
#toast.show{ opacity:1; visibility:visible; transform:translate(-50%,0); }
/* Plano B do copiar: o texto precisa dar para selecionar com o dedo. */
#toast.selecionavel{
  pointer-events:auto; user-select:text; -webkit-user-select:text;
  font-family:var(--mono); font-size:12px; font-weight:600; line-height:1.5;
}

/* ---- Anel do "segurar 3s para copiar" ---- */
#segurar{
  position:fixed; z-index:96; width:86px; height:86px; margin:-43px 0 0 -43px;
  pointer-events:none; opacity:0; visibility:hidden;
  transition:opacity .18s ease, visibility .18s;
}
#segurar.on{ opacity:1; visibility:visible; }
#segurar svg{ width:100%; height:100%; transform:rotate(-90deg); display:block; }
#segurar .trilha{ fill:rgba(26,11,10,.72); stroke:rgba(255,59,48,.25); stroke-width:6; }
#segurar .prog{
  fill:none; stroke:var(--rubi); stroke-width:6; stroke-linecap:round;
  stroke-dasharray:270.2; stroke-dashoffset:270.2;
}
#segurar.on .prog{ animation:encherAnel var(--dur-segurar,3s) linear forwards; }
@keyframes encherAnel{ to{ stroke-dashoffset:0; } }
#segurar span{
  position:absolute; inset:0; display:grid; place-items:center;
  font-family:var(--fonte); font-size:11px; font-weight:800; letter-spacing:.06em;
  color:var(--rubi); text-transform:uppercase;
}

/* Tela de carregamento */
#carregando{
  position:fixed; inset:0; z-index:120; display:grid; place-items:center;
  background:var(--bg); transition:opacity .6s, visibility .6s;
}
#carregando.sumiu{ opacity:0; visibility:hidden; }
#carregando .miolo{ text-align:center; }
#carregando .anel{
  width:56px; height:56px; margin:0 auto 18px; border-radius:50%;
  border:4px solid rgba(255,59,48,.18); border-top-color:var(--rubi);
  animation:girar 1s linear infinite;
}
@keyframes girar{ to{ transform:rotate(360deg) } }
#carregando p{ margin:0; color:var(--texto2); font-size:14px; letter-spacing:.1em; text-transform:uppercase; }

/* Aviso de áudio ausente (modo demonstração) */
#avisoAudio{
  position:fixed; z-index:70; left:50%; top:calc(10px + env(safe-area-inset-top));
  transform:translateX(-50%); padding:6px 13px; border-radius:999px;
  font-size:11.5px; font-weight:700; letter-spacing:.04em;
  background:rgba(255,157,51,.16); border:1px solid rgba(255,157,51,.5); color:var(--quente);
  opacity:0; visibility:hidden; transition:opacity .4s, visibility .4s;
}
#avisoAudio.show{ opacity:1; visibility:visible; }

/* ==========================================================================
   AJUSTES DE RETRATO — agora INCONDICIONAIS
   --------------------------------------------------------------------------
   Isto era um @media (orientation: portrait). Deixou de ser: a moldura é
   sempre em pé, então a condição valia sempre e a media query só enganava
   quem lesse. Pior — a media query pergunta pela ORIENTAÇÃO DA JANELA, não
   pela da moldura, então num computador (janela deitada, moldura em pé) ela
   dava FALSO e o app usava a tipografia de paisagem dentro de um quadro
   vertical. Era um dos jeitos do preview mentir sobre o aparelho.

   Continuam sendo sobrescritas de propósito, e não valores mesclados nas
   regras-base: aqui em baixo elas vencem por ordem de fonte, e manter o bloco
   separado deixa claro o que é ajuste de tela estreita e o que é a regra
   geral. O que cada uma resolve:

   1) TIPOGRAFIA. Quase todo texto usa clamp(min, N * --vw, max). Numa moldura
      de ~390px, 1 unidade de --vw vale ~3,9px, então TODO clamp cairia no
      mínimo e a narração ficaria miúda. Aqui subimos só os mínimos.
   2) GRÁFICOS SVG. O painel encolhe para 94 de largura (~366px) e o viewBox
      560x330 é reduzido junto, levando os rótulos a ~9px reais. Aumentamos as
      fontes DENTRO do viewBox para compensar.
   3) FOLGA VERTICAL. Sobra altura numa tela em pé: a legenda desce um pouco e
      o painel de gráfico volta ao centro exato, sem encostar no rodapé.
   ========================================================================== */

/* ---- 1) tipografia ---- */
#titulo h2            { font-size:clamp(15px,calc(var(--vw)*4.2),22px); }
#legenda .caixa       { font-size:clamp(17px,calc(var(--vw)*4.4),23px); }
#formula .caixa       { font-size:clamp(21px,calc(var(--vw)*5.6),44px); }
.badge                { font-size:clamp(14px,calc(var(--vw)*3.6),17px); }
.quiz-enunciado       { font-size:clamp(17px,calc(var(--vw)*4.6),22px); }
#quiz3dAviso .caixa   { font-size:clamp(16px,calc(var(--vw)*4.2),20px); }
.alt                  { font-size:clamp(15px,calc(var(--vw)*4),18px); }

/* ---- 2) gráficos ---- */
#painelGrafico .tituloG{ font-size:clamp(12px,calc(var(--vw)*3),17px); }
#painelGrafico .formG  { font-size:clamp(14px,calc(var(--vw)*3.6),21px); }
/* Título e fórmula lado a lado não cabem num painel de ~330px úteis. */
#painelGrafico .cabG   { flex-wrap:wrap; justify-content:center; }
.eixo-txt{ font-size:21px; }   /* 14px no viewBox → ~14px reais em pé */
.rotulo  { font-size:23px; }   /* 15px no viewBox                      */

/* ---- 3) folga vertical ---- */
#painelGrafico       { transform:translate(-50%,-50%) scale(.92); }
#painelGrafico.show  { transform:translate(-50%,-50%) scale(1); }
#legenda             { bottom:calc(var(--vh)*11); }
#quiz3dAviso         { bottom:calc(var(--vh)*13); }
#titulo              { top:16%; }

/* --------------------------------------------------------------------------
   "GIRE O APARELHO" — só para celular deitado
   --------------------------------------------------------------------------
   Num computador a moldura resolve sozinha: sobra tela, a caixa vertical fica
   no meio e ninguém precisa girar nada. Num celular deitado não sobra: a
   moldura ficaria com ~190px de largura, ilegível. Aí vale interromper.
   Usa vh/vw de verdade (não --vw): este elemento é da JANELA, não da moldura.
   -------------------------------------------------------------------------- */
#gire{
  position:fixed; inset:0; z-index:200; display:none;
  align-items:center; justify-content:center; flex-direction:column; gap:18px;
  background:#0a0908; color:var(--texto); text-align:center; padding:24px;
}
#gire.on{ display:flex; }
#gire .icone{
  font-size:clamp(46px,11vh,86px); line-height:1;
  transform:rotate(90deg); animation:girarDica 2.6s ease-in-out infinite;
}
#gire p{
  margin:0; font-family:var(--fonte); font-size:clamp(15px,3.4vh,22px);
  font-weight:600; line-height:1.45; color:rgba(255,236,232,.78);
}
#gire b{ color:var(--rubi); font-weight:800; }
@keyframes girarDica{
  0%,45%   { transform:rotate(90deg); }
  70%,100% { transform:rotate(0deg); }
}
</style>
</head>

<!-- Three.js LOCAL (funciona offline, no preview e no PWA instalado).
     Se este arquivo faltar, garantirThree() lá embaixo tenta o CDN. -->
<script src="libs/three.min.js"></script>
<script>
'use strict';
/* ############################################################################
   #  APP CINÉTICA QUÍMICA — audiobook animado                                #
   #  ------------------------------------------------------------------      #
   #  MAPA DO ARQUIVO                                                         #
   #   1. VERSÃO / CONSTANTES                                                 #
   #   2. FAIXAS (roteiro linear) + SUMÁRIO + PERSISTÊNCIA DE CENA            #
   #   3. UTILIDADES DE DOM / OVERLAYS / MÁQUINA DE ESCREVER                  #
   #   4. ÁUDIO: player, relógio virtual (fallback sem mp3), SFX              #
   #   5. STORY ENGINE (cues por segundo de áudio)                            #
   #   6. EFEITOS: confete, tremer, flash, pausaCurta                         #
   #   7. CENA 3D (bancada, béqueres, bunsen, arena molecular, quadro)        #
   #   8. CÂMERA ESFÉRICA + MODO CÂMERA LIVRE                                 #
   #   9. GRÁFICOS SVG (conc×tempo, energia, Maxwell-Boltzmann, termômetro)   #
   #  10. QUIZ ENGINE (alternativas / figuras / arrastar / 3D)                #
   #  11. EVENTOS (coreografia de cada faixa) <<< É AQUI QUE VOCÊ MEXE        #
   #  12. FLUXO DO BOTÃO DE PLAY (handler de 'ended', caso a caso)            #
   #  13. BOOT / PWA                                                          #
   ############################################################################ */

/* ==========================================================================
   1. VERSÃO / CONSTANTES
   --------------------------------------------------------------------------
   REGRA CRÍTICA: ao alterar o app, suba VERSAO aqui E a constante CACHE
   no sw.js (senão o celular fica com a versão antiga).
   ========================================================================== */
const VERSAO = 'v1.29.0';

const CORES = {
  /* --- SEMÂNTICAS: significam alguma coisa (calor, frio, catalisador,
     acerto). São elas que espelham a paleta vermelha do CSS. ----------- */
  quente: 0xff9d33,
  fogo:   0xff5a3c,
  frio:   0x6fb7ff,
  rubi:   0xff3b30,   /* acento principal da UI */
  acerto: 0x3ddc84,   /* produto formado / colisão efetiva */
  roxo:   0xc86bff,
  cinza:  0x7b7a78,   /* colisão não efetiva */

  /* --- DA SALA: neutras de propósito --------------------------------
     O vermelho é do TEMA e vive na UI (painéis, botões, títulos, badges)
     e nas cores semânticas acima. A sala 3D é um laboratório de verdade:
     madeira natural, aço, parede cinza. Quando o ambiente inteiro era
     vinho — fundo, névoa, parede, moldura e ainda uma luz rubi por cima
     — a madeira virava mogno e o vidro do béquer puxava para o rosa. */
  bg:      0x131312,  /* fundo da cena e da névoa — grafite neutro */
  parede:  0x1d1c1b,
  chao:    0x121111,
  moldura: 0x4e4c47,  /* borda do quadro: cinza-alumínio, sem vinho */
  vidro:   0xdfe9ff
};

/* Definição que a faixa 'dialogo1' digita NO QUADRO (não é legenda de tela).
   Fica aqui, e não solta dentro da coreografia, porque o mesmo texto alimenta
   o campo `texto` da faixa (usado como fallback quando não há mp3).

   Os \n são quebras OBRIGATÓRIAS: no quadro a frase é cortada por sentido,
   não por onde a largura acabou. Cada trecho ainda pode quebrar sozinho se
   não couber (é o que salva o retrato, cuja coluna é bem mais estreita).

   COR: os trechos que começam com "N." são itens de lista e saem na cor do
   rótulo (âmbar), não no branco do corpo — ver quebrarLinhas(). A regra é o
   próprio texto, sem marcador especial para o autor lembrar de digitar. */
const DEF_LINHAS = [
  'É a parte da Química que estuda:',
  '1. A velocidade de uma reação.',
  '2. Os fatores que afetam essa velocidade.',
  '3. Como controlar essa velocidade.'
];
const DEF_CINETICA = DEF_LINHAS.join('\n');

/* Índice do caractere onde COMEÇA o trecho i, dentro de DEF_CINETICA. É o que
   permite digitar a lista em etapas ("o item 2 começa em 8.5s") sem contar
   caracteres na mão — e sem quebrar quando o texto for editado. O +1 é o \n,
   que ocupa um caractere igual ao espaço. */
function defIndice(i){
  let n = 0;
  for(let k = 0; k < i && k < DEF_LINHAS.length; k++) n += DEF_LINHAS[k].length + 1;
  return n;
}

/* ==========================================================================
   2. FAIXAS — roteiro linear
   --------------------------------------------------------------------------

const $  = (id) => document.getElementById(id);
const $$ = (sel, raiz) => Array.prototype.slice.call((raiz || document).querySelectorAll(sel));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp  = (a, b, t) => a + (b - a) * t;
const easeInOutCubic = (t) => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2;

function mostrar(id){ const e = $(id); if(e) e.classList.add('show'); }
function esconder(id){ const e = $(id); if(e) e.classList.remove('show'); }

/* --------------------------------------------------------------------------
   ANIMAÇÕES DRAMÁTICAS — pop e pulso
   ATENÇÃO: quase todos os overlays já usam `transform` para se centralizar
   (translate(-50%,-50%)). Uma animação CSS que anime `transform` SUBSTITUI
   esse valor e joga o painel para fora da tela. Por isso usamos a Web
   Animations API com composite:'add', que SOMA ao transform do CSS em vez
   de sobrescrevê-lo. Nunca troque isto por uma classe com @keyframes.
   -------------------------------------------------------------------------- */
function _el(idOuEl){ return (typeof idOuEl === 'string') ? $(idOuEl) : idOuEl; }

function popar(idOuEl){
  const e = _el(idOuEl);
  if(!e || !e.animate) return;
  e.animate([
    { transform:'scale(.62) translateY(14px)' },
    { transform:'scale(1.07) translateY(-4px)', offset:.62 },
    { transform:'scale(1) translateY(0)' }
  ], { duration:520, easing:'cubic-bezier(.2,1.5,.4,1)', composite:'add' });
}

/* Pulsa um elemento (destacar Ea, fórmula, ΔH…). Também compõe. */
function pulsar(idOuEl, vezes){
  const e = _el(idOuEl);
  if(!e || !e.animate) return;
  e.animate([
    { transform:'scale(1)',    filter:'drop-shadow(0 0 0 rgba(255,157,51,0))' },
    { transform:'scale(1.14)', filter:'drop-shadow(0 0 16px rgba(255,157,51,.95))', offset:.5 },
    { transform:'scale(1)',    filter:'drop-shadow(0 0 0 rgba(255,157,51,0))' }
  ], { duration:1000, iterations: vezes || 2, easing:'ease-in-out', composite:'add' });
}

/* Peça por peça da equação: id da TINTA → o texto de ORIGEM, que é também o do
   fantasma ao lado. O fantasma é quem reserva a largura, então quando a
   coreografia troca um pedaço (aos 16.6 s "gotejamento" vira "A") o fantasma
   troca junto — e um replay da faixa precisa devolver todos eles ao texto
   daqui, senão a segunda passada nasce com a largura da primeira. */
const EQ_PECAS = {
  eqVtxt:'V',  eqVsub:'gotejamento',  eqIgualTxt:'=',
  eqNumTxt:'quantidade de gotas',     eqDenTxt:'intervalo de tempo',
  eqResV:'V',  eqResSub:'A',          eqResIgual:'=',  eqResVal:'1 gota/s'
};

/* O fantasma que reserva a largura de uma tinta: o irmão dentro da .escrita. */
function fantasmaDe(el){
  return (el && el.parentNode) ? el.parentNode.querySelector('.fantasma') : null;
}

/* Idem para a equação: apaga a tinta e recolhe o traço. limparDigitacoes()
   só esvazia a fila da máquina de escrever; o que já foi escrito continua na
   tela até alguém limpar. */
function zerarEquacao(){
  Object.keys(EQ_PECAS).forEach((id)=>{
    const e = $(id); if(!e) return;
    e.textContent = '';
    const f = fantasmaDe(e); if(f) f.textContent = EQ_PECAS[id];
  });
  const t = $('eqTraco'); if(t) t.classList.remove('vis');
  /* O resultado volta para dentro da caixa: escondido, sem voo e sem as
     coordenadas do voo anterior grudadas no style. */
  const r = $('eqResultado');
  if(r){ r.className = 'parte resultado'; r.removeAttribute('style'); }
}

/* --------------------------------------------------------------------------
   d) MÁQUINA DE ESCREVER guiada pelo áudio.
      digitar('legendaTxt', 'texto...', 4, 12)
      → entre 4s e 12s do áudio o texto vai sendo revelado.
   -------------------------------------------------------------------------- */
let _digitacoes = [];
function digitar(id, texto, t0, t1){
  const el = $(id); if(!el) return;
  el.textContent = '';
  _digitacoes.push({ el, texto, t0, t1: Math.max(t1, t0 + .3), pronto:false });
  if(id === 'legendaTxt') mostrar('legenda');
}

/* A MESMA máquina, rodando ao contrário: apaga o que está escrito letra por
   letra, de trás para a frente, entre t0 e t1. Ao terminar troca o FANTASMA
   pelo texto que vai ocupar o lugar — sem essa troca a peça nova ficaria
   nadando na largura da antiga (o "A" no espaço reservado por "gotejamento").
   O texto a apagar é lido no momento da cue; se a tinta estiver vazia (um seek
   que rearmou a cue antes de a digitação ter acontecido) vale o do fantasma. */
function apagar(id, t0, t1, novoFantasma){
  const el = $(id); if(!el) return;
  const f = fantasmaDe(el);
  _digitacoes.push({ el, texto: el.textContent || (f ? f.textContent : ''),
                     t0, t1: Math.max(t1, t0 + .3),
                     apagando:true, fantasmaNovo:novoFantasma, pronto:false });
}

/* Mesma máquina de escrever, mas o destino é a TEXTURA do quadro 3D em vez
   de um elemento de DOM — ver texturaQuadro(). O texto revelado fica pintado
   no quadro e não some quando a câmera muda ou a cena é remontada. */
/* `de`/`ate` digitam só um PEDAÇO do texto — é assim que a lista aparece em
   etapas ("o item 2 começa em 8.5s"). Com `de` maior que zero o texto já está
   no quadro e não pode ser reposto, senão o que já apareceu piscaria. */
function digitarNoQuadro(texto, t0, t1, campo, de, ate){
  const alvo = CAMPOS_QUADRO[campo] ? campo : 'definicao';
  const i0 = de || 0;
  if(!i0){
    if(alvo === 'rotulo')        quadroDefinir({ rotulo: texto, revelarRotulo: 0 });
    else if(alvo === 'pergunta') quadroDefinir({ pergunta: texto });
    else                         quadroDefinir({ definicao: texto, revelado: 0 });
  }
  /* `quadro` guarda QUAL campo está sendo digitado — tickDigitacoes repassa
     para quadroRevelar(). */
  _digitacoes.push({ quadro:alvo, texto, t0, t1: Math.max(t1, t0 + .3),
                     de:i0, ate:(ate === undefined ? texto.length : ate), pronto:false });
}
function limparDigitacoes(){
  _digitacoes = [];
  const c = $('legendaCursor'); if(c) c.style.display = '';
}
function tickDigitacoes(){
  const t = tempoAtual();
  for(let i = 0; i < _digitacoes.length; i++){
    const d = _digitacoes[i];
    if(d.pronto) continue;
    const p = clamp((t - d.t0) / (d.t1 - d.t0), 0, 1);
    const n = Math.floor(p * d.texto.length);

    /* Destino = quadro 3D. quadroRevelar() já ignora chamadas que não mudam
       nada, então repintar o canvas grande não acontece a cada frame. */
    if(d.quadro){
      const piscando = p < 1 && (Math.floor(t * 2) % 2 === 0);
      const nq = Math.floor(d.de + p * (d.ate - d.de));
      quadroRevelar(p >= 1 ? d.ate : nq, piscando, d.quadro);
      if(p >= 1) d.pronto = true;
      continue;
    }

    /* Apagando: a mesma conta, ao contrário — de texto cheio para vazio. */
    if(d.apagando){
      const m = Math.ceil((1 - p) * d.texto.length);
      if(d.el.textContent.length !== m) d.el.textContent = d.texto.slice(0, m);
      if(p >= 1){
        d.pronto = true; d.el.textContent = '';
        const f = fantasmaDe(d.el);
        if(f && d.fantasmaNovo !== undefined) f.textContent = d.fantasmaNovo;
      }
      continue;
    }

    if(d.el.textContent.length !== n) d.el.textContent = d.texto.slice(0, n);
    if(p >= 1){ d.pronto = true; d.el.textContent = d.texto; }
  }
  /* cursor pisca só enquanto está digitando algo na legenda */
  const digitandoLegenda = _digitacoes.some(d => !d.quadro && !d.pronto && d.el.id === 'legendaTxt');
  const cur = $('legendaCursor');
  if(cur) cur.style.display = digitandoLegenda ? '' : 'none';
}

/* Atalho: legenda = texto da própria faixa, digitado entre t0 e t1. */
function legenda(texto, t0, t1){ digitar('legendaTxt', texto, t0, t1); }

/* ==========================================================================
   4. ÁUDIO — player único + relógio virtual + SFX
   ========================================================================== */
const player = $('player');
let faixaAtual = -1;         // índice em FAIXAS
let tocando    = false;

/* ---- Relógio virtual: se o .mp3 não existir, o app roda em "modo
   demonstração" com um cronômetro sintético, para as cues continuarem
   funcionando. Assim dá pra testar toda a coreografia sem áudio. ---- */
let virtual = { ativo:false, t:0, dur:30, rodando:false };

function tempoAtual(){
  return virtual.ativo ? virtual.t : (player.currentTime || 0);
}
function duracaoAtual(){
  if(virtual.ativo) return virtual.dur;
  return isFinite(player.duration) && player.duration > 0
    ? player.duration
    : (FAIXAS[faixaAtual] ? FAIXAS[faixaAtual].dur : 30);
}
function tickRelogioVirtual(dt){
  if(!virtual.ativo || !virtual.rodando) return;
  virtual.t += dt;
  if(virtual.t >= virtual.dur){
    virtual.t = virtual.dur; virtual.rodando = false;
    aoTerminarFaixa();               // mesmo fluxo do evento 'ended'
  }
}
function pausarNarracao(){
  if(virtual.ativo) virtual.rodando = false; else player.pause();
  tocando = false;
}
function retomarNarracao(){
  if(virtual.ativo){ virtual.rodando = true; }
  else { player.play().catch(()=>{}); }
  tocando = true;
}

   playSfx('applause' | 'funfare' | 'error' | 'proxima' | 'pop' |
           'fizz' | 'whoosh')
   Procura audios/sfx/<nome>.mp3. Se não existir, sintetiza com WebAudio,
   pro app já sair funcionando sem nenhum arquivo.
   'click' continua sendo pedido pelos botões, mas não toca mais nada.
   ------------------------------------------------------------------------ */
const SFX_NOMES = ['applause','funfare','error','proxima','pop','fizz','whoosh'];
const sfxDisponivel = {};   // nome -> true se o mp3 existe
const sfxAudio = {};        // nome -> <audio> já baixado, pronto para clonar
let audioCtx = null;

function ctx(){
  if(!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(AC) audioCtx = new AC();
  }
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
  return audioCtx;
}

function playSfx(nome, vol){
  vol = (vol === undefined) ? .7 : vol;
  /* O 'click' de botão era um bip eletrônico de 880 Hz que destoava do resto
     do áudio (narração e efeitos de laboratório). Silenciado num ponto só, em
     vez de caçar as chamadas espalhadas pela interface — os botões continuam
     pedindo o efeito, ele é que não existe mais.
     Mas o ctx() FICA: era o clique que destravava o WebAudio dentro do gesto
     do usuário. Sem ele, o primeiro efeito disparado por um cue de tempo
     (sem toque) pegaria o contexto suspenso e sairia mudo. */
  if(nome === 'click'){ ctx(); return; }
  if(sfxDisponivel[nome]){
    /* cloneNode do elemento JÁ BAIXADO em sondarSfx(): toca na hora, sem
       esperar a rede. E a cópia permite dois disparos sobrepostos — no
       acerto, applause e funfare tocam juntos; reusar o mesmo elemento
       faria o segundo cortar o primeiro. */
    const base = sfxAudio[nome];
    const a = base ? base.cloneNode() : new Audio('audios/sfx/' + nome + '.mp3');
    a.volume = clamp(vol, 0, 1);
    a.play().catch(()=>{});
    return;
  }
  sintetizarSfx(nome, vol);
}

/* Síntese simples com osciladores / ruído. */
function sintetizarSfx(nome, vol){
  const c = ctx(); if(!c) return;
  const t0 = c.currentTime;

  const tom = (freq, dur, tipo, ganho, atraso, deslize) => {
    const o = c.createOscillator(), g = c.createGain();
    o.type = tipo || 'sine';
    o.frequency.setValueAtTime(freq, t0 + (atraso||0));
    if(deslize) o.frequency.exponentialRampToValueAtTime(Math.max(40,deslize), t0 + (atraso||0) + dur);
    g.gain.setValueAtTime(0.0001, t0 + (atraso||0));
    g.gain.exponentialRampToValueAtTime(Math.max(.001,(ganho||.2) * vol), t0 + (atraso||0) + .012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + (atraso||0) + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t0 + (atraso||0)); o.stop(t0 + (atraso||0) + dur + .05);
  };
  const ruido = (dur, ganho, filtro, atraso) => {
    const n = Math.floor(c.sampleRate * dur);
    const buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/n, 1.6);
    const s = c.createBufferSource(); s.buffer = buf;
    const f = c.createBiquadFilter(); f.type='bandpass'; f.frequency.value = filtro||1400; f.Q.value = .8;
    const g = c.createGain(); g.gain.value = (ganho||.25) * vol;
    s.connect(f); f.connect(g); g.connect(c.destination);
    s.start(t0 + (atraso||0));
  };

  switch(nome){
    case 'applause':
      for(let i=0;i<9;i++) ruido(.55, .10, 900 + Math.random()*2200, i*.045);
      ruido(1.5, .16, 1700, .05);
      break;
    case 'funfare':
      [523.25, 659.25, 783.99, 1046.5].forEach((f,i)=> tom(f, .30, 'triangle', .26, i*.11));
      tom(1046.5, .55, 'square', .12, .46);
      break;
    case 'error':
      tom(300, .30, 'sawtooth', .22, 0,   150);
      tom(190, .42, 'square',   .16, .13,  90);
      break;
    case 'pop':     tom(420, .12, 'sine', .22, 0, 900); break;
    case 'proxima': tom(560, .16, 'triangle', .18, 0, 1150); ruido(.18,.10,3000,.02); break;
    case 'whoosh':  ruido(.42, .20, 700); break;
    case 'fizz':    for(let i=0;i<14;i++) ruido(.09, .05, 2600 + Math.random()*2600, i*.055); break;
    default:        tom(660, .10, 'sine', .16);
  }
}

/* Descobre quais mp3 de efeito existem (HEAD) e JÁ OS BAIXA. Sem o preload,
   o arquivo só começaria a ser buscado no clique e o aplauso chegaria depois
   do confete. Falha silenciosa = sintetiza com WebAudio. */
function sondarSfx(){
  SFX_NOMES.forEach((n)=>{
    fetch('audios/sfx/' + n + '.mp3', { method:'HEAD' })
      .then(r => {
        sfxDisponivel[n] = r.ok;
        if(!r.ok) return;
        const a = new Audio('audios/sfx/' + n + '.mp3');
        a.preload = 'auto';
        a.load();
        sfxAudio[n] = a;
      })
      .catch(()=>{ sfxDisponivel[n] = false; });
  });
}

/* ==========================================================================
   5. STORY ENGINE — b) coreografia por tempo de áudio
   --------------------------------------------------------------------------
   rodarStory([ {t:4, fn:()=>{...}}, {t:12.5, fn:()=>{...}} ])
   As cues disparam quando tempoAtual() >= t. Voltar no tempo (seek) rearma
   as cues seguintes automaticamente.
   ========================================================================== */
let _story = null;

function rodarStory(cues){
  _story = {
    cues: cues.slice().sort((a,b) => a.t - b.t),
    feitos: new Array(cues.length).fill(false)
  };
}
function limparStory(){ _story = null; }

function tickStory(){
  if(!_story) return;
  const t = tempoAtual();
  for(let i = 0; i < _story.cues.length; i++){
    const c = _story.cues[i];
    if(!_story.feitos[i] && t >= c.t){
      _story.feitos[i] = true;
      try { c.fn(); } catch(e){ console.error('[cue t=' + c.t + ']', e); }
    } else if(_story.feitos[i] && t < c.t - .35){
      _story.feitos[i] = false;               // seek para trás → rearma
    }
  }
}

/* i) pausaCurta — segura a narração por alguns ms (tempo dramático). */

function pausaCurta(ms){

  clearTimeout(_pausaTimer);
  _pausaTimer = setTimeout(()=>{ retomarNarracao(); }, ms || 900);
}

const cvConfete = $('confete');

let confetes = [], confeteAte = 0;

function festaConfete(qtd){
  qtd = qtd || 140;
  const paleta = ['#ff3b30','#ff9d33','#ff5a3c','#ffd166','#c86bff','#ffffff'];
  for(let i = 0; i < qtd; i++){
    confetes.push({
      x: Math.random() * cvConfete.width,
      y: -20 - Math.random() * cvConfete.height * .5,
      vx: (Math.random() - .5) * 2.6,
      vy: 2 + Math.random() * 4.5,
      g: .055 + Math.random() * .05,
      w: 6 + Math.random() * 8,
      h: 8 + Math.random() * 12,
      rot: Math.random() * Math.PI,
      vr: (Math.random() - .5) * .22,
      cor: paleta[(Math.random() * paleta.length) | 0]
    });
  }
  confeteAte = performance.now() + 4200;
}
function tickConfete(){
  const w = cvConfete.width, h = cvConfete.height;
  ctxConfete.clearRect(0, 0, w, h);
  if(!confetes.length) return;
  for(let i = confetes.length - 1; i >= 0; i--){
    const p = confetes[i];
    p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    if(p.y > h + 40){ confetes.splice(i, 1); continue; }
    ctxConfete.save();
    ctxConfete.translate(p.x, p.y); ctxConfete.rotate(p.rot);
    ctxConfete.fillStyle = p.cor;
    ctxConfete.fillRect(-p.w/2, -p.h/2, p.w, p.h);
    ctxConfete.restore();
  }
  if(performance.now() > confeteAte && confetes.length > 260) confetes.length = 260;
}

/* --------------------------------------------------------------------------
   FADE DE OBJETOS 3D — desvanecer(grupo, 0|1, ms)
   --------------------------------------------------------------------------
   Serve para "esvaziar a bancada" na abertura sem destruir nada: no fim do
   fade o grupo só vira visible=false. Os béqueres continuam borbulhando, o
   Bunsen continua no lugar — é material GUARDADO, pronto para voltar com
   trazerEquipamentos().

   Dois detalhes que não são óbvios:

   · MeshToonMaterial e MeshStandardMaterial nascem com transparent:false, e
     nesse estado a opacidade é simplesmente IGNORADA — o objeto sumiria de
     uma vez. Por isso ligamos transparent durante o fade e devolvemos o valor
     original quando ele volta ao normal (transparent:true muda a ordenação de
     render e não deve ficar ligado à toa).
   · a opacidade-base de cada material é guardada em userData na primeira
     passada. Sem isso, um segundo fade partiria da opacidade já reduzida e o
     vidro do béquer (0.20) iria clareando a cada ida e volta.
   -------------------------------------------------------------------------- */
let _fades = [];

function _materiaisDe(obj){
  const vistos = new Set(), lista = [];
  obj.traverse((o)=>{
    if(!o.material) return;
    const ms = Array.isArray(o.material) ? o.material : [o.material];
    ms.forEach((m)=>{
      if(vistos.has(m)) return;
      vistos.add(m);
      if(m.userData._op0 === undefined){
        m.userData._op0 = (m.opacity === undefined) ? 1 : m.opacity;
        m.userData._tr0 = !!m.transparent;
      }
      lista.push(m);
    });
  });
  return lista;
}

function _aplicarFade(mats, k){
  for(let i = 0; i < mats.length; i++){
    const m = mats[i];
    m.transparent = (k < .999) ? true : m.userData._tr0;
    m.opacity     = m.userData._op0 * k;
  }
}

/* para = 1 (aparecer) ou 0 (sumir). ms <= 0 aplica na hora. */
function desvanecer(obj, para, ms, aoFim){
  if(!obj) return;
  const mats = _materiaisDe(obj);
  const de = (obj.userData._fadeK === undefined) ? (obj.visible ? 1 : 0)
                                                 : obj.userData._fadeK;
  _fades = _fades.filter(f => f.obj !== obj);   // no máximo um fade por objeto
  if(para > 0) obj.visible = true;              // precisa render para aparecer

  /* O mapa de sombras é binário: ignora opacidade. Sem isto, a bancada
     esvaziaria enquanto as sombras dos béqueres continuavam cheias no tampo,
     sumindo de estalo só no último frame. Desligamos a projeção já na saída
     e devolvemos na entrada — cada malha volta ao que configurarSombras()
     tinha decidido para ela. */
  obj.traverse((o)=>{
    if(o.isMesh) o.castShadow = (para > 0) && (o.userData._projeta0 === true);
  });

  if(!ms || ms <= 0){
    obj.userData._fadeK = para;
    _aplicarFade(mats, para);
    obj.visible = para > 0;
    if(aoFim) aoFim();
    return;
  }
  _fades.push({ obj, mats, de, para, t:0, dur: ms / 1000, aoFim });
}

function tickFades(dt){
  for(let i = _fades.length - 1; i >= 0; i--){
    const f = _fades[i];
    f.t += dt;
    const p = clamp(f.t / f.dur, 0, 1);
    const k = lerp(f.de, f.para, easeInOutCubic(p));
    f.obj.userData._fadeK = k;
    _aplicarFade(f.mats, k);
    if(p >= 1){
      f.obj.visible = f.para > 0;    // guardado: sai do render, fica na cena
      _fades.splice(i, 1);
      if(f.aoFim) f.aoFim();
    }
  }
}

/* ==========================================================================
   7. CENA 3D — bancada de reações + arena molecular
   ========================================================================== */
let renderer, scene, camera, relogio;
let raizCena = null;          // grupo raiz da cena montada
let cenaMontada = null;       // 'bancada' | 'arena' | 'quadro'
let bancada = null;           // referências da cena de bancada
let arena = null;             // referências da arena molecular
const atualizadores = [];     // funções (dt) => {} chamadas todo frame

/* ---- material toon com contorno ---- */
let mapaToon = null;

/* Texturas reaproveitadas entre cenas — limparGrupo() nunca as descarta. */
const TEXTURAS_COMPARTILHADAS = new Set();
function gradienteToon(){
  if(mapaToon) return mapaToon;
  /* Degraus de luz do toon shading. O shader lê o texel em .rgb, então o
     valor precisa estar replicado nos 3 canais — por isso RGBAFormat e não
     RedFormat (com RedFormat, G e B vêm zerados e a cena inteira fica rosa). */
  /* 5 degraus, e o mais escuro em 74 (29%) em vez de 46 (18%). Com quatro
     degraus e um piso tão baixo, todo lado que não olhava para a key light
     virava um borrão preto: a madeira perdia o veio e o béquer perdia o
     contorno do vidro. Mais um degrau dá a meia-luz que faltava sem tirar
     a banda dura, que é o que faz o desenho parecer desenho. */
  const niveis = [74, 130, 180, 220, 255];   // sombra funda → luz cheia
  const dados = new Uint8Array(niveis.length * 4);
  for(let i = 0; i < niveis.length; i++){
    dados[i*4] = dados[i*4+1] = dados[i*4+2] = niveis[i];
    dados[i*4+3] = 255;
  }
  mapaToon = new THREE.DataTexture(dados, niveis.length, 1, THREE.RGBAFormat);
  mapaToon.minFilter = mapaToon.magFilter = THREE.NearestFilter;
  mapaToon.needsUpdate = true;
  return mapaToon;
}
function toon(cor, extra){
  return new THREE.MeshToonMaterial(Object.assign({
    color: cor, gradientMap: gradienteToon()
  }, extra || {}));
}
function contorno(mesh, esp){
  const m = new THREE.Mesh(
    mesh.geometry,
    new THREE.MeshBasicMaterial({ color:0x0b0b0a, side:THREE.BackSide })
  );
  m.scale.multiplyScalar(esp || 1.045);
  m.renderOrder = -1;
  /* A casca é uma cópia INFLADA e virada do avesso do próprio objeto: se
     projetasse sombra, cada objeto ganharia uma segunda sombra maior que
     ele, deslocada. Fica fora do mapa de sombras. */
  m.userData.semSombra = true;
  mesh.add(m);
  return mesh;
}
/* VIDRO. Era Phong com um specular branco: um ponto de brilho fixo e nada
   mais, o que lia como plástico translúcido. Vidro não se reconhece pelo
   brilho, se reconhece pelo que REFLETE — por isso Standard com o envMap do
   laboratório (o mesmo cubo PMREM que os metais usam) e roughness quase zero,
   que devolve a reflexão nítida do teto e das paredes na curva do copo.
   opacity subiu de .20 para .26 porque a reflexão também é multiplicada pelo
   alfa na hora de compor: a .20 ela quase não aparecia. */
function vidro(cor){
  return new THREE.MeshStandardMaterial({
    color: cor || CORES.vidro, transparent:true, opacity:.26,
    metalness:0, roughness:.06,
    envMap: ambienteReflexo(), envMapIntensity:1.7,
    side:THREE.DoubleSide, depthWrite:false
  });
}

/* ==========================================================================
   TEXTURAS PROCEDURAIS — madeira e metal
   --------------------------------------------------------------------------
   Geradas em <canvas> no boot: nada de arquivo externo, o PWA continua
   100% offline. Cada uma é criada uma única vez e reaproveitada.
   ========================================================================== */

/* Ruído barato (soma de senos) — suficiente para veio de madeira. */
function _turb(x, y){
  return Math.sin(x * 0.9 + Math.sin(y * 0.5) * 2.1) * 0.55
       + Math.sin(x * 2.3 + 1.7) * Math.sin(y * 0.31) * 0.28
       + Math.sin(x * 5.1 + y * 0.9) * 0.12;
}

let _texMadeira = null;
function texturaMadeira(){
  if(_texMadeira) return _texMadeira;
  const N = 512;
  const cv = document.createElement('canvas'); cv.width = cv.height = N;
  const c = cv.getContext('2d');
  const img = c.createImageData(N, N);
  const d = img.data;

  /* Duas cores de madeira (clara e escura) que serão misturadas pelo anel.
     Carvalho, não mogno: o par antigo ([146,96,58] / [78,44,26]) era muito
     saturado no vermelho e, multiplicado pela cor do material, deixava o
     tampo cor de vinho. */
  const clara  = [158, 124, 88];
  const escura = [ 92,  66, 44];

  for(let y = 0; y < N; y++){
    for(let x = 0; x < N; x++){
      const u = x / N * 10, v = y / N * 10;
      /* anéis de crescimento: coordenada distorcida pela turbulência */
      const g = u * 2.4 + _turb(u, v) * 1.9;
      let anel = Math.abs(Math.sin(g * Math.PI));
      anel = Math.pow(anel, 0.65);
      /* fibras finas na direção do veio */
      const fibra = (Math.sin(v * 190 + Math.sin(u * 7) * 3) * 0.5 + 0.5) * 0.10;
      /* poros aleatórios */
      const poro = Math.random() * 0.055;
      const t = clamp(anel * 0.82 + fibra - poro, 0, 1);

      const i = (y * N + x) * 4;
      d[i]     = escura[0] + (clara[0] - escura[0]) * t;
      d[i + 1] = escura[1] + (clara[1] - escura[1]) * t;
      d[i + 2] = escura[2] + (clara[2] - escura[2]) * t;
      d[i + 3] = 255;
    }
  }
  c.putImageData(img, 0, 0);

  _texMadeira = new THREE.CanvasTexture(cv);
  TEXTURAS_COMPARTILHADAS.add(_texMadeira);
  _texMadeira.wrapS = _texMadeira.wrapT = THREE.RepeatWrapping;
  _texMadeira.anisotropy = 8;
  return _texMadeira;
}

/* Mapa de relevo da madeira (mesma imagem em tons de cinza serve de bump). */
let _texMetal = null;
function texturaMetal(){
  if(_texMetal) return _texMetal;
  const W = 512, H = 512;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const c = cv.getContext('2d');
  c.fillStyle = '#9aa0a6'; c.fillRect(0, 0, W, H);
  /* metal escovado: riscos horizontais finos de brilho variável */
  for(let i = 0; i < 5200; i++){
    const y = Math.random() * H;
    const x = Math.random() * W;
    const comp = 12 + Math.random() * 120;
    const luz = Math.random();
    c.strokeStyle = luz > .5
      ? 'rgba(255,255,255,' + (0.03 + Math.random() * 0.12) + ')'
      : 'rgba(0,0,0,'       + (0.03 + Math.random() * 0.12) + ')';
    c.lineWidth = Math.random() < .8 ? 1 : 2;
    c.beginPath(); c.moveTo(x, y); c.lineTo(x + comp, y + (Math.random() - .5) * .8); c.stroke();
  }
  _texMetal = new THREE.CanvasTexture(cv);
  TEXTURAS_COMPARTILHADAS.add(_texMetal);
  _texMetal.wrapS = _texMetal.wrapT = THREE.RepeatWrapping;
  _texMetal.anisotropy = 8;
  return _texMetal;
}

/* --------------------------------------------------------------------------
   Ambiente que o METAL reflete. Sem envMap, MeshStandardMaterial com
   metalness alto renderiza praticamente preto.
   O cubemap cru NÃO serve direto: precisa passar pelo PMREMGenerator para o
   borrão por rugosidade funcionar. Por isso é montado em prepararAmbiente(),
   chamado logo depois que o renderer existe.
   -------------------------------------------------------------------------- */
let _ambiente = null;
function ambienteReflexo(){ return _ambiente; }

function prepararAmbiente(){
  const faces = [];
  for(let i = 0; i < 6; i++){
    const N = 256;
    const cv = document.createElement('canvas'); cv.width = cv.height = N;
    const c = cv.getContext('2d');
    /* Tudo em CINZA NEUTRO: é isto que o metal reflete. Com o ambiente em
       tons de vinho, o aço do tripé e do Bunsen saía cor de cobre. */
    if(i === 2){                     /* +Y — teto: as luminárias do laboratório */
      c.fillStyle = '#5e5c5a'; c.fillRect(0, 0, N, N);
      const g = c.createRadialGradient(N*.5, N*.42, 6, N*.5, N*.42, N*.62);
      g.addColorStop(0, '#ffffff'); g.addColorStop(.35, '#eae7e3');
      g.addColorStop(.75, '#8b8885'); g.addColorStop(1, '#3f3d3b');
      c.fillStyle = g; c.fillRect(0, 0, N, N);
    } else if(i === 3){              /* -Y — piso escuro */
      c.fillStyle = '#1e1d1c'; c.fillRect(0, 0, N, N);
    } else {                         /* laterais — horizonte claro em cima */
      const g = c.createLinearGradient(0, 0, 0, N);
      g.addColorStop(0, '#d6d3cf'); g.addColorStop(.34, '#8a8784');
      g.addColorStop(.62, '#454341'); g.addColorStop(1, '#171716');
      c.fillStyle = g; c.fillRect(0, 0, N, N);
      /* faixa de luz do teto refletida na parede */
      c.fillStyle = 'rgba(255,245,235,.30)';
      c.fillRect(0, N * .10, N, N * .06);
    }
    faces.push(cv);
  }
  const cubo = new THREE.CubeTexture(faces);
  cubo.needsUpdate = true;

  const pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileCubemapShader();
  _ambiente = pmrem.fromCubemap(cubo).texture;
  pmrem.dispose();
  cubo.dispose();
}

/* --------------------------------------------------------------------------
   TEXTURA DA PAREDE LATERAL — "slide de apresentação"
   Tom sobre tom: todos os elementos ficam a poucos por cento de luminância do
   fundo, para lerem como marca d'água e nunca competirem com a bancada.
   Elementos típicos de um tema de PowerPoint: faixas diagonais nos cantos,
   uma barra de acento e um watermark central — aqui, a curva da energia de
   ativação, que é o símbolo da cinética.
   -------------------------------------------------------------------------- */
let _texParede = null;
function texturaParedeSlide(){
  if(_texParede) return _texParede;
  const W = 1400, H = 900;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const c = cv.getContext('2d');

  /* 1) base: gradiente vertical (mais claro em cima, onde bate a luz) */
  const g = c.createLinearGradient(0, 0, 0, H);
  /* Base em grafite neutro. As faixas e as moléculas desenhadas por cima
     continuam com os acentos do tema — o que sai do vermelho é a PAREDE. */
  g.addColorStop(0,   '#2a2928');
  g.addColorStop(.55, '#1c1b1a');
  g.addColorStop(1,   '#131312');
  c.fillStyle = g; c.fillRect(0, 0, W, H);

  /* --- ÁREA DE SLIDE ---------------------------------------------------
     A parede é grande (22x14) mas a câmera de referência (CAM_PAREDE) só
     enquadra um recorte dela: da metade de baixo para cima. Compomos o
     "slide" dentro dessa área, em coordenadas relativas — assim os cantos
     e o rodapé caem onde a câmera realmente olha, em vez de ficarem fora
     de quadro. Fora da área, sobra só o gradiente de fundo.
     ---------------------------------------------------------------------- */
  const SX = W * .03, SW = W * .94;
  const SY = H * .26, SH = H * .72;
  const sx = (u) => SX + SW * u;          // 0..1 → x dentro do slide
  const sy = (v) => SY + SH * v;          // 0..1 → y dentro do slide

  /* 2) faixas diagonais dos cantos do slide */
  const faixa = (pts, cor) => {
    c.fillStyle = cor; c.beginPath();
    c.moveTo(sx(pts[0][0]), sy(pts[0][1]));
    for(let i = 1; i < pts.length; i++) c.lineTo(sx(pts[i][0]), sy(pts[i][1]));
    c.closePath(); c.fill();
  };
  /* canto superior direito */
