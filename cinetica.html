  faixa([[.60,0],[1,0],[1,.40],[.80,0]], 'rgba(255,157,51,.05)');
  faixa([[.78,0],[1,0],[1,.23]],         'rgba(255,59,48,.06)');
  faixa([[.90,0],[1,0],[1,.09]],         'rgba(255,196,107,.07)');
  /* canto inferior esquerdo */
  faixa([[0,1],[.34,1],[0,.62]],         'rgba(255,157,51,.04)');
  faixa([[0,1],[.18,1],[0,.81]],         'rgba(255,59,48,.05)');

  /* ---- ferramentas de desenho químico (tudo tom sobre tom) ---- */
  const rgba = (r, g2, b, a) => 'rgba(' + r + ',' + g2 + ',' + b + ',' + a + ')';
  const BRANCO = (a) => rgba(255, 255, 255, a);
  const AMBAR  = (a) => rgba(255, 157, 51, a);
  const AZUL   = (a) => rgba(111, 183, 255, a);
  const ROXO   = (a) => rgba(200, 107, 255, a);

  /* Fórmula/equação escrita. */
  const formula = (txt, u, v, tam, alpha, cor) => {
    c.save();
    c.font = '600 ' + tam + 'px "Segoe UI", system-ui, Roboto, Arial, sans-serif';
    c.fillStyle = (cor || BRANCO)(alpha);
    c.textAlign = 'left'; c.textBaseline = 'middle';
    c.fillText(txt, sx(u), sy(v));
    c.restore();
  };

  /* Átomo: círculo de contorno com o símbolo dentro, como num diagrama de
     ligações. Preenchimento chapado deixaria o símbolo escuro sobre um
     círculo quase transparente — some no fundo. */
  const atomo = (x, y, r, alpha, rot) => {
    c.fillStyle = BRANCO(alpha * .45);
    c.beginPath(); c.arc(x, y, r, 0, 6.284); c.fill();
    c.strokeStyle = BRANCO(alpha * 1.7); c.lineWidth = Math.max(1.5, r * .13);
    c.beginPath(); c.arc(x, y, r, 0, 6.284); c.stroke();
    if(rot){
      c.font = '700 ' + Math.round(r * 1.02) + 'px "Segoe UI", system-ui, sans-serif';
      c.fillStyle = BRANCO(Math.min(.30, alpha * 2.4));
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(rot, x, y + 1);
    }
  };
  /* Ligação simples ou dupla entre dois pontos. */
  const ligacao = (x1, y1, x2, y2, alpha, dupla, esp) => {
    c.strokeStyle = BRANCO(alpha); c.lineWidth = esp || 5; c.lineCap = 'round';
    if(!dupla){
      c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); return;
    }
    const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1;
    const nx = -dy / L * (esp || 5) * .9, ny = dx / L * (esp || 5) * .9;
    c.beginPath(); c.moveTo(x1+nx, y1+ny); c.lineTo(x2+nx, y2+ny); c.stroke();
    c.beginPath(); c.moveTo(x1-nx, y1-ny); c.lineTo(x2-nx, y2-ny); c.stroke();
  };

  /* ---- 3) ESTRUTURAS MOLECULARES ---- */

  /* Benzeno: hexágono com o círculo aromático. */
  const benzeno = (u, v, r, alpha) => {
    const x = sx(u), y = sy(v), p = [];
    for(let i = 0; i < 6; i++){
      const a = -Math.PI/2 + i * Math.PI/3;
      p.push([x + Math.cos(a)*r, y + Math.sin(a)*r]);
    }
    c.strokeStyle = BRANCO(alpha); c.lineWidth = r*.10; c.lineJoin = 'round';
    c.beginPath(); c.moveTo(p[0][0], p[0][1]);
    for(let i = 1; i < 6; i++) c.lineTo(p[i][0], p[i][1]);
    c.closePath(); c.stroke();
    c.beginPath(); c.arc(x, y, r*.58, 0, 6.284); c.stroke();
  };

  /* Água: O central com dois H em ângulo (~105°). */
  const agua = (u, v, r, alpha) => {
    const x = sx(u), y = sy(v), d = r*2.05;
    const a1 = -0.35, a2 = -Math.PI + 0.35;
    const h1 = [x + Math.cos(a1)*d, y + Math.sin(a1)*d];
    const h2 = [x + Math.cos(a2)*d, y + Math.sin(a2)*d];
    ligacao(x, y, h1[0], h1[1], alpha*.85, false, r*.30);
    ligacao(x, y, h2[0], h2[1], alpha*.85, false, r*.30);
    atomo(x, y, r, alpha, 'O');
    atomo(h1[0], h1[1], r*.62, alpha, 'H');
    atomo(h2[0], h2[1], r*.62, alpha, 'H');
  };

  /* Gás carbônico: O=C=O linear com ligações duplas. */
  const gasCarbonico = (u, v, r, alpha) => {
    const x = sx(u), y = sy(v), d = r*2.25;
    ligacao(x - d, y, x, y, alpha*.85, true, r*.20);
    ligacao(x, y, x + d, y, alpha*.85, true, r*.20);
    atomo(x - d, y, r*.85, alpha, 'O');
    atomo(x + d, y, r*.85, alpha, 'O');
    atomo(x, y, r, alpha, 'C');
  };

  /* Amônia: N com três H. */
  const amonia = (u, v, r, alpha) => {
    const x = sx(u), y = sy(v), d = r*2.05;
    [-Math.PI/2, Math.PI/6, Math.PI - Math.PI/6].forEach((a)=>{
      const hx = x + Math.cos(a)*d, hy = y + Math.sin(a)*d;
      ligacao(x, y, hx, hy, alpha*.85, false, r*.28);
      atomo(hx, hy, r*.60, alpha, 'H');
    });
    atomo(x, y, r, alpha, 'N');
  };

  /* Metano: C com quatro H. */
  const metano = (u, v, r, alpha) => {
    const x = sx(u), y = sy(v), d = r*2.0;
    [-Math.PI/2, 0, Math.PI/2, Math.PI].forEach((a)=>{
      const hx = x + Math.cos(a)*d, hy = y + Math.sin(a)*d;
      ligacao(x, y, hx, hy, alpha*.8, false, r*.26);
      atomo(hx, hy, r*.55, alpha, 'H');
    });
    atomo(x, y, r, alpha, 'C');
  };

  /* Gás oxigênio: O=O. */
  const oxigenio = (u, v, r, alpha) => {
    const x = sx(u), y = sy(v), d = r*1.35;
    ligacao(x - d, y, x + d, y, alpha*.85, true, r*.22);
    atomo(x - d, y, r, alpha, 'O');
    atomo(x + d, y, r, alpha, 'O');
  };

  /* Distribuição em faixas horizontais, dimensionada para não haver
     sobreposição entre equações vizinhas nem com as estruturas. */
  gasCarbonico(.07, .10, 18, .044);
  benzeno(     .87, .15, 40, .050);
  oxigenio(    .14, .46, 16, .040);
  metano(      .08, .65, 21, .042);
  /* A água é a estrutura mais central da parede e por isso a que mais saltava:
     em atomo() o alpha vira contorno a 1.7x e a letra a até 2.4x, então .046
     ali dentro rendia um 'O' a ~.11 — o dobro das fórmulas em volta. Em .014
     ela fica no limite do perceptível, que é o pedido: presença, não desenho.
     Mexa aqui, não em atomo(), para não apagar as outras moléculas junto. */
  agua(        .53, .67, 20, .014);
  amonia(      .91, .69, 20, .042);

  /* ---- 4) EQUAÇÕES E LEIS ---- */
  /* lei da velocidade e Arrhenius — o coração da cinética */
  formula('v = k · [A]ᵐ · [B]ⁿ',                 .28, .10, 38, .062, AZUL);
  /* decomposição da água oxigenada: a reação-símbolo da catálise */
  formula('2 H₂O₂  →  2 H₂O  +  O₂',            .05, .30, 46, .068, AMBAR);
  formula('Ea',                                  .52, .25, 30, .046, AMBAR);
  formula('2 SO₂ + O₂ → 2 SO₃',                  .64, .32, 26, .038);
  formula('k = A · e^(−Ea/RT)',                  .30, .47, 34, .056, ROXO);
  formula('V₂O₅',                                .88, .44, 24, .036, ROXO);
  formula('MnO₂',                                .27, .61, 28, .042, ROXO);
  formula('ΔH',                                  .73, .60, 26, .040, AZUL);
  /* síntese de Haber, ataque do zinco e efervescência do carbonato */
  formula('N₂ + 3 H₂  ⇌  2 NH₃',                 .04, .83, 32, .046);
  formula('Zn + 2 HCl → ZnCl₂ + H₂',             .35, .85, 24, .034);
  formula('v = ΔC / Δt',                         .72, .83, 34, .056, AMBAR);
  formula('CaCO₃ + 2 HCl → CaCl₂ + H₂O + CO₂',   .12, .93, 24, .036);

  /* 6) barra de acento do rodapé do slide */
  c.fillStyle = 'rgba(255,59,48,.14)';
  c.fillRect(sx(0), sy(.97), SW, 5);
  c.fillStyle = 'rgba(255,157,51,.26)';
  c.fillRect(sx(.04), sy(.97) - 1, SW*.17, 7);
  /* filete fino no topo do slide, como cabeçalho de template */
  c.fillStyle = 'rgba(255,157,51,.09)';
  c.fillRect(sx(0), sy(.02), SW, 3);

  /* 7) vinheta para as bordas não brigarem com o canto da sala */
  const v = c.createRadialGradient(W*.5, H*.45, H*.30, W*.5, H*.5, H*.95);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,.45)');
  c.fillStyle = v; c.fillRect(0, 0, W, H);

  _texParede = new THREE.CanvasTexture(cv);
  TEXTURAS_COMPARTILHADAS.add(_texParede);
  _texParede.anisotropy = 8;
  return _texParede;
}

/* --------------------------------------------------------------------------
   QUADRO DA PAREDE DO FUNDO — texto CRAVADO na textura
   --------------------------------------------------------------------------
   O texto do quadro NÃO é um overlay de DOM: ele é pintado num <canvas> que
   vira a textura do plano do quadro (10.5 x 5.6 em z = -6.05). Consequências
   que justificam a escolha:

     · o texto é geometria de cena — mudar a câmera não o apaga, ele fica lá,
       em perspectiva, como se estivesse escrito no quadro mesmo;
     · o canvas e a textura são ÚNICOS e vivem fora das cenas (registrados em
       TEXTURAS_COMPARTILHADAS). prepararBancada/Quadro/Arena chamam novaRaiz()
       e reconstroem criarSala() a cada troca de faixa — se o estado morasse
       no mesh, o texto sumiria na primeira troca. Por isso o conteúdo mora em
       QUADRO_TXT e criarSala() só pendura a textura já pintada.

   MeshBasicMaterial (não toon): as luzes do laboratório são fracas de
   propósito e um material que recebe luz deixaria o texto ilegível. O
   degradê de "luz batendo no quadro" já vem pintado no próprio canvas.

   ÁREA ÚTIL: o quadro tem 10.5 x 5.6 e a tela não enquadra tudo. A moldura é
   estreita, então com a largura toda as pontas do texto cairiam fora: o texto
   vive numa COLUNA de 70% da largura, que a CAM_QUADRO_DEF enquadra inteira.
   Em compensação o quadro cabe todo na vertical, e dá para usar o topo.
   Um layout só — ver LAYOUT_QUADRO.

   pintarQuadro() é chamada de novo em aoRedimensionar(), porque um
   redimensionamento pode mudar o tamanho da moldura.
   -------------------------------------------------------------------------- */
const QUADRO_W = 1920, QUADRO_H = 1024;      // 1.875 = 10.5/5.6, o mesmo do plano

/* Estado do que está escrito. `revelado` = nº de caracteres já "digitados". */
const QUADRO_TXT = {
  titulo:    'Cinética Química',

  /* Assinatura, logo abaixo do título, em branco. O '\n' é quebra obrigatória
     (ver quebrarLinhas), mas aqui as linhas são pintadas uma a uma, centradas
     no mesmo eixo do título: título + créditos leem como um bloco só.
     Só aparecem com o QUADRO LIMPO — ver a seção 3.2 de pintarQuadro(). */
  creditos:  'Aplicativo desenvolvido pelo\nprof. Amauri Junior',

  /* Ano, no canto de baixo do quadro. Fica sempre — é o único texto que não
     divide espaço com nada. */
  ano:       '2026',

  rotulo:    '',
  definicao: '',
  /* Rótulo e definição são digitados SEPARADAMENTE (em tempos diferentes do
     áudio), então cada um tem seu próprio contador de caracteres revelados e
     sua própria barra de digitação. */
  revelado:  0,
  caret:     false,
  reveladoRotulo: 0,
  caretRotulo:    false,

  /* Bloco que está SAINDO de cena, deslizando para fora pela esquerda. É uma
     cópia congelada do rótulo + definição anteriores: guardá-la à parte é o
     que permite o texto novo já entrar no mesmo lugar enquanto o velho ainda
     desliza. `saindoDesloca` é em px de textura. */
  saindoRotulo:   '',
  saindoDef:      '',
  saindoDesloca:  0,

  /* Pergunta solta embaixo da lista ("O que é velocidade?"). Tem alfa próprio
     porque some em fade, sem levar o resto do quadro junto. */
  pergunta:         '',
  perguntaRevelado: 0,
  perguntaCaret:    false,
  perguntaAlfa:     1,

  /* Realce de UM item da lista: ele cresce e ganha sombra, como se saísse do
     plano do quadro. -1 = nenhum. */
  destaqueItem:   -1,
  destaqueEscala: 1
};

/* Nome dos campos de contagem por alvo de digitação. */
const CAMPOS_QUADRO = {
  definicao: { n:'revelado',         c:'caret' },
  rotulo:    { n:'reveladoRotulo',   c:'caretRotulo' },
  pergunta:  { n:'perguntaRevelado', c:'perguntaCaret' }
};

/* --------------------------------------------------------------------------
   LAYOUT DO QUADRO — um só, porque a moldura é uma só
   --------------------------------------------------------------------------
   Havia dois: `paisagem` e `retrato`, escolhidos pela orientação da janela.
   Não há mais orientação: a moldura é sempre um celular em pé (ver #app), e
   manter o par significava manter duas calibragens em sincronia — que foi
   exatamente o que passou a divergir entre o preview e o aparelho. O de
   paisagem está no histórico do git se um dia fizer falta.

   u/v são frações da textura (0..1). ESTES SÃO OS KNOBS:
     colEsq/colDir  movem e estreitam a coluna de texto
     tituloU        move SÓ o título na horizontal
     tituloV/rotuloV/defV   sobem e descem cada bloco
     linha          entrelinha, em px de textura

   Calibrado para a CAM_QUADRO_DEF. A coluna é deslocada para a direita porque
   o eixo daquela câmera é oblíquo: o centro do quadro (x = 0) aparece 0.74 à
   esquerda do centro da tela. Com a coluna simétrica em .200–.800, a margem
   esquerda do texto nascia por cima da borda.

   Uma "linha" de deslocamento = 63px de textura. A textura é isotrópica
   (1920x1024 sobre 10.5x5.6: 10.5/1920 = 5.6/1024), então esses 63px valem a
   mesma distância na horizontal e na vertical — dá para usar a entrelinha
   como régua para mover na horizontal.

   Com a câmera atual, colEsq .280 põe a margem esquerda em ndcX -0.93 e
   colDir .975 põe a direita em +0.92: sete por cento de folga de cada lado.
   Encostar em -1.00 corta o primeiro caractere de cada linha.

   A entrelinha (90) é folgada de propósito, para a lista respirar. Cuidado:
   ela empurra o item 3 para baixo, e `perguntaV` tem de descer junto ou os
   dois se encostam — .791 deixa 40px de folga sobre o item 3.
   -------------------------------------------------------------------------- */
const LAYOUT_QUADRO = {
  colEsq:.280, colDir:.975, tituloU:.4395,
  tamTitulo:66, tamRotulo:48, tamDef:52,
  tituloV:.150, fileteV:.200, rotuloV:.330, defV:.455, linha:90,
  perguntaV:.791,
  /* Créditos centrados em tituloU, não no centro da coluna: eles pertencem ao
     título. Com 40px a linha mais larga ("Aplicativo desenvolvido pelo") mede
     quase o mesmo que o título — que já se sabe enquadrado. */
  tamCredito:40, creditoV:.258, creditoLinha:46,
  tamAno:34, anoV:.880
};
function layoutQuadro(){ return LAYOUT_QUADRO; }

let _cvQuadro = null, _ctxQuadro = null, _texQuadro = null;

function texturaQuadro(){
  if(_texQuadro) return _texQuadro;
  _cvQuadro = document.createElement('canvas');
  _cvQuadro.width = QUADRO_W; _cvQuadro.height = QUADRO_H;
  _ctxQuadro = _cvQuadro.getContext('2d');
  _texQuadro = new THREE.CanvasTexture(_cvQuadro);
  /* NITIDEZ DO TEXTO. A câmera vê o quadro com o texto MINIFICADO (mais
     texels do que pixels de tela). Nessa faixa o mipmap entra em ação e o
     filtro trilinear mistura níveis borrados — é o que fazia as letras
     parecerem de baixa resolução. Sem mipmap e com LinearFilter a amostragem
     sai direto da imagem em tamanho cheio: alia um pouco quando a câmera se
     move, mas o texto é lido parado, e aí fica nítido.
     A anisotropia máxima do aparelho ajuda no que sobra de obliquidade. */
  _texQuadro.generateMipmaps = false;
  _texQuadro.minFilter = THREE.LinearFilter;
  _texQuadro.magFilter = THREE.LinearFilter;
  _texQuadro.anisotropy = renderer ? renderer.capabilities.getMaxAnisotropy() : 8;
  TEXTURAS_COMPARTILHADAS.add(_texQuadro);   // sobrevive ao desmonte das cenas
  pintarQuadro();
  return _texQuadro;
}

/* Quebra o texto em linhas usando a largura REAL medida no canvas.
   A quebra é calculada sobre o texto COMPLETO, nunca sobre o pedaço já
   revelado: senão as linhas se reorganizariam a cada letra e o texto
   "pularia" durante a digitação.

   '\n' é quebra obrigatória — é assim que o autor manda no corte da frase.
   Dentro de cada trecho ainda vale a quebra por largura, para o trecho não
   estourar a coluna estreita do retrato.

   Devolve { txt, destaque } por linha. `destaque` marca os itens de lista —
   trechos que começam com "1.", "2."… — que são pintados na cor do rótulo. A
   marca vem do TRECHO, então a continuação de um item que quebrou por largura
   continua destacada, em vez de metade do item voltar ao branco.

   IMPORTANTE para a digitação: tanto o espaço quanto o '\n' ocupam UM
   caractere do texto original, e é por isso que pintarQuadro() desconta
   `linha.txt.length + 1` por linha ao contar o que já foi revelado. */
function quebrarLinhas(c, txt, larguraMax){
  const linhas = [];
  String(txt).split('\n').forEach((trecho, iTrecho)=>{
    const destaque = /^\s*\d+\./.test(trecho);
    const palavras = trecho.split(/\s+/).filter(Boolean);
    const por = (t) => linhas.push({ txt:t, destaque, trecho:iTrecho });
    if(!palavras.length){ por(''); return; }
    let atual = '';
    for(let i = 0; i < palavras.length; i++){
      const teste = atual ? atual + ' ' + palavras[i] : palavras[i];
      if(atual && c.measureText(teste).width > larguraMax){
        por(atual); atual = palavras[i];
      } else {
        atual = teste;
      }
    }
    if(atual) por(atual);
  });
  return linhas;
}

function pintarQuadro(){
  if(!_ctxQuadro) return;
  const c = _ctxQuadro, W = QUADRO_W, H = QUADRO_H;
  const FONTE = '"Segoe UI", system-ui, Roboto, Arial, sans-serif';

  /* ---- 1) fundo do quadro — grafite neutro, sem vinho ---- */
  const g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0,   '#232322');   // luz do teto bate em cima
  g.addColorStop(.45, '#191918');
  g.addColorStop(1,   '#131312');
  c.fillStyle = g; c.fillRect(0, 0, W, H);

  /* Brilho suave no canto superior esquerdo (a key light vem da direita/alto,
     mas o quadro é fosco: um clarão discreto tira o ar de retângulo chapado). */
  const br = c.createRadialGradient(W*.30, H*.16, 20, W*.30, H*.16, W*.62);
  br.addColorStop(0, 'rgba(255,250,244,.05)');
  br.addColorStop(1, 'rgba(255,250,244,0)');
  c.fillStyle = br; c.fillRect(0, 0, W, H);

  /* Fio interno, como a borda de um quadro branco de sala de aula. Cinza, e
     não rubi: a borda do quadro não entra no tema vermelho. */
  c.strokeStyle = 'rgba(255,255,255,.10)'; c.lineWidth = 4;
  c.strokeRect(W*.035, H*.055, W*.93, H*.885);

  /* ---- 2) área útil: depende da orientação (ver LAYOUT_QUADRO) ---- */
  const L = layoutQuadro();
  const ESQ = W * L.colEsq, DIR = W * L.colDir, LARG = DIR - ESQ;

  /* ---- 3) título ---- */
  if(QUADRO_TXT.titulo){
    c.font = '800 ' + L.tamTitulo + 'px ' + FONTE;
    c.textAlign = 'center'; c.textBaseline = 'alphabetic';
    const gt = c.createLinearGradient(ESQ, 0, DIR, 0);
    gt.addColorStop(0,   '#ff3b30');
    gt.addColorStop(.55, '#ff9d33');
    gt.addColorStop(1,   '#ff5a3c');
    c.fillStyle = gt;
    /* tituloU e não o centro da coluna: no retrato o título fica um pouco à
       esquerda do miolo do texto, para assentar melhor no enquadramento. */
    c.fillText(QUADRO_TXT.titulo, W * L.tituloU, H * L.tituloV);

    /* Filete sob o título. */
    const gl = c.createLinearGradient(ESQ, 0, DIR, 0);
    gl.addColorStop(0,   'rgba(255,59,48,0)');
    gl.addColorStop(.5,  'rgba(255,157,51,.55)');
    gl.addColorStop(1,   'rgba(255,59,48,0)');
    c.fillStyle = gl; c.fillRect(ESQ, H * L.fileteV, LARG, 3);
  }

  /* ---- 3.2) créditos, logo abaixo do título ----------------------------
     Só com o QUADRO LIMPO — que é o estado da capa. A faixa da textura entre
     o filete e a lista é a mesma que a aula usa para "Definição:", então os
     créditos cedem o lugar sozinhos assim que a narração escreve alguma
     coisa. Nenhum cue precisa apagá-los, e eles voltam se o quadro for limpo
     de novo. */
  const quadroLimpo = !QUADRO_TXT.rotulo && !QUADRO_TXT.definicao &&
                      !QUADRO_TXT.saindoRotulo && !QUADRO_TXT.saindoDef;
  if(QUADRO_TXT.creditos && quadroLimpo){
    c.font = '600 ' + L.tamCredito + 'px ' + FONTE;
    c.textAlign = 'center'; c.textBaseline = 'alphabetic';
    c.fillStyle = '#ffffff';
    let yC = H * L.creditoV;
    QUADRO_TXT.creditos.split('\n').forEach((linha)=>{
      c.fillText(linha, W * L.tituloU, yC);   // mesmo eixo do título
      yC += L.creditoLinha;
    });
  }

  c.textAlign = 'left';

  /* ---- 3.5) bloco que está saindo, deslizando para a esquerda ---- */
  if(QUADRO_TXT.saindoRotulo || QUADRO_TXT.saindoDef){
    const dx = -QUADRO_TXT.saindoDesloca;
    if(QUADRO_TXT.saindoRotulo){
      c.font = '800 ' + L.tamRotulo + 'px ' + FONTE;
      c.fillStyle = '#ff9d33';
      c.fillText(QUADRO_TXT.saindoRotulo, ESQ + dx, H * L.rotuloV);
    }
    if(QUADRO_TXT.saindoDef){
      c.font = '600 ' + L.tamDef + 'px ' + FONTE;
      let y = H * L.defV;
      quebrarLinhas(c, QUADRO_TXT.saindoDef, LARG).forEach((linha)=>{
        c.fillStyle = linha.destaque ? '#ff9d33' : '#f6ece9';
        c.fillText(linha.txt, ESQ + dx, y);
        y += L.linha;
      });
    }
  }

  /* ---- 4) rótulo ("Definição:"), também revelado letra a letra ---- */
  if(QUADRO_TXT.rotulo){
    c.font = '800 ' + L.tamRotulo + 'px ' + FONTE;
    c.fillStyle = '#ff9d33';
    const visR = QUADRO_TXT.rotulo.slice(0, QUADRO_TXT.reveladoRotulo);
    const yR = H * L.rotuloV;
    c.fillText(visR, ESQ, yR);
    if(QUADRO_TXT.caretRotulo){
      c.fillRect(ESQ + c.measureText(visR).width + 6,
                 yR - L.tamRotulo * .74, 5, L.tamRotulo * .9);
    }
  }

  /* ---- 5) definição, revelada caractere a caractere ---- */
  if(QUADRO_TXT.definicao){
    c.font = '600 ' + L.tamDef + 'px ' + FONTE;
    const linhas = quebrarLinhas(c, QUADRO_TXT.definicao, LARG);
    let restam = QUADRO_TXT.revelado;
    let y = H * L.defV;

    for(let i = 0; i < linhas.length; i++){
      const linha = linhas[i];
      if(restam <= 0) break;
      const visivel = linha.txt.slice(0, restam);
      const realce = (linha.trecho === QUADRO_TXT.destaqueItem) &&
                     QUADRO_TXT.destaqueEscala > 1.005;

      if(realce){
        /* Cresce a partir da própria baseline, com sombra: é o que vende a
           ideia de que a linha saiu do plano do quadro e está na frente das
           outras. Escala em vez de trocar a fonte para o crescimento poder
           ser animado de forma contínua. */
        c.save();
        c.translate(ESQ, y);
        c.scale(QUADRO_TXT.destaqueEscala, QUADRO_TXT.destaqueEscala);
        c.shadowColor = 'rgba(0,0,0,.75)'; c.shadowBlur = 16; c.shadowOffsetY = 5;
        c.fillStyle = '#ffc46b';
        c.fillText(visivel, 0, 0);
        c.restore();
      } else {
        /* Itens de lista saem em âmbar, a mesma cor de "Definição:". */
        c.fillStyle = linha.destaque ? '#ff9d33' : '#f6ece9';
        c.fillText(visivel, ESQ, y);
      }

      /* Barra de digitação no fim do que já apareceu. Só na linha CORRENTE:
         visivel.length === restam significa que a revelação parou aqui. */
      if(QUADRO_TXT.caret && visivel.length === restam){
        const x = ESQ + c.measureText(visivel).width + 8;
        c.fillStyle = '#ff3b30';
        c.fillRect(x, y - L.tamDef * .74, 6, L.tamDef * .9);
      }
      /* +1 pelo espaço que a quebra de linha consumiu do texto original. */
      restam -= linha.txt.length + 1;
      y += L.linha;
    }
  }

  /* ---- 6) pergunta solta embaixo da lista ---- */
  if(QUADRO_TXT.pergunta && QUADRO_TXT.perguntaAlfa > .01){
    c.save();
    c.globalAlpha = clamp(QUADRO_TXT.perguntaAlfa, 0, 1);
    c.font = '800 ' + L.tamRotulo + 'px ' + FONTE;   // do tamanho de "Definição:"
    c.fillStyle = '#ff9d33';
    const visP = QUADRO_TXT.pergunta.slice(0, QUADRO_TXT.perguntaRevelado);
    const yP = H * L.perguntaV;
    c.fillText(visP, ESQ, yP);
    if(QUADRO_TXT.perguntaCaret){
      c.fillStyle = '#ff3b30';
      c.fillRect(ESQ + c.measureText(visP).width + 6, yP - L.tamRotulo * .74, 5, L.tamRotulo * .9);
    }
    c.restore();
  }

  /* ---- 7) ano, no canto de baixo à direita ----------------------------
     Alinhado à direita em .930, encostado por dentro do fio da borda (.965).
     Fica embaixo de tudo e à direita de tudo — a pergunta é curta e alinhada
     à esquerda, então nunca se encontram. Discreto de propósito: é uma data
     no canto do quadro, não um elemento da aula. */
  if(QUADRO_TXT.ano){
    c.save();
    c.font = '600 ' + L.tamAno + 'px ' + FONTE;
    c.textAlign = 'right'; c.textBaseline = 'alphabetic';
    c.fillStyle = 'rgba(246,236,233,.45)';
    c.fillText(QUADRO_TXT.ano, W * .930, H * L.anoV);
    c.restore();
  }

  _texQuadro.needsUpdate = true;
}

/* ---- API do quadro (usada pela coreografia das faixas) ---- */

/* Troca o conteúdo. Campos omitidos ficam como estão; passe '' para apagar. */
function quadroDefinir(op){
  op = op || {};
  if(op.titulo !== undefined) QUADRO_TXT.titulo = op.titulo;
  if(op.pergunta !== undefined){
    QUADRO_TXT.pergunta = op.pergunta;
    QUADRO_TXT.perguntaRevelado = 0;
    QUADRO_TXT.perguntaCaret = false;
    QUADRO_TXT.perguntaAlfa = 1;
  }
  if(op.rotulo !== undefined){
    QUADRO_TXT.rotulo = op.rotulo;
    /* Sem `revelarRotulo`, o rótulo entra INTEIRO. Quem digita letra a letra
       é digitarNoQuadro(txt, t0, t1, 'rotulo'), que passa 0 aqui. */
    QUADRO_TXT.reveladoRotulo = (op.revelarRotulo === undefined)
      ? op.rotulo.length : op.revelarRotulo;
    QUADRO_TXT.caretRotulo = false;
  }
  if(op.definicao !== undefined){
    QUADRO_TXT.definicao = op.definicao;
    QUADRO_TXT.revelado  = op.revelado || 0;
    QUADRO_TXT.caret     = false;      // texto novo: sem barra de digitação
  }
  if(op.revelado !== undefined) QUADRO_TXT.revelado = op.revelado;
  pintarQuadro();
}

/* Quantos caracteres estão visíveis. `campo` é 'definicao' (padrão) ou
   'rotulo'. Só repinta se mudou algo — isto roda a cada frame da digitação e
   o canvas é grande. */
function quadroRevelar(n, caret, campo){
  const alvo = CAMPOS_QUADRO[campo] ? campo : 'definicao';
  const { n:chaveN, c:chaveC } = CAMPOS_QUADRO[alvo];
  const novoN = clamp(Math.floor(n), 0, QUADRO_TXT[alvo].length);
  const novoC = !!caret;
  if(novoN === QUADRO_TXT[chaveN] && novoC === QUADRO_TXT[chaveC]) return;
  QUADRO_TXT[chaveN] = novoN;
  QUADRO_TXT[chaveC] = novoC;
  pintarQuadro();
}

/* --------------------------------------------------------------------------
   ANIMAÇÕES NUMÉRICAS DO QUADRO (escala do realce, alfa da pergunta).
   Em tempo REAL: são disparadas por cues, mas precisam correr sozinhas depois
   disso — presas ao relógio do áudio elas parariam junto com ele.
   -------------------------------------------------------------------------- */
let _quadroAnims = [];
function animarQuadro(chave, para, ms, aoFim){
  _quadroAnims = _quadroAnims.filter(a => a.chave !== chave);
  _quadroAnims.push({ chave, de:QUADRO_TXT[chave], para,
                      t:0, dur:Math.max(.001, (ms || 500) / 1000), aoFim });
}
function tickQuadroAnims(dt){
  if(!_quadroAnims.length) return;
  let mudou = false;
  for(let i = _quadroAnims.length - 1; i >= 0; i--){
    const a = _quadroAnims[i];
    a.t += dt;
    const p = clamp(a.t / a.dur, 0, 1);
    const v = lerp(a.de, a.para, easeInOutCubic(p));
    if(Math.abs(v - QUADRO_TXT[a.chave]) > .002){ QUADRO_TXT[a.chave] = v; mudou = true; }
    if(p >= 1){
      QUADRO_TXT[a.chave] = a.para; mudou = true;
      _quadroAnims.splice(i, 1);
      if(a.aoFim) a.aoFim();
    }
  }
  if(mudou) pintarQuadro();
}

/* Faz o item `i` da lista crescer (sai do plano) ou voltar ao normal. */
function quadroDestacarItem(i, escala, ms){
  QUADRO_TXT.destaqueItem = i;
  animarQuadro('destaqueEscala', escala, ms || 700,
    ()=>{ if(escala <= 1.001) QUADRO_TXT.destaqueItem = -1; });
  pintarQuadro();
}

/* Some com a pergunta em fade, sem levar o resto do quadro junto. */
function quadroPerguntaSumir(ms){
  animarQuadro('perguntaAlfa', 0, ms || 900, ()=>{
    QUADRO_TXT.pergunta = ''; QUADRO_TXT.perguntaRevelado = 0;
    QUADRO_TXT.perguntaCaret = false; QUADRO_TXT.perguntaAlfa = 1;
    pintarQuadro();
  });
}

/* --------------------------------------------------------------------------
   TROCA DE BLOCO — o rótulo e a definição atuais deslizam para fora pela
   esquerda enquanto um rótulo NOVO já é digitado no lugar deles.

   Roda em tempo REAL (segundos de relógio), e não em tempo de áudio como a
   digitação normal: ela é disparada por um clique de resposta, num momento em
   que a faixa já acabou e tempoAtual() está congelado na duração — uma
   animação presa nesse relógio nunca sairia do lugar.
   -------------------------------------------------------------------------- */
let _quadroSaida = null;

function quadroTrocarRotulo(novo, ms){
  /* Congela o que sai. A definição sai pelo que já estava revelado. */
  QUADRO_TXT.saindoRotulo  = QUADRO_TXT.rotulo;
  QUADRO_TXT.saindoDef     = QUADRO_TXT.definicao.slice(0, QUADRO_TXT.revelado);
  QUADRO_TXT.saindoDesloca = 0;

  QUADRO_TXT.definicao = ''; QUADRO_TXT.revelado = 0; QUADRO_TXT.caret = false;
  QUADRO_TXT.rotulo = novo || ''; QUADRO_TXT.reveladoRotulo = 0;
  QUADRO_TXT.caretRotulo = !!novo;

  _quadroSaida = { t:0, durSai:(ms || 700)/1000, entra:novo || '', durEntra:1.1 };
  pintarQuadro();
}

function tickQuadroSaida(dt){
  if(!_quadroSaida) return;
  const s = _quadroSaida;
  s.t += dt;

  /* saída: desliza 1.15 larguras de textura, para sumir mesmo nas telas que
     enxergam a borda esquerda do quadro */
  const ps = clamp(s.t / s.durSai, 0, 1);
  const desloca = easeInOutCubic(ps) * QUADRO_W * 1.15;

  /* entrada: o rótulo novo é revelado letra a letra, começando junto */
  const pe = clamp(s.t / s.durEntra, 0, 1);
  const n  = Math.floor(pe * s.entra.length);
  const piscando = pe < 1 && (Math.floor(s.t * 2) % 2 === 0);

  const mudou = Math.round(desloca) !== Math.round(QUADRO_TXT.saindoDesloca) ||
                n !== QUADRO_TXT.reveladoRotulo ||
                piscando !== QUADRO_TXT.caretRotulo;
  if(mudou){
    QUADRO_TXT.saindoDesloca  = desloca;
    QUADRO_TXT.reveladoRotulo = n;
    QUADRO_TXT.caretRotulo    = piscando;
    pintarQuadro();
  }

  if(ps >= 1 && pe >= 1){
    QUADRO_TXT.saindoRotulo = ''; QUADRO_TXT.saindoDef = ''; QUADRO_TXT.saindoDesloca = 0;
    QUADRO_TXT.reveladoRotulo = s.entra.length; QUADRO_TXT.caretRotulo = false;
    _quadroSaida = null;
    pintarQuadro();
  }
}

/* Volta o quadro ao estado "só o título" — usado quando o painel de gráfico
   vai cobrir o quadro e o texto embaixo viraria sujeira visual. */
function quadroLimpar(){
  _quadroSaida = null; _quadroAnims.length = 0;
  QUADRO_TXT.rotulo = ''; QUADRO_TXT.definicao = '';
  QUADRO_TXT.revelado = 0; QUADRO_TXT.caret = false;
  QUADRO_TXT.reveladoRotulo = 0; QUADRO_TXT.caretRotulo = false;
  QUADRO_TXT.saindoRotulo = ''; QUADRO_TXT.saindoDef = ''; QUADRO_TXT.saindoDesloca = 0;
  QUADRO_TXT.pergunta = ''; QUADRO_TXT.perguntaRevelado = 0;
  QUADRO_TXT.perguntaCaret = false; QUADRO_TXT.perguntaAlfa = 1;
  QUADRO_TXT.destaqueItem = -1; QUADRO_TXT.destaqueEscala = 1;
  pintarQuadro();
}

/* ---- Materiais prontos ---- */
/* Madeira realista para o tampo e os pés da bancada. */
function madeira(op){
  op = Object.assign({ repeteU:2.2, repeteV:1, cor:0xffffff, rugosidade:.62 }, op || {});
  const tex = texturaMadeira().clone();
  tex.needsUpdate = true;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(op.repeteU, op.repeteV);
  return new THREE.MeshStandardMaterial({
    map: tex, bumpMap: tex, bumpScale: .012,
    color: op.cor, roughness: op.rugosidade, metalness: .04,
    envMap: ambienteReflexo(), envMapIntensity: .35
  });
}
/* Metal escovado para tripés, bico de Bunsen e aros. */
function metal(op){
  op = Object.assign({ cor:0xb9bec4, rugosidade:.34, repete:1.4, intensidade:1.5 }, op || {});
  const tex = texturaMetal().clone();
  tex.needsUpdate = true;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(op.repete, op.repete);
  return new THREE.MeshStandardMaterial({
    map: tex, color: op.cor,
    metalness: .96, roughness: op.rugosidade,
    envMap: ambienteReflexo(), envMapIntensity: op.intensidade
  });
}

/* --------------------------------------------------------------------------
   RESOLUÇÃO DE RENDER. Estava travada em 2, e celular moderno tem densidade
   de 2.6 a 3.5 — a cena era desenhada com dois terços dos pixels do aparelho
   e depois esticada, o que amassa todo traço fino: o texto do quadro, os
   rótulos, o contorno toon.
   O teto de 3 é o botão de PERFORMANCE desta cena: cada degrau custa o
   quadrado (de 2 para 3 são 2.25x mais pixels a sombrear). Se algum aparelho
   engasgar, é o primeiro número a baixar.

   Quem usa este teto é dprMoldura(), lá na seção da moldura: a conta precisa
   levar em conta a AMPLIAÇÃO da caixa, então o teto mora aqui e a fórmula lá.
   -------------------------------------------------------------------------- */
const DPR_TETO = 3;

/* --------------------------- inicialização 3D --------------------------- */
function iniciar3D(){
  const cv = $('cena3d');
  renderer = new THREE.WebGLRenderer({ canvas:cv, antialias:true, alpha:false });
  renderer.setPixelRatio(dprMoldura());
  renderer.setSize(telaW(), telaH(), true);
  /* Sombras: é o que dava mais falta. Sem elas os béqueres pareciam colados
     na bancada por Photoshop, sem peso e sem contato com o tampo.
     PCFSoft com mapa de 1024 — a cena tem poucas dezenas de malhas, então o
     passe extra de profundidade é barato até no celular. */
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  /* Encoding LINEAR de propósito: assim as cores hex dos materiais aparecem
     como foram escolhidas na paleta do CSS. Com sRGBEncoding, o gama clareia
     demais os tons escuros e a bancada perde o clima de laboratório. */

  scene = new THREE.Scene();
  scene.background = new THREE.Color(CORES.bg);
  /* SEM NÉVOA. Havia um Fog(14, 34) aqui, e ele era a causa do fundo
     "embaçado" nos planos abertos: qualquer coisa além de 14 unidades já
     começava a ser misturada com a cor do fundo, e além de 34 sumia de vez.
     Com as câmeras atuais o quadro fica a mais de 40 da câmera — ou seja,
     dentro da faixa em que a névoa apagava a sala inteira.
     Se um dia voltar, tem de começar depois da distância da câmera mais
     afastada, senão volta o mesmo problema. */

  camera = new THREE.PerspectiveCamera(48, telaW()/telaH(), .1, 200);
  relogio = new THREE.Clock();

  /* Precisa do renderer pronto: gera o envMap (PMREM) usado pelos metais. */
  prepararAmbiente();

  /* Luzes — CALIBRADAS: no toon shading cada luz devolve até 1.0 de
     irradiância e elas SOMAM. Intensidades altas estouram a cena em branco.
     O total aqui fica ~1.24: um pouco abaixo do que era, porque a rampa toon
     agora tem o piso mais alto e a mesma soma clarearia demais.

     Nenhuma luz é vermelha: a rim light já foi rubi e banhava a sala de
     vinho. O contraste de temperatura vem da fill AZULADA contra a key
     branco-quente — é o que dá volume sem sujar a cor da madeira. */

  /* Ambiente. O chão da hemisférica é um marrom de madeira, não cinza: é a
     luz que ricocheteia do tampo e sobe. Sem esse quique, a barriga dos
     béqueres e a parte de baixo dos tripés ficavam mortas. */
  scene.add(new THREE.HemisphereLight(0xfff0e6, 0x3a3026, .38));

  /* KEY — a janela/luminária principal, alta e à direita. É a única que
     projeta sombra: duas sombras cruzadas em cena de bancada viram sujeira. */
  const key = new THREE.DirectionalLight(0xfff0d8, .58);
  key.position.set(5, 9, 6);
  key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024);
  /* Frustum colado na bancada (13 x 6) e não na cena inteira: quanto menor a
     caixa, mais texels de sombra sobram por centímetro e mais limpa fica a
     borda. near/far cobrem a distância da luz até o chão em -3.6. */
  const cs = key.shadow.camera;
  cs.left = -11; cs.right = 11; cs.top = 11; cs.bottom = -11;
  cs.near = 1;   cs.far = 30;
  /* normalBias é o que mata o acne (as listras na madeira): empurra a
     amostra ao longo da normal, em vez de achatar tudo com bias negativo,
     que descolaria a sombra do pé do objeto. */
  key.shadow.bias = -0.0005;
  key.shadow.normalBias = 0.03;
  scene.add(key); scene.add(key.target);

  /* FILL azulada, do lado oposto: abre a sombra sem apagá-la. */
  const fill = new THREE.DirectionalLight(CORES.frio, .16);
  fill.position.set(-6, 4, -4); scene.add(fill);

  /* RIM: lâmpada do teto entre a bancada e a parede. Separa a silhueta dos
     objetos do fundo escuro. Alcance de 34 e não mais 20: com as câmeras
     abertas de agora, a sala inteira precisa estar dentro do raio dela,
     senão as bordas do cenário caem no escuro. */
  const rim = new THREE.PointLight(0xffe9d6, .30, 34);
  rim.position.set(0, 5.5, -3); scene.add(rim);

  irParaCamera(CAM_CAPA, false);
  window.addEventListener('resize', aoRedimensionar);
  aoRedimensionar();
}

/* --------------------------------------------------------------------------
   MOLDURA — quanta tela o app realmente ocupa
   --------------------------------------------------------------------------
   Daqui para baixo, "tela" é a MOLDURA (#app), nunca a janela. telaW()/telaH()
   são a fonte única desse número: o renderer, a câmera, o canvas do confete e
   o raycast do quiz 3D leem todos daqui, então não há como um deles ficar
   medindo a janela e desalinhar dos outros.

   A MOLDURA TEM TAMANHO FIXO, não só formato fixo. Foram duas etapas, e vale
   registrar as duas porque a primeira parecia suficiente e não era:

   1) Fixar o ASPECTO. Antes, cada tela passava em cheio com a sua proporção
      (painel do VS Code ~0.55, celular ~0.46) e o enquadramento 3D divergia.
      Com o aspecto travado em ASPECT_REF, a câmera recebe 0.481 em qualquer
      tela e o FOV dá FOV_REF cravado. Isso resolveu o 3D — que depende só de
      aspecto e FOV — e só o 3D.

   2) Fixar o TAMANHO. A interface continuou diferente, porque quase todo
      texto é clamp(min_px, N * --vw, max_px): numa moldura larga o termo do
      meio bate no `max` em px e trava, e a tipografia encolhe em relação à
      caixa. Com a caixa em TELA_REF_W x TELA_REF_H exatos, --vw, os px, os
      clamps e o canvas passam a viver num sistema de coordenadas único.

   A caixa é então ESCALADA para caber na janela. Ampliação uniforme de uma
   imagem pronta não muda composição: o preview vira o aparelho ampliado, e
   não outro layout. TELA_REF_W/H são a medida real do aparelho de referência,
   e TELA_REF_W/TELA_REF_H = ASPECT_REF — as três constantes têm de continuar
   coerentes entre si.
   -------------------------------------------------------------------------- */
const TELA_REF_W = 384, TELA_REF_H = 798;   // 384/798 = 0.4812 = ASPECT_REF
let escalaMoldura = 1;                       // fator de ampliação em vigor

/* Sempre TELA_REF_*: são constantes, mas passam por aqui para que todo mundo
   leia o tamanho do mesmo lugar. O clientWidth serve de conferência — se
   algum dia divergir, é sinal de que algo mexeu no CSS da moldura. */
function telaW(){ const m = $('app'); return (m && m.clientWidth)  || TELA_REF_W; }
function telaH(){ const m = $('app'); return (m && m.clientHeight) || TELA_REF_H; }

/* Um ponto do mouse/dedo, que vem em coordenadas da JANELA, traduzido para
   coordenadas da MOLDURA. São duas correções: descontar o canto da caixa (ela
   está centrada, então numa janela larga há uma faixa à esquerda) e desfazer a
   ampliação (um arrasto de 100px na tela são 100/escala px de moldura).
   Sem isto, num computador o toque cairia longe do que se vê, os gestos da
   câmera livre teriam sensibilidade diferente da do aparelho, e o anel de
   "segurar para copiar" nasceria fora do dedo. */
function pontoNaMoldura(clientX, clientY){
  const m = $('app');
  if(!m) return { x: clientX, y: clientY };
  const r = m.getBoundingClientRect();
  const k = escalaMoldura || 1;
  return { x: (clientX - r.left) / k, y: (clientY - r.top) / k };
}

function ajustarMoldura(){
  const m = $('app');
  if(!m) return;
  const w = window.innerWidth, h = window.innerHeight;

  /* Maior ampliação que ainda cabe na janela, nos dois eixos. */
  escalaMoldura = Math.min(w / TELA_REF_W, h / TELA_REF_H);

  m.classList.add('moldada');
  m.style.width  = TELA_REF_W + 'px';
  m.style.height = TELA_REF_H + 'px';
  /* left/top centram a caixa NÃO ampliada; como a origem da escala é o centro
     (transform-origin no CSS), ela continua centrada depois de ampliada. */
  m.style.left   = Math.round((w - TELA_REF_W) / 2) + 'px';
  m.style.top    = Math.round((h - TELA_REF_H) / 2) + 'px';
  /* Propriedade `scale`, não transform: ver o bloco da moldura no CSS.
     Via setProperty e como string, que é o caminho que não depende de o
     navegador expor `scale` como campo do objeto style. */
  m.style.setProperty('scale', String(escalaMoldura));

  /* A borda só faz sentido quando SOBRA janela em volta da caixa ampliada. */
  const sobra = (TELA_REF_W * escalaMoldura < w - 1) || (TELA_REF_H * escalaMoldura < h - 1);
  m.classList.toggle('comBarras', sobra);

  /* --vw / --vh: 1% da moldura. Constantes agora, mas continuam sendo escritas
     daqui para haver uma fonte só — ver o bloco da moldura no CSS. */
  m.style.setProperty('--vw', (TELA_REF_W / 100) + 'px');
  m.style.setProperty('--vh', (TELA_REF_H / 100) + 'px');

  /* Celular deitado: a caixa é limitada pela ALTURA e a ampliação fica em
     torno de 0.5, ilegível. Melhor pedir para girar. Num computador a janela
     é alta o bastante e ninguém precisa girar nada. */
  $('gire').classList.toggle('on', w > h && h < 560);
}

/* Resolução do canvas. A moldura tem 384x798 CSS, mas na tela ela aparece
   ampliada por escalaMoldura — sem multiplicar aqui, um monitor grande
   mostraria a cena de 384px esticada e borrada. O teto de DPR_TETO continua
   valendo: é ele que segura o custo no celular. */
function dprMoldura(){
  return Math.min(DPR_TETO, (window.devicePixelRatio || 1) * escalaMoldura);
}

function aoRedimensionar(){
  ajustarMoldura();
  const w = telaW(), h = telaH();
  const dpr = dprMoldura();
  if(renderer){ renderer.setPixelRatio(dpr); renderer.setSize(w, h, true); }
  /* O FOV ainda acompanha o formato — ver fovDaTela(). Com o tamanho fixo ele
     dá sempre FOV_REF; a função fica porque é ela que garante isso, e não uma
     constante espalhada. */
  if(camera){
    camera.aspect = w / h;
    camera.fov = fovDaTela();
    camera.updateProjectionMatrix();
  }
  cvConfete.width = w * dpr; cvConfete.height = h * dpr;
  cvConfete.style.width = w + 'px'; cvConfete.style.height = h + 'px';
  pintarQuadro();
  mostrarFormatoDaTela();
}

/* Formato no HUD da câmera livre. Existe para responder à pergunta "por que no
   celular está diferente do preview?" sem adivinhação. Mostra as DUAS medidas
   — janela e moldura — porque a divergência sempre morava na diferença entre
   elas. Com a moldura valendo em toda tela, o aspecto e o fov das duas linhas
   de baixo têm de bater entre aparelhos; se não baterem, o problema está aqui
   e não na calibragem das câmeras. */
function mostrarFormatoDaTela(){
  const el = $('hudTela');
  if(!el) return;
  const w = telaW(), h = telaH();
  /* A linha da MOLDURA e a do FOV têm de ser idênticas em qualquer aparelho —
     é isso que a moldura de tamanho fixo garante. Só a linha da JANELA e a
     ampliação mudam de máquina para máquina; elas são o que está sendo
     absorvido, não o que resta de diferença. */
  el.innerHTML =
    'janela  ' + window.innerWidth + '&times;' + window.innerHeight +
    ' &middot; x' + escalaMoldura.toFixed(2) +
    '<br>moldura ' + w + '&times;' + h +
    '<br>aspecto ' + (w / h).toFixed(3) + ' &middot; ref ' + ASPECT_REF +
    '<br>fov ' + fovDaTela().toFixed(1) + '&deg; &middot; dpr ' + dprMoldura().toFixed(1);
}

/* -------------------- montagem / desmontagem de cenas -------------------- */
function limparGrupo(g){
  if(!g) return;
  g.traverse((o)=>{
    if(o.geometry) o.geometry.dispose();
    if(o.material){
      const ms = Array.isArray(o.material) ? o.material : [o.material];
      ms.forEach((m)=>{
        /* madeira()/metal() clonam a textura por material — liberamos os
           clones para não vazar VRAM a cada remontagem de cena.
           As texturas-BASE (madeira, metal, parede) são reaproveitadas entre
           cenas: se forem descartadas aqui, a próxima montagem renderiza sem
           elas. Por isso ficam registradas em TEXTURAS_COMPARTILHADAS. */
        ['map','bumpMap','roughnessMap','normalMap','emissiveMap'].forEach((k)=>{
          if(m[k] && !TEXTURAS_COMPARTILHADAS.has(m[k])) m[k].dispose();
        });
        m.dispose();
      });
    }
  });
  if(g.parent) g.parent.remove(g);
}
function desmontarCena(){
  /* Antes de descartar: limparGrupo() dá dispose() nos materiais, e um fade
     em curso continuaria escrevendo opacidade em material morto. */
  _fades.length = 0; _pulsos.length = 0;
  limparGrupo(raizCena);
  raizCena = null; cenaMontada = null; bancada = null; arena = null;
  torneiras = null;              // foram junto com a raiz
  /* Só solta as referências: limparGrupo() já deu dispose nos sprites. */
  Object.keys(_anotacoes).forEach(k => delete _anotacoes[k]);
  atualizadores.length = 0;
}
function novaRaiz(){
  desmontarCena();
  raizCena = new THREE.Group();
  scene.add(raizCena);
  return raizCena;
}

/* --------------------------------------------------------------------------
   SOMBRAS — quem projeta e quem recebe.
   Chamada no fim de cada preparar*(), porque as flags morrem junto com a cena.

   As três exclusões, e por quê:

   · userData.semSombra — as cascas de contorno() e qualquer coisa marcada à
     mão. Uma casca inflada projetaria uma segunda sombra maior que o objeto.
   · material transparente — vidro do béquer, bolhas, chama do Bunsen, caixa
     da arena. O mapa de sombras é binário: não enxerga opacidade, então o
     vidro projetaria uma mancha preta sólida, que é pior do que não projetar.
   · PlaneGeometry — parede, quadro, moldura e chão. São planos enormes; se
     projetassem, a parede jogaria sombra sobre a sala inteira. Recebem, que
     é o que interessa neles.
   -------------------------------------------------------------------------- */
function configurarSombras(raiz){
  if(!raiz) return;
  raiz.traverse((o)=>{
    if(!o.isMesh) return;
    if(o.userData.semSombra){ o.castShadow = false; o.receiveShadow = false; return; }
    const m = Array.isArray(o.material) ? o.material[0] : o.material;
    const opaco  = !!m && !m.transparent;
    const plano  = !!o.geometry && o.geometry.type === 'PlaneGeometry';
    o.castShadow    = opaco && !plano;
    o.receiveShadow = true;
    /* Guardado para desvanecer() saber ao que voltar depois de um fade. */
    o.userData._projeta0 = o.castShadow;
  });
}

/* -------------------------- peças reutilizáveis -------------------------- */

/* Tampo + pés da bancada + parede/quadro ao fundo. */
function criarSala(){
  const g = new THREE.Group();

  /* Tampo em MADEIRA (textura procedural com veios + bump). */
  const tampo = new THREE.Mesh(new THREE.BoxGeometry(13, .38, 6),
    madeira({ repeteU:3.0, repeteV:1.35, cor:0xdcc3a4, rugosidade:.58 }));
  tampo.position.set(0, -.19, 0); g.add(tampo);

  /* Friso da borda: madeira mais escura e mais fechada. */
  const borda = new THREE.Mesh(new THREE.BoxGeometry(13.2, .1, 6.2),
    madeira({ repeteU:6, repeteV:1, cor:0x8f6f52, rugosidade:.5 }));
  borda.position.set(0, .01, 0); g.add(borda);

  /* Pés de madeira escura. */
  [[-5.6, -2.2], [5.6, -2.2], [-5.6, 2.2], [5.6, 2.2]].forEach(([x, z])=>{
    const pe = new THREE.Mesh(new THREE.BoxGeometry(.3, 3.2, .3),
      madeira({ repeteU:1, repeteV:4, cor:0x7d5f45, rugosidade:.68 }));
    pe.position.set(x, -1.95, z); g.add(pe);
  });

  /* Parede + quadro de projeção ao fundo. */
  const parede = new THREE.Mesh(new THREE.PlaneGeometry(30, 16), toon(CORES.parede));
  parede.position.set(0, 4, -6.2); g.add(parede);

  /* O quadro carrega a textura de canvas onde o texto fica CRAVADO — ver
     texturaQuadro(). Como a textura é compartilhada e vive fora das cenas,
     o que estiver escrito sobrevive a toda remontagem de cena. */
  /* fog:false — hoje a cena não tem névoa, então isto não muda nada. Fica
     como trava: se alguém reintroduzir Fog, o texto do quadro é a última
     coisa que pode perder contraste com a distância. */
  const quadro = new THREE.Mesh(new THREE.PlaneGeometry(10.5, 5.6),
    new THREE.MeshBasicMaterial({ map: texturaQuadro(), fog: false }));
  quadro.position.set(0, 3.4, -6.05); g.add(quadro);
  const moldura = new THREE.Mesh(new THREE.PlaneGeometry(11, 6.1), toon(CORES.moldura));
  moldura.position.set(0, 3.4, -6.1); g.add(moldura);
  g.userData.quadro = quadro;

  /* --- Parede LATERAL esquerda, no estilo "slide de apresentação" ---
     Fica além da bancada (que vai até x = -6.5) para não cortá-la.
     Enquadramento de referência:
       { theta: 1.50, phi: 1.38, dist: 4.7, target:[1.2,3.6,-1.1] }  = CAM_PAREDE
     MeshBasicMaterial de propósito: o desenho é tom sobre tom e as luzes da
     cena são fracas — com material que recebe luz, a marca d'água sumiria.
     O gradiente de "iluminação" já está pintado na própria textura. */
  const paredeLateral = new THREE.Mesh(
    new THREE.PlaneGeometry(22, 14),
    new THREE.MeshBasicMaterial({ map: texturaParedeSlide() })
  );
  paredeLateral.position.set(-7.4, 4, -1);
  paredeLateral.rotation.y = Math.PI / 2;   // vira a face para +X (para a cena)
  g.add(paredeLateral);
  g.userData.paredeLateral = paredeLateral;

  /* Chão discreto */
  const chao = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), toon(CORES.chao));
  chao.rotation.x = -Math.PI/2; chao.position.y = -3.6; g.add(chao);

  return g;
}

/* --------------------------------------------------------------------------
   GRADUAÇÃO DO BÉQUER — a escala impressa no vidro
   --------------------------------------------------------------------------
   É o detalhe que faz um cilindro de vidro virar VIDRARIA DE LABORATÓRIO: o
   olho reconhece o objeto pela escala antes de reconhecer pela forma.

   A textura envolve o cilindro inteiro, mas os traços são desenhados só numa
   fatia estreita de u — béquer de verdade tem a escala em UM lado, não em
   volta. O resto do canvas fica com alfa zero e some.

   flipY: a textura nasce com flipY = true, então o topo do canvas cai no TOPO
   do cilindro. Por isso os traços são desenhados de cima para baixo.
   -------------------------------------------------------------------------- */
let _texMarcasBequer = null;
function texturaMarcasBequer(){
  if(_texMarcasBequer) return _texMarcasBequer;
  const N = 512;
  const cv = document.createElement('canvas'); cv.width = cv.height = N;
  const c = cv.getContext('2d');

  /* Faixa em u onde a escala vive: 3% a 19% da volta. */
  const U0 = N * .030, U1 = N * .190;
  const traco = (v, frac, esp, alfa) => {
    c.strokeStyle = 'rgba(255,255,255,' + alfa + ')';
    c.lineWidth = esp;
    c.beginPath();
    c.moveTo(U0, N * v);
    c.lineTo(U0 + (U1 - U0) * frac, N * v);
    c.stroke();
  };
  /* Cinco marcas "cheias" com duas menores entre cada par — o ritmo de uma
     escala graduada. v .22 é a marca do topo; .82 a de baixo. */
  for(let i = 0; i < 5; i++){
    const v = .22 + i * .15;
    traco(v, 1.0, 5, .60);
    if(i < 4){
      traco(v + .05, .45, 3.5, .34);
      traco(v + .10, .45, 3.5, .34);
    }
  }

  _texMarcasBequer = new THREE.CanvasTexture(cv);
  TEXTURAS_COMPARTILHADAS.add(_texMarcasBequer);
  _texMarcasBequer.anisotropy = 8;
  return _texMarcasBequer;
}

/* --------------------------------------------------------------------------
   BÉQUER COM LÍQUIDO, PASTILHA E EFERVESCÊNCIA
   --------------------------------------------------------------------------
   'taxa' é o knob de VELOCIDADE: quantas bolhas nascem por segundo. Toda a
   aula se apoia em ler a diferença entre dois béqueres, então taxa tem de se
   traduzir em algo visível — aqui vira densidade E velocidade de subida.

   O QUE FAZIA A EFERVESCÊNCIA PARECER FALSA (e o que mudou)

   · As bolhas nasciam espalhadas por TODO o fundo, uniformemente sorteadas.
     Efervescência de verdade sai de SÍTIOS DE NUCLEAÇÃO: uns poucos pontos
     fixos na pastilha, cada um soltando um fio contínuo de bolhas. É o fio
     que o olho reconhece — sem ele, o que se vê é chuva ao contrário.
   · Todas subiam em linha reta e em velocidade constante. Bolha real acelera
     (o empuxo é constante, o arrasto não acompanha) e sobe em espiral, com
     a espiral abrindo à medida que ganha velocidade.
   · Todas tinham o mesmo tamanho médio e não mudavam. Bolha real CRESCE ao
     subir: a pressão da coluna de líquido cai e o gás se expande.
   · Sumiam de estalo na superfície. Bolha real chega, fica boiando um
     instante achatada — é isso que forma o colarinho de espuma — e só então
     estoura.
   · MeshBasicMaterial não recebe luz nenhuma: cada bolha era um disco branco
     chapado, todos idênticos. Com Phong + specular, cada uma ganha seu ponto
     de brilho e o volume aparece.

   CUSTO: cada bolha viva é uma draw call transparente, e são DOIS béqueres em
   cena. Por isso a densidade tem teto. A conta: nascimentos/s =
   min(taxa, 1.4) * 26 e vida de ~1.3 a 1.9 s, o que dá ~15 bolhas vivas na
   capa, ~23 no béquer rápido e ~48 no auge do aquecimento. MAXB (90) é a
   trava dura: nascerBolha() desiste em silêncio com o pool cheio.
   -------------------------------------------------------------------------- */
function criarBequer(op){
  op = Object.assign({ x:0, z:0, r:.75, h:1.7, corLiq:CORES.frio, taxa:.5, po:false }, op);
  const g = new THREE.Group();
  g.position.set(op.x, 0, op.z);

  /* ---- vidro ----------------------------------------------------------
     Um material só para copo e fundo: são a mesma peça de vidro, e compartilhar
     poupa uma passada do fade e um estado de render. */
  const matVidro = vidro();

  const copo = new THREE.Mesh(
    new THREE.CylinderGeometry(op.r, op.r * .93, op.h, 30, 1, true), matVidro);
  copo.position.y = op.h / 2 + .06; g.add(copo);

  const fundo = new THREE.Mesh(new THREE.CylinderGeometry(op.r*.93, op.r*.93, .08, 30), matVidro);
  fundo.position.y = .1; g.add(fundo);

  /* Escala graduada, numa casca fininha por fora do copo. rotation.y traz a
     faixa de traços para o lado de quem olha: as câmeras de béquer (CAM_BEQUER
     e CAM_BEQUER_B) olham de frente e um pouco de lado. */
  const marcas = new THREE.Mesh(
    new THREE.CylinderGeometry(op.r*1.004, op.r*.934, op.h, 30, 1, true),
    /* FrontSide: com DoubleSide a face de dentro da mesma fatia é desenhada
       por cima da de fora e os traços saem com o dobro da força. */
    new THREE.MeshBasicMaterial({ map:texturaMarcasBequer(), transparent:true,
                                  opacity:.55, depthWrite:false, side:THREE.FrontSide }));
  marcas.position.y = op.h / 2 + .06;
  marcas.rotation.y = -.62;
  g.add(marcas);

  const aro = new THREE.Mesh(new THREE.TorusGeometry(op.r, .045, 10, 34),
    metal({ cor:0xd6dde3, rugosidade:.22, repete:3 }));
  aro.rotation.x = Math.PI/2; aro.position.y = op.h + .06; g.add(aro);

  /* ---- líquido --------------------------------------------------------
     Três peças, porque água é três coisas diferentes para o olho: o VOLUME
     (corpo translúcido colorido), a SUPERFÍCIE (um espelho quase horizontal,
     que é onde a luz da sala aparece) e o MENISCO (a curva que o líquido faz
     ao subir pela parede do copo). O corpo sozinho, com a tampa do cilindro
     fazendo as vezes de superfície, lia como um bloco de gelatina. */
  const alturaLiq = op.h * .68;
  const Y_SUP = alturaLiq + .12;          // altura da superfície, em coords do grupo

  const liq = new THREE.Mesh(
    new THREE.CylinderGeometry(op.r*.9, op.r*.87, alturaLiq, 30),
    toon(op.corLiq, { transparent:true, opacity:.72 }));
  liq.position.y = alturaLiq/2 + .12; g.add(liq);

  /* A superfície é mais clara que o volume: é a mesma cor lavada pela luz
     que ela reflete. Phong (e não toon) de propósito — aqui o que interessa
     é o brilho especular contínuo, que o degrau do toon mataria. */
  const corSup = new THREE.Color(op.corLiq).lerp(new THREE.Color(0xffffff), .34);
  const superficie = new THREE.Mesh(
    new THREE.CircleGeometry(op.r*.9, 30),
    new THREE.MeshPhongMaterial({ color:corSup, transparent:true, opacity:.62,
                                  shininess:110, specular:0xffffff,
                                  side:THREE.DoubleSide, depthWrite:false }));
  superficie.rotation.x = -Math.PI/2;
  superficie.position.y = Y_SUP + .004;
  g.add(superficie);

  const menisco = new THREE.Mesh(
    new THREE.TorusGeometry(op.r*.893, .020, 8, 34),
    new THREE.MeshPhongMaterial({ color:0xffffff, transparent:true, opacity:.26,
                                  shininess:150, specular:0xffffff, depthWrite:false }));
  menisco.rotation.x = Math.PI/2;
  menisco.position.y = Y_SUP + .006;
  g.add(menisco);

  /* ---- pastilha efervescente: inteira (disco) ou moída (grãozinhos) ----
     Laranja-claro, de pastilha efervescente de verdade. Fosca: é comprimido
     prensado, não bala — por isso toon puro, sem specular. */
  const COR_PASTILHA = 0xf2b06a;
  const R_PASTILHA   = .34;
  const compr = new THREE.Group(); compr.position.y = .32; g.add(compr);
  function montarComprimido(emPo){
    while(compr.children.length) compr.remove(compr.children[0]);
    if(emPo){
      for(let i = 0; i < 26; i++){
        const gr = new THREE.Mesh(new THREE.IcosahedronGeometry(.055, 0), toon(COR_PASTILHA));
        const a = Math.random() * Math.PI * 2, rr = Math.random() * op.r * .72;
        gr.position.set(Math.cos(a)*rr, Math.random()*.14, Math.sin(a)*rr);
        compr.add(gr);
      }
    } else {
      const d = new THREE.Mesh(new THREE.CylinderGeometry(R_PASTILHA, R_PASTILHA, .13, 22),
                               toon(COR_PASTILHA));
      compr.add(d);
    }
  }
  montarComprimido(op.po);

  /* ---- pool de bolhas ---- */
  const geoB = new THREE.SphereGeometry(.055, 7, 5);
  /* Phong com specular alto e opacidade baixa: uma bolha de gás na água é
     quase invisível no meio e brilhante na borda. depthWrite desligado para
     bolhas sobrepostas se somarem em vez de disputarem o z-buffer.
     Sem envMap de propósito: o cubo do laboratório é PMREM (CubeUV), que só
     Standard sabe ler, e Standard em 220 esferinhas transparentes é caro para
     o que renderiam — o specular sozinho já dá o ponto de brilho. */
  const matB = new THREE.MeshPhongMaterial({
    color:0xffffff, transparent:true, opacity:.44,
    shininess:130, specular:0xffffff, depthWrite:false
  });
  const MAXB = 90, bolhas = [];
  for(let i = 0; i < MAXB; i++){
    const b = new THREE.Mesh(geoB, matB);
    b.visible = false; b.userData.viva = false;
    g.add(b); bolhas.push(b);
  }

  const est = { taxa: op.taxa, acumulador: 0, alturaLiq, r: op.r, po: op.po };
  let tempo = 0;                          // relógio próprio: pausa junto com a cena

  /* ---- sítios de nucleação ----
     Poucos e FIXOS: é o que transforma bolhas soltas em fios de bolhas. Com
     a pastilha inteira eles se apertam no disco; moída, espalham pelo fundo
     inteiro — que é exatamente o que a aula de superfície de contato quer
     mostrar. Resorteados quando setPo() troca o estado da pastilha. */
  const N_SITIOS = 7;
  const sitios = [];
  function sortearSitios(){
    sitios.length = 0;
    const raio = est.po ? op.r * .74 : R_PASTILHA * .92;
    for(let i = 0; i < N_SITIOS; i++){
      const a = Math.random() * Math.PI * 2;
      const rr = Math.sqrt(Math.random()) * raio;   // sqrt = uniforme na ÁREA
      sitios.push({ x:Math.cos(a)*rr, z:Math.sin(a)*rr, peso:.35 + Math.random() });
    }
  }
  sortearSitios();

  function sortearSitio(){
    let total = 0;
    for(let i = 0; i < sitios.length; i++) total += sitios[i].peso;
    let alvo = Math.random() * total;
    for(let i = 0; i < sitios.length; i++){
      alvo -= sitios[i].peso;
      if(alvo <= 0) return sitios[i];
    }
    return sitios[0];
  }

  function nascerBolha(){
    for(let i = 0; i < MAXB; i++){
      const b = bolhas[i], u = b.userData;
      if(u.viva) continue;
      const s = sortearSitio();
      /* Jitter pequeno: o fio treme, mas continua sendo um fio. */
      u.sx = s.x + (Math.random()-.5) * .045;
      u.sz = s.z + (Math.random()-.5) * .045;
      /* pow(rand, 2.2) = muitas pequenas, poucas grandes. Distribuição
         uniforme dava um enxame de bolhas todas do mesmo tamanho. */
      u.r0 = .50 + Math.pow(Math.random(), 2.2) * 1.45;
      u.vy0 = .40 + Math.random() * .34 + u.r0 * .10;   // bolha maior sobe mais
      u.fase = Math.random() * 6.283;
      u.omega = (5.6 - u.r0 * 1.3) + Math.random() * 2;  // pequena treme mais
      u.balanco = .010 + Math.random() * .028;
      u.estado = 0;      // 0 subindo · 1 boiando (espuma) · 2 estourando
      u.t = 0;
      u.vidaSup = .18 + Math.random() * .42;
      b.position.set(u.sx, .34 + Math.random() * .04, u.sz);
      b.scale.setScalar(.001);
      u.viva = true; b.visible = true;
      return;
    }
  }

  function atualizar(dt){
    tempo += dt;

    /* Teto em 1.4 na DENSIDADE: acima disso o aquecimento continua acelerando
       a subida (rapidez, logo abaixo, vai até taxa 3), mas não adianta
       empilhar mais bolhas. Sem o teto, aquecerBancada() levaria os dois
       béqueres à mesma mancha branca saturada, e a comparação — que é o
       assunto da aula — desapareceria justo no clímax. */
    est.acumulador += Math.min(est.taxa, 1.4) * dt * 26;
    while(est.acumulador >= 1){ est.acumulador -= 1; nascerBolha(); }

    const rapidez = 1 + Math.min(est.taxa, 3) * .30;
    const rMax = op.r * .86;

    for(let i = 0; i < MAXB; i++){
      const b = bolhas[i], u = b.userData;
      if(!u.viva) continue;
      u.t += dt;

      if(u.estado === 0){
        /* h = quanto da coluna já subiu, 0 no fundo e 1 na superfície. */
        const h = clamp((b.position.y - .34) / (Y_SUP - .34), 0, 1);
        /* acelera com a altura; o gás expande e a bolha cresce */
        b.position.y += u.vy0 * (.55 + .75 * h) * rapidez * dt;
        const cresce = 1 + .55 * h;
        const nasce  = clamp(u.t / .10, 0, 1);      // não surge do nada
        const s = u.r0 * cresce * nasce;
        b.scale.set(s, s, s);
        /* espiral que abre conforme sobe */
        const ang = u.fase + tempo * u.omega;
        const raio = u.balanco * (.30 + h);
        b.position.x = u.sx + Math.cos(ang) * raio;
        b.position.z = u.sz + Math.sin(ang) * raio;

        if(b.position.y >= Y_SUP){ u.estado = 1; u.t = 0; b.position.y = Y_SUP; }

      } else if(u.estado === 1){
        /* Boiando na superfície, achatada pela tensão superficial e
           empurrada para a borda. Enquanto a taxa é alta, chegam mais do que
           estouram e o colarinho de espuma se forma sozinho. */
        const s = u.r0 * 1.55;
        b.scale.set(s, s * .55, s);
        const d = Math.hypot(b.position.x, b.position.z) || 1;
        if(d < rMax){
          b.position.x += b.position.x / d * dt * .20;
          b.position.z += b.position.z / d * dt * .20;
        }
        if(u.t >= u.vidaSup){ u.estado = 2; u.t = 0; }

      } else {
        /* Estouro: some em 0.1 s abrindo um tico, em vez de piscar. */
        const k = 1 - u.t / .10;
        if(k <= 0){ u.viva = false; b.visible = false; continue; }
        const s = u.r0 * 1.55 * (1 + (1-k) * .5) * k;
        b.scale.set(s, s * .55, s);
      }
    }

    /* Ondulação da superfície: proporcional à efervescência, e some quando
       o líquido está parado. Duas senoides de período diferente para não
       virar um pulso metronômico. */
    const agita = Math.min(est.taxa, 1.6);
    const onda = (Math.sin(tempo * 3.1) * .006 + Math.sin(tempo * 5.3 + 1.7) * .0035) * agita;
    superficie.position.y = Y_SUP + .004 + onda;
    menisco.position.y    = Y_SUP + .006 + onda * .6;
    liq.scale.x = liq.scale.z = 1 + Math.sin(tempo * 2.4) * .004 * agita;
  }

  return {
    grupo:g, estado:est, atualizar,
    setTaxa(v){ est.taxa = v; },
    setPo(v){ est.po = v; montarComprimido(v); sortearSitios(); },
    setCorLiquido(c){
      liq.material.color.setHex(c);
      superficie.material.color.copy(new THREE.Color(c).lerp(new THREE.Color(0xffffff), .34));
    },
    posicao(){ return new THREE.Vector3(op.x, op.h*.6, op.z); },
    /* usado no quiz 3D: alvo clicável */
    alvos: [copo, liq, fundo, marcas, superficie]
  };
}

/* ---- Bico de Bunsen com chama animada ---- */
function criarBunsen(x, z){
  const g = new THREE.Group(); g.position.set(x, 0, z);
  /* Bico de Bunsen: METAL escovado. */
  const base = new THREE.Mesh(new THREE.CylinderGeometry(.42, .5, .16, 24),
    metal({ cor:0x8f9499, rugosidade:.42, repete:2 }));
  base.position.y = .08; g.add(base);
  const tubo = new THREE.Mesh(new THREE.CylinderGeometry(.13, .16, 1.0, 20),
    metal({ cor:0xc2c8ce, rugosidade:.26, repete:1.2 }));
  tubo.position.y = .6; g.add(tubo);
  /* colar de regulagem de ar */
  const colar = new THREE.Mesh(new THREE.CylinderGeometry(.175, .175, .17, 20),
    metal({ cor:0x6f757b, rugosidade:.5, repete:2.4 }));
  colar.position.y = .3; g.add(colar);

  const chama = new THREE.Group(); chama.position.y = 1.08; chama.visible = false; g.add(chama);
  const c1 = new THREE.Mesh(new THREE.ConeGeometry(.20, .82, 14),
    new THREE.MeshBasicMaterial({ color:CORES.quente, transparent:true, opacity:.85 }));
  c1.position.y = .41; chama.add(c1);
  const c2 = new THREE.Mesh(new THREE.ConeGeometry(.11, .46, 12),
    new THREE.MeshBasicMaterial({ color:CORES.frio, transparent:true, opacity:.9 }));
  c2.position.y = .23; chama.add(c2);

  const luz = new THREE.PointLight(CORES.quente, 0, 6); luz.position.y = 1.4; g.add(luz);

  let ligado = false, intensidade = 0;
  function atualizar(dt){
    intensidade += ((ligado ? 1 : 0) - intensidade) * Math.min(1, dt * 3.2);
    chama.visible = intensidade > .02;
    const osc = 1 + Math.sin(performance.now()*.018) * .10;
    chama.scale.set(intensidade*osc, intensidade*(1.9 - osc*.9) , intensidade*osc);
    luz.intensity = intensidade * 1.6;
  }
  return {
    grupo:g, atualizar,
    ligar(v){ ligado = v; },
    estaLigado(){ return ligado; }
  };
}

/* ---- Suporte/tripé simples só pra compor a bancada ---- */
function criarTripe(x, z){
  const g = new THREE.Group(); g.position.set(x, 0, z);
  /* Suporte universal: tudo METAL. */
  const haste = new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,2.6,14),
    metal({ cor:0xc6ccd2, rugosidade:.24, repete:.6 }));
  haste.position.set(0,1.3,0); g.add(haste);
  const base = new THREE.Mesh(new THREE.BoxGeometry(.9,.1,.55),
    metal({ cor:0x82888e, rugosidade:.46, repete:1.6 }));
  base.position.y=.05; g.add(base);
  const braco = new THREE.Mesh(new THREE.BoxGeometry(.7,.07,.07),
    metal({ cor:0xc6ccd2, rugosidade:.24, repete:1.2 }));
  braco.position.set(.35,2.1,0); g.add(braco);
  /* mufa que prende o braço na haste */
  const mufa = new THREE.Mesh(new THREE.BoxGeometry(.17,.2,.17),
    metal({ cor:0x6b7177, rugosidade:.5, repete:2 }));
  mufa.position.set(.05,2.1,0); g.add(mufa);
  return g;
}

/* --------------------------------------------------------------------------
   CENA "BANCADA"
   prepararBancada({ tabletes:'ambos'|'um', taxaA, taxaB, poB, bunsen })
     A = béquer da esquerda   B = béquer da direita
   -------------------------------------------------------------------------- */
function prepararBancada(op){
  op = Object.assign({ taxaA:.4, taxaB:.4, poA:false, poB:false, bunsen:false }, op || {});
  if(cenaMontada === 'bancada' && bancada){    // já montada: só reconfigura
    bancada.A.setTaxa(op.taxaA); bancada.B.setTaxa(op.taxaB);
    bancada.A.setPo(op.poA);     bancada.B.setPo(op.poB);
    bancada.bunsen.ligar(op.bunsen);
    /* Se a abertura tinha esvaziado a bancada, quem pedir a bancada de novo
       recebe o material de volta. É isto que faz "guardado" significar
       guardado, e não perdido. */
    trazerEquipamentos(700);
    return bancada;
  }
  const raiz = novaRaiz();
  raiz.add(criarSala());

  /* Tudo que NÃO é a mesa entra num grupo só. A abertura esvazia a bancada
     desvanecendo este grupo inteiro — a mesa, as paredes e o quadro ficam. */
  const equipamentos = new THREE.Group();
  raiz.add(equipamentos);

  const A = criarBequer({ x:-2.6, z:.2, corLiq:CORES.frio, taxa:op.taxaA, po:op.poA });
  const B = criarBequer({ x: 2.6, z:.2, corLiq:0xffc46b, taxa:op.taxaB, po:op.poB, r:.75 });
  equipamentos.add(A.grupo); equipamentos.add(B.grupo);

  const bunsen = criarBunsen(0, .1);
  equipamentos.add(bunsen.grupo);
  bunsen.ligar(op.bunsen);

  equipamentos.add(criarTripe(-4.8, -.6));
  equipamentos.add(criarTripe( 4.8, -.6));

  /* Os rótulos 3D 'A' e 'B' que flutuavam sobre os béqueres foram removidos:
     poluíam o enquadramento e a narração já diz de qual béquer está falando.
     criarRotulo3D() continua no arquivo, para dicas na cena quando precisar. */

  atualizadores.push((dt)=>{ A.atualizar(dt); B.atualizar(dt); bunsen.atualizar(dt); });

  configurarSombras(raiz);
  cenaMontada = 'bancada';
  bancada = { A, B, bunsen, equipamentos, raiz };
  return bancada;
}

/* --------------------------------------------------------------------------
   ESVAZIAR / REPOR A BANCADA
   guardarEquipamentos() some com béqueres, Bunsen, tripés e rótulos num fade
   e deixa só a mesa (e as paredes e o quadro). Nada é destruído: os objetos
   continuam na cena com visible=false, as bolhas continuam sendo simuladas e
   o estado do Bunsen é preservado — trazerEquipamentos() devolve tudo como
   estava. prepararBancada() já chama a reposição sozinha.
   -------------------------------------------------------------------------- */
function guardarEquipamentos(ms){
  if(bancada && bancada.equipamentos)
    desvanecer(bancada.equipamentos, 0, ms === undefined ? 1200 : ms);
}
function trazerEquipamentos(ms){
  if(bancada && bancada.equipamentos)
    desvanecer(bancada.equipamentos, 1, ms === undefined ? 800 : ms);
}

/* ==========================================================================
   TORNEIRAS GOTEJANTES — a metáfora de velocidade da abertura
   --------------------------------------------------------------------------
   Duas torneiras de frente uma para a outra, pingando cada uma no seu béquer.
   A da direita pinga bem mais rápido: é "quanto acontece por segundo" antes
   de a fórmula aparecer.

   Ficam num grupo PRÓPRIO, pendurado direto na raiz da cena — e não em
   bancada.equipamentos. A abertura esvazia a bancada com um fade e deixa
   aquele grupo invisível; se as torneiras morassem lá, nasceriam apagadas.
   ========================================================================== */
/* Ponta ESQUERDA do tampo (que vai até x = -6.5), a dois passos da parede
   lateral das fórmulas (x = -7.4). Nesta posição o mural vira o fundo das
   torneiras em vez de um vazio distante. Anda junto com o alvo de
   CAM_TORNEIRAS — mover um sem o outro desenquadra a cena. */
const TORNEIRA_X = -5.4;

let torneiras = null;          // { grupo, A, B } enquanto a cena viver

/* op.para = +1 ou -1: para que lado do eixo Z o braço aponta. Como as duas
   se olham, cada uma recebe um sinal. */
function criarTorneira(op){
  op = Object.assign({ x:-.4, z:0, para:1, taxa:1, corGota:CORES.frio }, op || {});
  const g = new THREE.Group(); g.position.set(op.x, 0, op.z);
  const BRACO = .58;                                   // alcance do braço
  const met = (c, r) => metal({ cor:c, rugosidade:r, repete:1.6 });

  const flange = new THREE.Mesh(new THREE.CylinderGeometry(.20, .22, .09, 20), met(0x8f959b, .45));
  flange.position.y = .045; g.add(flange);

  const coluna = new THREE.Mesh(new THREE.CylinderGeometry(.085, .085, 1.5, 16), met(0xc6ccd2, .24));
  coluna.position.y = .79; g.add(coluna);

  /* volante de abrir/fechar, no topo da coluna */
  const volante = new THREE.Mesh(new THREE.TorusGeometry(.15, .034, 8, 20), met(0x9aa0a6, .38));
  volante.rotation.x = Math.PI / 2; volante.position.y = 1.58; g.add(volante);

  const braco = new THREE.Mesh(new THREE.CylinderGeometry(.07, .07, BRACO, 14), met(0xc6ccd2, .24));
  braco.rotation.x = Math.PI / 2;                      // deita o cilindro no eixo Z
  braco.position.set(0, 1.46, op.para * BRACO / 2); g.add(braco);

  const bico = new THREE.Mesh(new THREE.CylinderGeometry(.055, .048, .26, 14), met(0xc6ccd2, .24));
  bico.position.set(0, 1.33, op.para * BRACO); g.add(bico);

  /* --- béquer embaixo do bico --- */
  const zb = op.para * BRACO;
  const copo = new THREE.Mesh(new THREE.CylinderGeometry(.34, .31, .86, 22, 1, true), vidro());
  copo.position.set(0, .45, zb); g.add(copo);
  const fundo = new THREE.Mesh(new THREE.CylinderGeometry(.31, .31, .06, 22), vidro());
  fundo.position.set(0, .05, zb); g.add(fundo);
  const liquido = new THREE.Mesh(new THREE.CylinderGeometry(.30, .28, .30, 22),
    toon(op.corGota, { transparent:true, opacity:.72 }));
  liquido.position.set(0, .21, zb); g.add(liquido);

  /* Superfície da água, pelo mesmo motivo do béquer da bancada: a tampa do
     cilindro em toon é um disco chapado, e é justamente a superfície que
     conta que ali dentro tem líquido. */
  const Y_SUP_T = .36;                       // topo do cilindro: .21 + .30/2
  const supT = new THREE.Mesh(
    new THREE.CircleGeometry(.30, 24),
    new THREE.MeshPhongMaterial({
      color: new THREE.Color(op.corGota).lerp(new THREE.Color(0xffffff), .34),
      transparent:true, opacity:.62, shininess:110, specular:0xffffff,
      side:THREE.DoubleSide, depthWrite:false }));
  supT.rotation.x = -Math.PI/2;
  supT.position.set(0, Y_SUP_T + .004, zb);
  g.add(supT);

  /* --- ondas de impacto ------------------------------------------------
     A gota simplesmente sumia ao tocar a água. O que faz a queda parecer
     queda é o que acontece DEPOIS dela: um anel que abre e some. Pool de 5
     porque mesmo a torneira rápida (5 gotas/s, onda de 0.55 s) nunca tem
     mais que três vivas ao mesmo tempo. */
  const MAXO = 5, ondas = [];
  for(let i = 0; i < MAXO; i++){
    const o = new THREE.Mesh(
      new THREE.RingGeometry(.055, .085, 20),
      new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:0,
                                    side:THREE.DoubleSide, depthWrite:false }));
    o.rotation.x = -Math.PI/2;
    o.position.set(0, Y_SUP_T + .008, zb);
    o.visible = false; o.userData.t = -1;      // t < 0 = livre no pool
    g.add(o); ondas.push(o);
  }
  function bater(){
    for(let i = 0; i < MAXO; i++){
      if(ondas[i].userData.t >= 0) continue;
      ondas[i].userData.t = 0;
      ondas[i].scale.setScalar(.6);
      ondas[i].visible = true;
      return;
    }
  }

  /* --- gotas: pool fixo, recicladas ao bater no líquido --- */
  const Y_BICO = 1.19, Y_AGUA = .38;
  const geoG = new THREE.SphereGeometry(.05, 10, 8);
  const matG = toon(op.corGota, { transparent:true, opacity:.9 });
  const MAXG = 16, gotas = [];
  for(let i = 0; i < MAXG; i++){
    const m = new THREE.Mesh(geoG, matG);
    m.scale.y = 1.4;                                   // gota, não bolinha
    m.visible = false; m.userData.viva = false;
    m.position.z = zb;
    g.add(m); gotas.push(m);
  }

  let taxa = op.taxa, acumulador = 0;
  function nascer(){
    for(let i = 0; i < MAXG; i++){
      const m = gotas[i];
      if(m.userData.viva) continue;
      m.position.set(0, Y_BICO, zb);
      m.userData.viva = true; m.userData.vy = 0;
      m.visible = true;
      return;
    }
  }
  function atualizar(dt){
    acumulador += taxa * dt;
    while(acumulador >= 1){ acumulador -= 1; nascer(); }
    for(let i = 0; i < MAXG; i++){
      const m = gotas[i];
      if(!m.userData.viva) continue;
      m.userData.vy -= 7.2 * dt;                       // gravidade "de cena"
      m.position.y += m.userData.vy * dt;
      if(m.position.y <= Y_AGUA){
        m.userData.viva = false; m.visible = false;
        bater();
      }
    }
    /* Anéis de impacto: abrem até a borda do copo e somem em quadrática —
       rápido no começo e devagar no fim, que é como uma onda perde energia. */
    for(let i = 0; i < MAXO; i++){
      const o = ondas[i];
      if(o.userData.t < 0) continue;
      o.userData.t += dt;
      const p = o.userData.t / .55;
      if(p >= 1){ o.userData.t = -1; o.visible = false; o.material.opacity = 0; continue; }
      const s = .6 + p * 3.0;                          // .085 * 3.6 = .30 = raio do copo
      o.scale.set(s, s, s);
      o.material.opacity = .55 * (1 - p) * (1 - p);
    }
  }

  return { grupo:g, atualizar, setTaxa(v){ taxa = v; }, zBico: op.z + zb };
}

/* Monta as duas torneiras. Idempotente: rodarStory rearma cues quando o áudio
   volta no tempo, e sem esta guarda um seek montaria tudo de novo. */
function mostrarTorneiras(){
  if(torneiras || !raizCena) return torneiras;

  const g = new THREE.Group();
  /* A à ESQUERDA da tela e B à direita: nesta câmera o eixo horizontal é o Z
     invertido, então B (a rápida) fica no z menor. */
  /* taxa = gotas por segundo. A queda do bico até a água leva ~0.47s, então
     em A há sempre uma gota só, com intervalo visível entre elas, e em B há
     duas ou três no ar ao mesmo tempo. É essa diferença que a pergunta cobra. */
  const A = criarTorneira({ x:TORNEIRA_X, z:-0.3, para:-1, taxa:1, corGota:CORES.frio });
  const B = criarTorneira({ x:TORNEIRA_X, z:-2.9, para: 1, taxa:5, corGota:CORES.quente });
  g.add(A.grupo); g.add(B.grupo);

  const rotA = criarRotulo3D('A', TORNEIRA_X, ROTULO_Y, -0.3, '#6fb7ff', ROTULO_TAM);
  const rotB = criarRotulo3D('B', TORNEIRA_X, ROTULO_Y, -2.9, '#ff9d33', ROTULO_TAM);
  g.add(rotA); g.add(rotB);

  raizCena.add(g);
  configurarSombras(g);
  atualizadores.push((dt)=>{ A.atualizar(dt); B.atualizar(dt); });

  /* rotA/rotB guardados: a dialogo1.1 pulsa esses rótulos. */
  torneiras = { grupo:g, A, B, rotA, rotB };
  return torneiras;
}

/* --------------------------------------------------------------------------
   ANOTAÇÕES 3D das torneiras ("10 gotas", "em 2 s"…)
   Sprite com o canvas dimensionado ao texto, para a pílula de fundo ficar
   justa em qualquer comprimento. Sem mipmap, pelo mesmo motivo do quadro:
   nesta escala o texto é minificado e o filtro trilinear o borraria.
   -------------------------------------------------------------------------- */
function criarTexto3D(txt, x, y, z, cor, alturaMundo){
  const F = 96;
  const FONTE = '800 ' + F + 'px "Segoe UI", system-ui, Roboto, Arial, sans-serif';
  const cv = document.createElement('canvas');
  const c = cv.getContext('2d');
  c.font = FONTE;                                   // mede com o canvas padrão
  cv.width  = Math.ceil(c.measureText(txt).width) + 64;
  cv.height = Math.round(F * 1.62);
  c.font = FONTE;                                   // redimensionar zerou o estado

  const r = cv.height * .34;
  c.fillStyle = 'rgba(18,17,16,.88)';
  c.beginPath();
  if(c.roundRect) c.roundRect(3, 3, cv.width-6, cv.height-6, r);
  else            c.rect(3, 3, cv.width-6, cv.height-6);
  c.fill();
  c.strokeStyle = cor; c.lineWidth = 5; c.stroke();
  c.fillStyle = cor; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(txt, cv.width/2, cv.height/2 + 2);

  const tex = new THREE.CanvasTexture(cv);
  tex.generateMipmaps = false;
  tex.minFilter = THREE.LinearFilter; tex.magFilter = THREE.LinearFilter;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, transparent:true, depthTest:false }));
  const h = alturaMundo || .42;
  sp.scale.set(h * cv.width / cv.height, h, 1);
  sp.position.set(x, y, z);
  sp.renderOrder = 6;
  return sp;
}

/* Anotações criadas pela coreografia, por chave — a chave também evita que um
   seek para trás rearme o cue e crie o mesmo texto duas vezes. */
const _anotacoes = {};
function anotarTorneira(chave, txt, cor, z, y, h){
  if(!torneiras || _anotacoes[chave]) return null;
  const sp = criarTexto3D(txt, TORNEIRA_X, (y === undefined ? ANOTACAO_Y : y), z, cor, h);
  torneiras.grupo.add(sp);
  _anotacoes[chave] = sp;
  return sp;
}
/* Altura de mundo das anotações: 0.42 originais, -30%, e agora -20% de novo.
   O sprite escala o canvas inteiro, então a pílula e a letra encolhem juntas —
   é um número só para as duas coisas. */
const ANOTACAO_H = .23;

/* Z das anotações, PUXADO PARA DENTRO do par (as torneiras estão em -0.3 e
   -2.9). Centradas na própria torneira elas se estendiam para fora do
   conjunto, e no enquadramento atual isso as cortava nas duas bordas — a
