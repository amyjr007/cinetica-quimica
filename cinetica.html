   anotação de A chegava a ndcX -1.12. Assim cada uma continua mais perto da
   sua torneira, mas sobra folga nas pontas e um vão de 0.26 entre elas. */
const ANOTACAO_ZA = -0.75;
const ANOTACAO_ZB = -2.45;

/* --------------------------------------------------------------------------
   ALTURAS DA PILHA sobre cada torneira. As três medidas andam juntas:
     1.614  topo do volante (y do volante 1.58 + o tubo do toro, 0.034)
     ROTULO_Y     selo quadrado, encostando nesse topo
     ANOTACAO_Y   anotação, logo ACIMA do selo
   A anotação subiu porque o selo desceu: ela ficava no vão entre o selo e a
   torneira, e esse vão deixou de existir.
   -------------------------------------------------------------------------- */
const TORNEIRA_TOPO = 1.614;
const ROTULO_TAM = .36;
const ROTULO_Y   = TORNEIRA_TOPO + ROTULO_TAM / 2;
const ANOTACAO_Y = ROTULO_Y + ROTULO_TAM / 2 + ANOTACAO_H / 2 + .04;

/* Troca o texto de uma anotação já criada. Precisa recriar o sprite porque o
   canvas é dimensionado ao texto — "10 gotas" e "10 gotas em 2 s" não cabem
   na mesma pílula. */
function trocarAnotacao(chave, txt, cor, z, y, h){
  sumirAnotacao(chave);
  return anotarTorneira(chave, txt, cor, z, y, h);
}

/* Tira UMA anotação de cena, com a textura e o material dela. A da torneira A
   sai aos 34 s da dialogo1.2, para a velocidade calculada ocupar o lugar. */
function sumirAnotacao(chave){
  const sp = _anotacoes[chave];
  if(!sp) return;
  if(sp.parent) sp.parent.remove(sp);
  if(sp.material){
    if(sp.material.map) sp.material.map.dispose();
    sp.material.dispose();
  }
  delete _anotacoes[chave];
}

function limparAnotacoes(){
  Object.keys(_anotacoes).forEach(sumirAnotacao);
}

/* --------------------------------------------------------------------------
   34 s da dialogo1.2: a anotação "2 gotas em 2 s" sai da torneira A e a
   velocidade calculada voa da fórmula para o lugar dela — o mesmo pedaço de
   conta, agora colado no objeto de que ele fala.

   Duas medidas saem do sprite e por isso são tiradas ANTES de ele sumir —
   depois não há mais o que projetar:
     alvo        onde o sprite está, em px de MOLDURA (NDC → tela);
     alturaAlvo  que altura ele tem lá. A pílula do DOM tem 15px de fonte e a
                 do sprite é bem menor neste enquadramento, então o resultado
                 pousa reduzido por `fator` em vez de cobrir a torneira.

   As coordenadas são relativas ao CANTO DE #equacao, não à moldura: o filho
   fixed tem #equacao por bloco contentor, porque #equacao tem transform.
   -------------------------------------------------------------------------- */
function moverResultadoParaTorneira(){
  const el = $('eqResultado'), cx = $('equacao');
  if(!el || !cx || !el.classList.contains('vis') || el.classList.contains('voando')) return;

  const sp = _anotacoes['a'];
  let alvo = null, alturaAlvo = 0;
  if(sp && camera){
    const c = sp.getWorldPosition(new THREE.Vector3());
    const topo = c.clone().setY(c.y + sp.scale.y / 2).project(camera);
    const v    = c.clone().project(camera);
    alvo = { x:(v.x * .5 + .5) * telaW(), y:(.5 - v.y * .5) * telaH() };
    /* |topo.y - v.y| é MEIA altura em NDC, e NDC vai de -1 a +1 sobre a tela
       inteira: em px isso é (Δndc/2)*H por metade, ou seja Δndc*H no total. */
    alturaAlvo = Math.abs(topo.y - v.y) * telaH();
  }
  sumirAnotacao('a');
  if(!alvo) return;                       // sem cena montada não há para onde ir

  /* getBoundingClientRect() devolve px de JANELA, já ampliados pela moldura —
     pontoNaMoldura() desfaz a ampliação e desconta o canto da caixa. */
  const rc = cx.getBoundingClientRect(), re = el.getBoundingClientRect();
  const canto = pontoNaMoldura(rc.left, rc.top);
  const de    = pontoNaMoldura(re.left + re.width / 2, re.top + re.height / 2);

  /* Fixa no ponto de PARTIDA antes de sair do fluxo; só no frame seguinte é
     que o destino é escrito, senão o navegador funde as duas mudanças num
     valor só e o elemento teleporta em vez de voar. */
  el.style.left = (de.x - canto.x).toFixed(1) + 'px';
  el.style.top  = (de.y - canto.y).toFixed(1) + 'px';
  /* O translate vai escrito ANTES da classe. Ele está na classe também, e se
     entrasse por ela seria uma MUDANÇA de transform com transition já valendo:
     o elemento sairia deslizando meia caixa para o canto antes de começar a
     viagem de verdade. Escrito antes, o valor não muda quando a classe entra. */
  el.style.transform = 'translate(-50%,-50%)';
  el.classList.add('voando');
  void el.offsetWidth;

  /* A altura só serve DEPOIS da classe: é ela que acrescenta a pílula, e medir
     antes daria um elemento 40% mais baixo do que o que vai voar. offsetHeight
     já vem em px de moldura — a ampliação é transform, e transform não entra
     nessa conta. */
  const fator = (alturaAlvo && el.offsetHeight)
              ? clamp(alturaAlvo / el.offsetHeight, .45, 1) : .7;
  el.style.left = (alvo.x - canto.x).toFixed(1) + 'px';
  el.style.top  = (alvo.y - canto.y).toFixed(1) + 'px';
  el.style.transform = 'translate(-50%,-50%) scale(' + fator.toFixed(3) + ')';
  playSfx('pop', .3);
}

/* --------------------------------------------------------------------------
   PULSO de um sprite. pulsar() do DOM não serve aqui: sprite não tem CSS.
   Roda em tempo real e devolve a escala original no fim, para não acumular.
   -------------------------------------------------------------------------- */
let _pulsos = [];
function pulsarSprite(sp, vezes, ms){
  if(!sp) return;
  _pulsos = _pulsos.filter(p => p.sp !== sp);
  _pulsos.push({ sp, sx:sp.scale.x, sy:sp.scale.y,
                 t:0, dur:((ms || 620) / 1000) * (vezes || 2), vezes:vezes || 2 });
}
function tickPulsos(dt){
  for(let i = _pulsos.length - 1; i >= 0; i--){
    const p = _pulsos[i];
    p.t += dt;
    const f = clamp(p.t / p.dur, 0, 1);
    /* sen² dá `vezes` corcovas inteiras, sempre >= 1: o rótulo só cresce. */
    const k = 1 + .30 * Math.pow(Math.sin(f * Math.PI * p.vezes), 2);
    p.sp.scale.set(p.sx * k, p.sy * k, 1);
    if(f >= 1){ p.sp.scale.set(p.sx, p.sy, 1); _pulsos.splice(i, 1); }
  }
}

/* Sprite de texto (rótulo A / B / dicas na cena). */
/* Selo QUADRADO com uma letra. `tam` é o lado, em unidades de mundo. */
function criarRotulo3D(txt, x, y, z, cor, tam){
  const N = 128, m = 8;                       // canvas quadrado = selo quadrado
  const cv = document.createElement('canvas'); cv.width = cv.height = N;
  const c = cv.getContext('2d');
  c.fillStyle = 'rgba(20,20,19,.85)';
  c.beginPath();
  if(c.roundRect) c.roundRect(m, m, N-2*m, N-2*m, 24); else c.rect(m, m, N-2*m, N-2*m);
  c.fill();
  c.strokeStyle = cor; c.lineWidth = 5; c.stroke();
  c.fillStyle = cor; c.font = 'bold 58px Segoe UI, system-ui, sans-serif';
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(txt, N/2, N/2 + 2);

  const tex = new THREE.CanvasTexture(cv);
  /* Sem mipmap, como o quadro e as anotações: nesta escala o selo é
     minificado e o filtro trilinear borraria a letra. */
  tex.generateMipmaps = false;
  tex.minFilter = THREE.LinearFilter; tex.magFilter = THREE.LinearFilter;

  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, transparent:true, depthTest:false }));
  const s = tam || ROTULO_TAM;
  sp.scale.set(s, s, 1); sp.position.set(x, y, z);
  sp.renderOrder = 5;
  return sp;
}

/* --------------------------------------------------------------------------
   CENA "QUADRO" — bancada vista de longe, com o painel SVG por cima.
   Serve para as faixas que são basicamente gráfico (velocidade, ativação...).
   -------------------------------------------------------------------------- */
function prepararQuadro(qual){
  /* O painel SVG é um overlay de DOM que cobre o quadro. Se a definição da
     abertura continuasse pintada ali embaixo, sobrariam pedaços de texto em
     volta do gráfico. Fica só o título. */
  quadroLimpar();
  if(cenaMontada !== 'quadro'){
    const raiz = novaRaiz();
    raiz.add(criarSala());
    /* Mesmo agrupamento da cena 'bancada', para guardar/trazerEquipamentos()
       funcionarem igual aqui em vez de virarem no-op silencioso. */
    const equipamentos = new THREE.Group();
    raiz.add(equipamentos);
    const A = criarBequer({ x:-3.4, z:.4, corLiq:CORES.frio, taxa:.35 });
    const B = criarBequer({ x: 3.4, z:.4, corLiq:0xffc46b, taxa:.55 });
    equipamentos.add(A.grupo); equipamentos.add(B.grupo);
    atualizadores.push((dt)=>{ A.atualizar(dt); B.atualizar(dt); });
    configurarSombras(raiz);
    cenaMontada = 'quadro';
    bancada = { A, B, bunsen:{ ligar(){}, atualizar(){}, estaLigado(){return false;} },
                equipamentos, raiz };
  }
  if(qual) abrirGrafico(qual);
  return bancada;
}

/* --------------------------------------------------------------------------
   CENA "ARENA MOLECULAR"
   Caixa transparente com esferas coloridas que se movem e colidem.
     modo 'livre' → colisões acontecem sozinhas (efetivas e não efetivas)
     modo 'demo'  → duas moléculas scriptadas, para mostrar UM caso
   temperatura → multiplica a velocidade das esferas
   -------------------------------------------------------------------------- */
const ARENA_L = 2.1;            // meia-aresta útil da caixa
const RAIO_MOL = .19;
const LIMIAR_ENERGIA = 1.05;    // velocidade relativa mínima p/ colisão efetiva

function prepararArena(op){
  op = Object.assign({ n:16, temperatura:1, modo:'livre' }, op || {});
  if(cenaMontada === 'arena' && arena){
    arena.setTemperatura(op.temperatura);
    arena.setN(op.n);
    arena.modo = op.modo;
    return arena;
  }
  const raiz = novaRaiz();
  raiz.add(criarSala());

  /* y = ARENA_L + folga: assim a face de baixo da caixa fica logo acima
     do tampo da bancada, em vez de atravessá-lo. */
  const centro = new THREE.Vector3(0, ARENA_L + .35, 0);
  const g = new THREE.Group(); g.position.copy(centro); raiz.add(g);

  /* caixa transparente + arestas */
  const cx = new THREE.Mesh(
    new THREE.BoxGeometry(ARENA_L*2, ARENA_L*2, ARENA_L*2),
    new THREE.MeshPhongMaterial({ color:0xffb0a0, transparent:true, opacity:.055,
      side:THREE.BackSide, depthWrite:false }));
  g.add(cx);
  const arestas = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.BoxGeometry(ARENA_L*2, ARENA_L*2, ARENA_L*2)),
    new THREE.LineBasicMaterial({ color:0xff7a6e, transparent:true, opacity:.85 }));
  g.add(arestas);

  /* geometria/materiais compartilhados */
  const geoM = new THREE.SphereGeometry(RAIO_MOL, 18, 14);
  const geoNub = new THREE.SphereGeometry(RAIO_MOL*.46, 12, 10);
  const matA = toon(CORES.frio);
  const matB = toon(CORES.fogo);
  const matP = toon(CORES.rubi);
  const matNub = toon(0xffffff);

  const moleculas = [];
  let temperatura = op.temperatura;

  function criarMolecula(tipo){
    const m = new THREE.Mesh(geoM, tipo === 'A' ? matA : (tipo === 'B' ? matB : matP));
    contorno(m, 1.10);
    const nub = new THREE.Mesh(geoNub, matNub);   // "sítio reativo" (orientação)
    nub.position.set(0, 0, RAIO_MOL * .92);
    m.add(nub);
    m.userData = {
      tipo,
      vel: new THREE.Vector3(),
      giro: new THREE.Vector3((Math.random()-.5)*2, (Math.random()-.5)*2, (Math.random()-.5)*2),
      nub
    };
    sortearPosicao(m);
    sortearVelocidade(m);
    /* Aqui e não no fim de prepararArena(): setN() cria moléculas depois que
       a cena já está montada, e elas precisam entrar no mapa de sombras
       também. Tem de vir DEPOIS do m.userData = {...} acima, que substitui o
       objeto inteiro e apagaria as marcas. */
    configurarSombras(m);
    g.add(m); moleculas.push(m);
    return m;
  }
  function sortearPosicao(m){
    const lim = ARENA_L - RAIO_MOL - .05;
    m.position.set((Math.random()*2-1)*lim, (Math.random()*2-1)*lim, (Math.random()*2-1)*lim);
  }
  function sortearVelocidade(m){
    const v = m.userData.vel;
    v.set(Math.random()*2-1, Math.random()*2-1, Math.random()*2-1).normalize()
     .multiplyScalar((.55 + Math.random()*.75) * temperatura);
  }

  for(let i = 0; i < op.n; i++) criarMolecula(i % 2 === 0 ? 'A' : 'B');

  /* --- flashes de colisão --- */
  const flashes = [];
  const geoF = new THREE.SphereGeometry(.34, 14, 10);
  function flashColisao(pos, efetiva){
    const m = new THREE.Mesh(geoF, new THREE.MeshBasicMaterial({
      color: efetiva ? 0xd8ff6a : CORES.cinza, transparent:true,
      opacity: efetiva ? .95 : .35 }));
    m.position.copy(pos); g.add(m);
    flashes.push({ m, t:0, dur: efetiva ? .55 : .28, efetiva });
    if(efetiva) flashBranco();
  }

  /* --- estatística exibida na legenda (opcional) --- */
  const contagem = { efetivas:0, naoEfetivas:0 };

  function colidir(a, b, dt){
    if(!a.visible || !b.visible) return;    // demo: ignora as moléculas ocultas
    const d = a.position.distanceTo(b.position);
    if(d > RAIO_MOL*2) return;

    const n = new THREE.Vector3().subVectors(b.position, a.position).normalize();
    const rel = new THREE.Vector3().subVectors(a.userData.vel, b.userData.vel);
    const vRel = rel.length();

    /* separa (evita grude) */
    const sobre = (RAIO_MOL*2 - d) * .5 + .001;
    a.position.addScaledVector(n, -sobre);
    b.position.addScaledVector(n,  sobre);

    /* reflexão elástica simples */
    const p = rel.dot(n);
    if(p > 0){
      a.userData.vel.addScaledVector(n, -p);
      b.userData.vel.addScaledVector(n,  p);
    }

    /* --- critérios de colisão EFETIVA ---
       1) energia: velocidade relativa acima do limiar
       2) orientação: os "sítios reativos" (nubs) precisam estar voltados um
          para o outro — dot entre a direção do nub e a normal do choque.  */
    const tiposOk = (a.userData.tipo === 'A' && b.userData.tipo === 'B') ||
                    (a.userData.tipo === 'B' && b.userData.tipo === 'A');
    if(!tiposOk){ return; }

    const dirA = a.userData.nub.getWorldPosition(new THREE.Vector3())
                  .sub(a.getWorldPosition(new THREE.Vector3())).normalize();
    const dirB = b.userData.nub.getWorldPosition(new THREE.Vector3())
                  .sub(b.getWorldPosition(new THREE.Vector3())).normalize();
    const orientOk = dirA.dot(n) > .35 && dirB.dot(n) < -.35;
    const energiaOk = vRel >= LIMIAR_ENERGIA * temperatura * .82;

    const meio = new THREE.Vector3().addVectors(a.position, b.position).multiplyScalar(.5);

    if(orientOk && energiaOk){
      contagem.efetivas++;
      flashColisao(meio, true);
      virarProduto(a); virarProduto(b);
      if(Math.random() < .6) playSfx('pop', .25);
    } else {
      contagem.naoEfetivas++;
      if(vRel > .8 && Math.random() < .12) flashColisao(meio, false);
    }
  }

  function virarProduto(m){
    m.material = matP;
    m.userData.tipo = 'P';
    m.userData.tProduto = 0;
    m.scale.setScalar(1.35);
  }
  function voltarReagente(m){
    m.userData.tipo = Math.random() < .5 ? 'A' : 'B';
    m.material = m.userData.tipo === 'A' ? matA : matB;
    m.scale.setScalar(1);
  }

  function atualizar(dt){
    const lim = ARENA_L - RAIO_MOL;
    for(let i = 0; i < moleculas.length; i++){
      const m = moleculas[i], u = m.userData;
      if(!m.visible) continue;              // demo: só as duas em cena se movem
      m.position.addScaledVector(u.vel, dt);
      m.rotation.x += u.giro.x * dt * .8;
      m.rotation.y += u.giro.y * dt * .8;

      ['x','y','z'].forEach((eixo)=>{
        if(m.position[eixo] >  lim){ m.position[eixo] =  lim; u.vel[eixo] *= -1; }
        if(m.position[eixo] < -lim){ m.position[eixo] = -lim; u.vel[eixo] *= -1; }
      });

      /* produto volta a ser reagente depois de um tempo (mantém a cena viva) */
      if(u.tipo === 'P'){
        u.tProduto += dt;
        m.scale.setScalar(lerp(m.scale.x, 1, Math.min(1, dt*4)));
        if(u.tProduto > 2.6) voltarReagente(m);
      }
    }
    for(let i = 0; i < moleculas.length; i++)
      for(let j = i+1; j < moleculas.length; j++)
        colidir(moleculas[i], moleculas[j], dt);

    for(let i = flashes.length - 1; i >= 0; i--){
      const f = flashes[i]; f.t += dt;
      const p = f.t / f.dur;
      f.m.scale.setScalar(.35 + p * (f.efetiva ? 2.4 : 1.1));
      f.m.material.opacity = (f.efetiva ? .95 : .35) * (1 - p);
      if(p >= 1){ g.remove(f.m); f.m.material.dispose(); flashes.splice(i,1); }
    }
  }

  atualizadores.push(atualizar);
  configurarSombras(raiz);
  cenaMontada = 'arena';

  arena = {
    grupo:g, moleculas, modo:op.modo, contagem, flashColisao,
    setTemperatura(T){
      const k = T / Math.max(.05, temperatura);
      temperatura = T;
      moleculas.forEach(m => m.userData.vel.multiplyScalar(k));
    },
    getTemperatura(){ return temperatura; },
    setN(n){
      while(moleculas.length < n) criarMolecula(moleculas.length % 2 === 0 ? 'A' : 'B');
      while(moleculas.length > n){
        const m = moleculas.pop(); g.remove(m);
      }
    },
    /* --- demos scriptadas (usadas nas cues da faixa 'colisoes') --- */
    demo(qual){
      /* esconde as livres e prepara 2 moléculas em rota de colisão */
      moleculas.forEach(m => m.visible = false);
      const a = moleculas[0], b = moleculas[1];
      a.visible = b.visible = true;
      a.userData.tipo = 'A'; a.material = matA; a.scale.setScalar(1);
      b.userData.tipo = 'B'; b.material = matB; b.scale.setScalar(1);
      a.position.set(-1.9, 0, 0); b.position.set(1.9, 0, 0);
      a.userData.giro.set(0,0,0); b.userData.giro.set(0,0,0);
      if(qual === 'efetiva'){
        /* nubs virados um para o outro + velocidade alta */
        a.rotation.set(0,  Math.PI/2, 0);
        b.rotation.set(0, -Math.PI/2, 0);
        a.userData.vel.set( 1.5, 0, 0);
        b.userData.vel.set(-1.5, 0, 0);
      } else {
        /* nubs para cima = orientação errada + velocidade baixa */
        a.rotation.set(-Math.PI/2, 0, 0);
        b.rotation.set(-Math.PI/2, 0, 0);
        a.userData.vel.set( .55, 0, 0);
        b.userData.vel.set(-.55, 0, 0);
      }
      arena.modo = 'demo';
    },
    livre(n){
      moleculas.forEach(m => { m.visible = true; sortearVelocidade(m); });
      if(n) arena.setN(n);
      arena.modo = 'livre';
    }
  };
  arena.setTemperatura(op.temperatura);
  return arena;
}

/* ==========================================================================
   8. CÂMERA ESFÉRICA — c)
   irParaCamera({theta, phi, dist, target:[x,y,z]}, suave, durMs)
     theta = giro horizontal (rad)  |  phi = inclinação (0 = topo, PI = baixo)
     dist  = distância ao alvo      |  target = ponto observado
   ========================================================================== */
const CAM_GERAL   = { theta: 0.00, phi: 1.16, dist: 24.2, target:[0, 1.4, 0] };
/* --------------------------------------------------------------------------
   CAPA — o enquadramento da abertura, antes de tocar em qualquer coisa
   --------------------------------------------------------------------------
   Era a CAM_GERAL também. Virou constante própria porque a CAM_GERAL tem um
   segundo emprego, no 'encerramento', onde ela é uma vista frontal larga que
   ORBITA (orbitaSuave .04). Orbitar em torno de um alvo tão fora da sala como
   este varreria a cena de um jeito que não serve àquela faixa — separar é
   mais barato do que descobrir isso depois.

   Medida no aparelho (384x798, aspecto 0.481, fov 48), com o quadro caindo em:
     topo (-0.64, 0.85)   base (-0.62, 0.53)
     esq  (-1.19, 0.69)   dir  (-0.05, 0.69)
   Ou seja: plano aberto e oblíquo, com o quadro ocupando a metade ESQUERDA da
   tela e a margem esquerda dele saindo de quadro. O que precisa ser lido —
   título e créditos, centrados em tituloU .4395 — cai por volta de ndcX -0.69
   e fica inteiro dentro da tela. Ao mexer nesta constante, é esse o número a
   conferir, não a borda do quadro.
   -------------------------------------------------------------------------- */
/* ATENÇÃO ao recalibrar: os valores 0.13 / 1.28 / 35.5 / [6.9,-7.1,3.1] que
   estiveram aqui foram medidos no aparelho ENQUANTO o canvas estava cortado
   (ver o bloco do canvas no CSS). Naquele estado o celular mostrava só o
   canto superior esquerdo da imagem, ampliado 3x, então a câmera foi afastada
   para compensar um recorte que não existe mais. Voltamos ao valor anterior
   ao episódio; o enquadramento definitivo é para ser medido de novo, agora
   que o que se vê é o que se renderiza. */
const CAM_CAPA    = { theta: 0.00, phi: 1.16, dist: 24.2, target:[0, 1.4, 0] };
const CAM_BEQUER  = { theta: 0.22, phi: 1.34, dist:  9.2, target:[-2.6, 1.1, .2] };
const CAM_BEQUER_B= { theta:-0.22, phi: 1.34, dist:  9.2, target:[ 2.6, 1.1, .2] };
const CAM_DUPLA   = { theta: 0.00, phi: 1.30, dist:  17.2, target:[0, 1.2, .2] };
/* A caixa da arena tem 2·ARENA_L de aresta: a câmera precisa ficar bem
   afastada, senão moléculas passam entre a câmera e a caixa. */
const CAM_ARENA   = { theta: 0.00, phi: 1.30, dist: 22.1, target:[0, 2.45, 0] };
const CAM_ARENA_P = { theta: 0.34, phi: 1.34, dist:  16, target:[0, 2.45, 0] };
/* --------------------------------------------------------------------------
   O QUADRO como fundo — usada nas faixas que abrem o painel de gráfico e nos
   quizzes com `camera: CAM_QUADRO`. Nessas cenas prepararQuadro() chama
   quadroLimpar() antes, então o quadro está sem a definição: sobra o título.

   Medida no aparelho depois da correção do canvas, e conferida no preview:

     preview  theta 0.02  phi 1.29  dist 10.6  target [0.4, 3.2,-2.6]
     celular  theta 0.02  phi 1.24  dist 10.5  target [0.4, 3.5,-2.7]

   com o quadro em topo (-0.13, 0.64) e base (-0.12,-0.26) — contra (-0.14,
   0.65) e (-0.12,-0.24) no preview. Fica o valor do celular.

   O quadro agora é mais largo que a tela (esq -1.90, dir 1.67): sai cortado
   dos dois lados, de propósito, porque aqui ele é FUNDO de um painel de SVG e
   preencher o quadro é o que se quer. O que precisa continuar dentro é o
   título, que vai de ndcX -0.84 a 0.18.
   -------------------------------------------------------------------------- */
const CAM_QUADRO  = { theta: 0.02, phi: 1.24, dist: 10.5, target:[0.4, 3.5, -2.7] };
/* --------------------------------------------------------------------------
   Enquadramento da DEFINIÇÃO — o que se vê ao tocar em COMEÇAR
   --------------------------------------------------------------------------
   O QUADRO É O ASSUNTO aqui, não cenário: a distância é escolhida pelo tamanho
   que o texto precisa ter para ser lido, não pelo enquadramento da sala. Com
   esta constante o quadro ocupa 0.67 de NDC na vertical — 267px numa tela de
   798 — e cada linha da definição sai com ~13.6px reais. É o mínimo com que
   ela se lê no aparelho.

   Não adianta compensar com fonte maior nem com textura maior: o que limita é
   o TAMANHO ANGULAR do quadro na tela. A 111 texels, o corpo que faria a
   definição legível de longe, a lista vira 9 linhas com entrelinha 193 —
   1544px numa textura de 1024. Ou o quadro é assunto, ou o texto encolhe.

   ATENÇÃO ao recalibrar: esteve aqui, por pouco tempo, a medida
   -0.01 / 1.51 / 39.4 / [5.8,-9.6,-0.3], tirada no aparelho ENQUANTO o canvas
   estava cortado (ver o bloco do canvas no CSS). O celular mostrava só o canto
   superior esquerdo, ampliado 3x, e a câmera foi afastada para compensar um
   recorte que não existe mais — naquela distância a definição sairia com 5.9px
   e seria ilegível. Voltamos ao valor anterior.

   O eixo é oblíquo (o centro do quadro não cai no centro da tela), e o
   LAYOUT_QUADRO de pintarQuadro() é calibrado em par com esta constante: ao
   trocá-la, confira as margens do texto.
   -------------------------------------------------------------------------- */
const CAM_QUADRO_DEF = { theta: 0.02, phi: 1.29, dist: 16.2, target:[1.5, -0.4, -1.6] };
/* Vista lateral das duas torneiras (dialogo1, a partir de 20 s). Olha ao longo
   do eixo X, então na tela o eixo horizontal é o Z INVERTIDO: quanto mais
   negativo o z, mais à direita o objeto aparece. É por isso que a torneira B
   — a rápida, que precisa ficar à direita — está no z menor.
   O alvo em x anda junto com TORNEIRA_X: como o olhar corre nesse eixo, mover
   as torneiras sem mover o alvo não as tira de quadro, só as afasta e encolhe.
   Enquadramento medido em celular em pé — em paisagem os rótulos A/B passam
   um pouco acima do topo da tela. */
/* Capturada no aparelho com a câmera livre. Print é imagem: não dá para saber
   se foi tirado com o movimento de 3 s ainda correndo. Valor copiado do app
   ganha de leitura de imagem — sempre.

   Este é o primeiro enquadramento medido DEPOIS da correção do canvas, e por
   isso ele também é a prova de que a correção pegou. O mesmo resultado visual
   foi obtido nas duas telas com câmeras praticamente iguais:

     preview  theta 1.67  phi 1.53  dist 8.9  target [-6.5, 2.4,-1.5]
     celular  theta 1.61  phi 1.50  dist 8.9  target [-6.2, 2.3,-1.6]

   Mesma distância cravada, e os rótulos caindo em (-0.76,-0.18)/(0.79,-0.19)
   contra (-0.75,-0.16)/(0.74,-0.16) — 0.01 a 0.05 de NDC, que é o erro de
   casar duas telas a olho. Antes da correção o mesmo casamento exigia dist
   23.3 contra 43.1.

   Fica o valor do CELULAR, que é onde o app roda de verdade, e que ainda por
   cima saiu um tico mais simétrico: centro dos dois rótulos em -0.005 contra
   +0.015 do preview.

   O que conferir ao mexer aqui são os RÓTULOS A e B, não o quadro: nesta
   câmera o quadro está fora de campo, e o NDC dele explode perto da borda do
   frustum (topo 8.61 no celular, 10.01 no preview) sem que isso signifique
   nada sobre a composição. */
const CAM_TORNEIRAS = { theta: 1.61, phi: 1.50, dist: 8.9, target:[-6.2, 2.3, -1.6] };
const CAM_BUNSEN  = { theta:-0.30, phi: 1.30, dist:  8.8, target:[0, 1.2, .1] };
const CAM_TOPO    = { theta: 0.00, phi: 0.48, dist: 21, target:[0, 1.0, 0] };
/* Olha para a parede lateral esquerda (o "slide"). */
const CAM_PAREDE  = { theta: 1.50, phi: 1.38, dist:  9.9, target:[1.2, 3.6, -1.1] };

let camEstado = { theta:0, phi:1.16, dist:11.5, target:new THREE.Vector3(0,1.4,0) };
let camTween  = null;

/* --------------------------------------------------------------------------
   TELA DE REFERÊNCIA — celular em pé (390x844, aspecto 0.46)
   --------------------------------------------------------------------------
   Antes a referência era PAISAGEM (ASPECT_BASE 1.5) e o retrato afastava a
   câmera em até 2.1x. Isso fazia a MESMA constante enquadrar coisas
   diferentes em cada janela: com dist 20.8, a câmera parava a 20.8 numa tela
   larga, a 40.6 no painel do VS Code e a 43.7 no celular. Era por isso que o
   preview e o celular nunca batiam, e por que um enquadramento achado no
   computador chegava longe demais para ler no aparelho.

   Agora o celular em pé é o 1.0: `dist` é a distância de verdade, e o que se
   vê no aparelho é o que a constante diz. Janelas MAIS LARGAS não afastam
   nada — o FOV é vertical e fixo, então elas mostram a mesma altura e apenas
   mais cena nas laterais. Só janelas mais estreitas que a referência ainda
   precisam recuar, para a cena não ser cortada de lado.

   Consequência: as constantes herdadas da fase "paisagem" foram multiplicadas
   por 2.1, para manterem no celular o enquadramento que já tinham.
   -------------------------------------------------------------------------- */
/* --------------------------------------------------------------------------
   ENQUADRAMENTO ENTRE JANELAS DE FORMATOS DIFERENTES
   --------------------------------------------------------------------------
   A câmera NUNCA muda de lugar por causa da tela. Só o FOV muda.

   Por que não mexer na distância: os alvos destas cenas ficam LONGE do
   assunto (a câmera do quadro mira [6.6,-8.7,0.6] e o quadro está em
   [0,3.4,-6.05]). Com o alvo fora do assunto, aproximar ou afastar não
   apenas muda o tamanho — DESLOCA o assunto na tela. Foi isso que fez cada
   tentativa de compensar por distância desenquadrar tudo de novo.

   Mexendo só no FOV, a posição e a direção ficam intactas, e vale a
   identidade que interessa:

       ndcX = (v . eixoX) / (profundidade * tan(fov/2) * aspecto)

   Se tan(fov/2) * aspecto for constante, ndcX é IDÊNTICO em qualquer janela.
   Ou seja: a composição HORIZONTAL fica igual no celular, no painel do VS Code
   e no computador.

   --------------------------------------------------------------------------
   POR QUE SÓ ISSO NÃO BASTAVA — o celular cortava por cima
   --------------------------------------------------------------------------
   Preservar a horizontal custa a VERTICAL, e a conta é simétrica:

       ndcY = (v . eixoY) / (profundidade * tan(fov/2))

   Com tan(fov/2) = k / aspecto, sai ndcY = (v.eixoY) * aspecto / (k * prof).
   Ou seja: ndcY é PROPORCIONAL AO ASPECTO. Quanto mais LARGA a janela, mais
   longe do centro vertical o assunto vai parar.

   E o assunto destas cenas não está no centro: o alvo da câmera do quadro
   fica bem ABAIXO do quadro, então o quadro já nasce na metade de cima da
   tela. Numa janela mais larga que a referência ele sobe mais — até sair.

   Era exatamente a diferença entre o preview e o aparelho. O painel do VS
   Code é uma tira alta e estreita (aspecto ~0.48, coladinho na referência);
   o celular, com a barra do navegador comendo altura, fica mais LARGO de
   aspecto (0.55, 0.60...). Mais largo = FOV vertical menor = quadro maior e
   mais alto. Daí "no preview está ótimo, no celular está com zoom e em cima".

   A REGRA É "CABER" (contain), e não "preservar a largura":

       tan(fov/2) = tan(FOV_REF/2) * max(1, ASPECT_REF / aspecto)

   O max() põe um PISO na altura visível: nenhuma tela mostra menos vertical
   do que a de referência. Molduras mais estreitas continuam abrindo o FOV para
   não cortar dos lados; molduras mais largas param de fechar e simplesmente
   ganham cena nas laterais.

   O que isso garante: o que aparece na tela de referência aparece em TODAS.
   O que isso não garante: ocupar a mesma fração da largura — numa moldura mais
   larga sobra margem dos lados. É a escolha certa aqui, porque cortar o quadro
   perde a aula e sobrar margem não perde nada.

   E COM A MOLDURA, quase nunca sobra: numa janela larga o app é encaixotado
   em ASPECT_REF exato (ver ajustarMoldura()), então o fator dá 1 e o FOV é
   FOV_REF cravado — o computador mostra o mesmo que o celular. O piso segue
   valendo para o que a moldura não cobre: janelas em pé mais estreitas que a
   referência, como um painel fino do VS Code, que ainda precisam abrir o FOV
   para não cortar dos lados.
   -------------------------------------------------------------------------- */
const ASPECT_REF = 0.481;          // 384x798, o aparelho de referência
const FOV_REF    = 48;             // FOV vertical NA tela de referência

function fovDaTela(){
  const a = (camera && camera.aspect) ? camera.aspect : ASPECT_REF;
  const tan = Math.tan(FOV_REF / 2 * Math.PI / 180) * Math.max(1, ASPECT_REF / a);
  return clamp(2 * Math.atan(tan) * 180 / Math.PI, 20, 70);
}

function aplicarCamera(){
  const s = camEstado;
  const d = s.dist + respiroDelta();   // a tela mexe no FOV, não aqui; o respiro da capa mexe
  const sp = Math.sin(s.phi), cp = Math.cos(s.phi);
  camera.position.set(
    s.target.x + d * sp * Math.sin(s.theta),
    s.target.y + d * cp,
    s.target.z + d * sp * Math.cos(s.theta)
  );
  camera.lookAt(s.target);
}

function irParaCamera(pos, suave, durMs){
  suave = (suave === undefined) ? true : suave;
  /* Qualquer câmera pedida pela coreografia encerra o respiro da capa. */
  respiroDesligar();
  const alvo = {
    theta: pos.theta, phi: clamp(pos.phi, .08, Math.PI - .08), dist: pos.dist,
    target: new THREE.Vector3().fromArray(pos.target || [0,1,0])
  };
  /* Em CÂMERA LIVRE a coreografia não mexe na câmera: você explora a cena
     sem a narração roubar o enquadramento no meio do ajuste. */
  if(camLivre){ camTween = null; return; }

  if(!suave){
    camEstado.theta = alvo.theta; camEstado.phi = alvo.phi; camEstado.dist = alvo.dist;
    camEstado.target.copy(alvo.target);
    aplicarCamera(); camTween = null; return;
  }
  camTween = {
    de: { theta:camEstado.theta, phi:camEstado.phi, dist:camEstado.dist,
          target:camEstado.target.clone() },
    para: alvo, t0: performance.now(), dur: durMs || 1100
  };
}

function tickCamera(){
  if(camTween){
    const p = clamp((performance.now() - camTween.t0) / camTween.dur, 0, 1);
    const e = easeInOutCubic(p);
    const d = camTween.de, a = camTween.para;
    camEstado.theta = lerp(d.theta, a.theta, e);
    camEstado.phi   = lerp(d.phi,   a.phi,   e);
    camEstado.dist  = lerp(d.dist,  a.dist,  e);
    camEstado.target.lerpVectors(d.target, a.target, e);
    if(p >= 1) camTween = null;
  }
  aplicarCamera();
}

/* Órbita lenta contínua (dá vida à cena). Desligada em câmera livre. */
let orbitaSuave = 0;
function tickOrbita(dt){
  if(camLivre || camTween || !orbitaSuave) return;
  camEstado.theta += orbitaSuave * dt;
}

/* --------------------------------------------------------------------------
   RESPIRO DA CAPA — o movimento da tela de abertura
   --------------------------------------------------------------------------
   A capa NÃO gira. Antes, orbitaSuave girava theta sem parar e, se ninguém
   tocasse em nada, a câmera dava a volta completa na sala e acabava olhando
   para a parede de trás — a abertura virava um giro de 360°.

   No lugar disso, a câmera fica PARADA na CAM_CAPA e só respira na
   profundidade: aproxima-se lentamente da cena e, chegando ao ponto mais
   perto, volta. Direção e alvo nunca mudam, então o enquadramento da capa é
   sempre o mesmo — o assunto só cresce e encolhe um tico.

   A curva é (1 - cos)/2: vale 0 no início, 1 na metade do período e 0 de
   novo no fim, com velocidade ZERO nos três pontos. Não existe o "solavanco"
   de quando o movimento inverte — a ida vira volta sem que se perceba.

   A amplitude é uma FRAÇÃO da distância, não um número de unidades. O que se
   percebe é o quanto a cena cresce, e isso é relativo: 1.3 unidades eram 5%
   quando a capa estava a 24.2 e viraram 3.7% quando ela foi para 35.5 — a
   mesma constante, um movimento mais fraco. Com fração, trocar a CAM_CAPA não
   mexe no ritmo do respiro.

   PERIODO é a ida e a volta inteiras. Nesse ritmo a câmera anda meio por
   cento da distância por segundo: dá vida, mas não chama atenção.
   -------------------------------------------------------------------------- */
const RESPIRO_FRACAO  = .054;   // quanto da distância chega a percorrer
const RESPIRO_PERIODO = 30;     // segundos de ida + volta

let respiroCam = null;          // { amp, periodo, t } enquanto a capa está no ar

/* `fracao` é resolvida em unidades AQUI, contra a distância do momento: o
   respiro roda sobre um valor fixo, e não sobre um dist que ele mesmo altera
   a cada frame — o que realimentaria e faria a amplitude escorregar. */
function respiroLigar(fracao, periodo){
  respiroCam = { amp: camEstado.dist * fracao, periodo: periodo, t: 0 };
}

/* Quanto o respiro está tirando da distância neste frame (sempre <= 0). */
function respiroDelta(){
  if(!respiroCam) return 0;
  const f = .5 - .5 * Math.cos(2 * Math.PI * respiroCam.t / respiroCam.periodo);
  return -respiroCam.amp * f;
}

/* Encerra o respiro SEM SALTO: o que ele já tinha aproximado vira distância
   de verdade em camEstado, e o tween seguinte parte de onde a câmera está. */
function respiroDesligar(){
  if(!respiroCam) return;
  camEstado.dist += respiroDelta();
  respiroCam = null;
}

function tickRespiro(dt){
  if(!respiroCam || camLivre) return;
  respiroCam.t += dt;
}

/* ##########################################################################
   MODO CÂMERA LIVRE — ferramenta de desenvolvimento
   --------------------------------------------------------------------------
   LIGAR/DESLIGAR:  tecla L  (ou toque no selo de versão)
   GESTOS (mesmo código para mouse e toque, via Pointer Events):
     1 dedo / arrastar ....... girar em torno do alvo (theta / phi)
     Ctrl + arrastar ......... mover o alvo no plano da tela (pan) — é o pan
                               de dois dedos para quem tem mouse, já que no
                               computador não existe segundo dedo
     2 dedos ................. mover o alvo no plano da tela (pan)
     pinça abrindo ........... vai PARA FRENTE (aproxima)
     pinça fechando .......... vai PARA TRÁS (afasta)
     roda do mouse ........... aproxima / afasta
     setas + W/S ............. mover o alvo (X/Y e Z)
   COPIAR:  tecla C  (ou o botão do HUD) → põe no clipboard o objeto pronto
            para colar numa constante CAM_*.
   Enquanto está ligado, irParaCamera() é ignorada: a coreografia não rouba
   o enquadramento no meio do ajuste.
   ########################################################################## */
let camLivre = false;

function alternarCamLivre(){
  camLivre = !camLivre;
  $('versao').classList.toggle('livre', camLivre);
  $('hudCamera').classList.toggle('on', camLivre);
  mostrarFormatoDaTela();
  $('cena3d').classList.toggle('livre', camLivre);
  camTween = null;
  /* Entrar em câmera livre congela o respiro na distância atual: o valor que
     a tecla C copia é o que está na tela, não a distância "de base". */
  respiroDesligar();
  playSfx('click', .4);
  if(camLivre){ toast('câmera livre · segure 3s para copiar'); }
  else { cancelarSegurar(); toast('câmera livre desligada'); }
}

/* Texto pronto para colar numa constante CAM_*. */
/* Posição de um objeto em coordenadas de TELA: -1 a +1 nos dois eixos, com
   (0,0) no centro. É o que permite comparar o que o aparelho desenhou com o
   que o cálculo previu. */
function ndcDe(obj){
  if(!obj || !camera) return '—';
  const v = obj.getWorldPosition(new THREE.Vector3()).project(camera);
  return '(' + v.x.toFixed(2) + ', ' + v.y.toFixed(2) + ')';
}
/* Mesmo, para um ponto fixo do cenário (o quadro está sempre em z = -6.05). */
function ndcPonto(x, y, z){
  if(!camera) return '—';
  const v = new THREE.Vector3(x, y, z).project(camera);
  return '(' + v.x.toFixed(2) + ', ' + v.y.toFixed(2) + ')';
}

function textoCamera(){
  const s = camEstado;
  const cam = '{ theta: ' + s.theta.toFixed(2) +
              ', phi: '   + s.phi.toFixed(2) +
              ', dist: '  + s.dist.toFixed(1) +
              ', target:[' + s.target.x.toFixed(1) + ',' +
                             s.target.y.toFixed(1) + ',' +
                             s.target.z.toFixed(1) + '] }';

  /* DIAGNÓSTICO. A constante sozinha não diz em que tela ela foi vista, e a
     mesma constante enquadra diferente conforme o aspecto. Com estas linhas,
     um único "copiar" já conta a tela, o fator aplicado e onde os objetos
     realmente caíram — dá para conferir o cálculo contra o aparelho em vez de
     deduzir por print. */
  const l = [];
  l.push('tela ' + telaW() + 'x' + telaH() +
         '  dpr ' + (window.devicePixelRatio || 1).toFixed(2) +
         '  aspecto ' + (camera ? camera.aspect.toFixed(3) : '—') +
         '  fov ' + (camera ? camera.fov.toFixed(1) : '—') +
         '  (a distância NÃO muda com a tela)');
  /* Cantos do quadro: ele está sempre no mesmo lugar do cenário, então dá
     para medir sem depender de a cena estar montada. */
  l.push('quadro topo ' + ndcPonto(0, 6.2, -6.05) +
         '  base ' + ndcPonto(0, 0.6, -6.05) +
         '  esq ' + ndcPonto(-5.25, 3.4, -6.05) +
         '  dir ' + ndcPonto(5.25, 3.4, -6.05));
  if(torneiras){
    l.push('rotulo A ' + ndcDe(torneiras.rotA) + '   rotulo B ' + ndcDe(torneiras.rotB));
    l.push('anota A ' + ndcDe(_anotacoes.a) + '   anota B ' + ndcDe(_anotacoes.b));
  }
  return cam + '\n// ' + l.join('\n// ');
}

/* O HUD é estático (título + botão, definidos no HTML). Só ligamos o clique
   do botão uma vez — não há nada para redesenhar a cada gesto. */
function ligarBotaoCopiar(){
  const b = $('btnCopiarCam');
  if(b) b.onclick = (ev)=>{ ev.stopPropagation(); copiarCamera(); };
}

/* ---- Copiar para a área de transferência (com plano B) ---- */
function copiarCamera(){
  const txt = textoCamera();
  const ok = ()=>{
    playSfx('pop', .4);
    toast('posição copiada ✓');
    const b = $('btnCopiarCam');
    if(b){ b.textContent = 'copiado ✓'; setTimeout(()=>{ const x=$('btnCopiarCam'); if(x) x.textContent='copiar posição'; }, 1300); }
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(ok).catch(()=> copiarPlanoB(txt, ok));
  } else {
    copiarPlanoB(txt, ok);
  }
}
/* navigator.clipboard exige contexto seguro e às vezes gesto do usuário. */
function copiarPlanoB(txt, ok){
  try{
    const ta = document.createElement('textarea');
    ta.value = txt;
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    const deu = document.execCommand('copy');
    document.body.removeChild(ta);
    if(deu){ ok(); return; }
  } catch(e){ /* cai no aviso abaixo */ }
  /* Sem clipboard disponível: deixa o texto na tela, selecionável, para
     copiar à mão. É o caso do Safari sem gesto direto do usuário. */
  toast(txt, 12000, true);
}

/* ---- Toast curto no rodapé ---- */
let _toastTimer = null;
function toast(msg, ms, selecionavel){
  const t = $('toast'); if(!t) return;
  t.textContent = msg;
  t.classList.toggle('selecionavel', !!selecionavel);
  t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(()=> t.classList.remove('show'), ms || 2200);
}

/* --------------------------------------------------------------------------
   Pan: move o ALVO no plano perpendicular à câmera.
   A escala converte pixels em unidades de mundo usando a altura visível na
   distância atual — assim o cenário "gruda" no dedo em qualquer zoom.
   -------------------------------------------------------------------------- */
const _vDir = new THREE.Vector3();
const _vDireita = new THREE.Vector3(), _vCima = new THREE.Vector3();
function panCamera(dxPx, dyPx){
  const alturaVisivel = 2 * camEstado.dist * Math.tan(camera.fov * Math.PI / 360);
  const escala = alturaVisivel / Math.max(1, telaH());

  camera.getWorldDirection(_vDir);
  _vDireita.crossVectors(_vDir, camera.up).normalize();
  _vCima.crossVectors(_vDireita, _vDir).normalize();

  /* arrastar para a direita leva a cena junto → o alvo anda para a esquerda */
  camEstado.target.addScaledVector(_vDireita, -dxPx * escala);
  camEstado.target.addScaledVector(_vCima,     dyPx * escala);
}

/* --------------------------------------------------------------------------
   SEGURAR 3s PARA COPIAR (o "C" do celular)
   Com UM dedo parado na tela por 3 segundos, copia a posição da câmera.
   Um anel de progresso nasce no ponto do toque para você ver a contagem.
   Cancela se o dedo andar (aí você está girando), se entrar um segundo dedo
   ou se soltar antes do tempo.
   -------------------------------------------------------------------------- */
const MS_SEGURAR   = 3000;   // tempo para disparar
const TOLERANCIA_PX = 16;    // quanto o dedo pode tremer sem cancelar

let _segTimer = null, _segOrigem = null;

function iniciarSegurar(x, y){
  cancelarSegurar();
  _segOrigem = { x, y };
  const el = $('segurar');
  if(el){
    el.style.left = x + 'px';
    el.style.top  = y + 'px';
    el.style.setProperty('--dur-segurar', (MS_SEGURAR / 1000) + 's');
    /* reinicia a animação do anel */
    el.classList.remove('on'); void el.offsetWidth; el.classList.add('on');
  }
  _segTimer = setTimeout(()=>{
    _segTimer = null;
    if(el) el.classList.remove('on');
    if(navigator.vibrate) { try { navigator.vibrate([25, 45, 25]); } catch(_){} }
    copiarCamera();
  }, MS_SEGURAR);
}
function cancelarSegurar(){
  if(_segTimer){ clearTimeout(_segTimer); _segTimer = null; }
  _segOrigem = null;
  const el = $('segurar'); if(el) el.classList.remove('on');
}
function segurandoAgora(){ return _segTimer !== null; }

function ligarControlesCamLivre(){
  const cv = $('cena3d');

  /* Um Map com todos os dedos/ponteiros ativos: é o que permite tratar
     1 dedo, 2 dedos e pinça no mesmo fluxo. */
  const ponteiros = new Map();
  let pincaAnterior = 0;
  let centroAnterior = null;

  function centro(){
    let x = 0, y = 0;
    ponteiros.forEach(p => { x += p.x; y += p.y; });
    const n = ponteiros.size || 1;
    return { x: x / n, y: y / n };
  }
  function abertura(){
    const ps = Array.from(ponteiros.values());
    if(ps.length < 2) return 0;
    return Math.hypot(ps[0].x - ps[1].x, ps[0].y - ps[1].y);
  }
  /* Rearma as referências: evita o "salto" quando um dedo entra ou sai. */
  function rearmar(){
    centroAnterior = ponteiros.size ? centro() : null;
    pincaAnterior  = abertura();
  }

  /* Os ponteiros são guardados JÁ em coordenadas de moldura. Convertendo na
     entrada, tudo o que vem depois — centroide, abertura da pinça, deltas,
     tolerância do "segurar" — fica no mesmo sistema do resto do app, e os
     gestos respondem igual no computador e no aparelho. */
  cv.addEventListener('pointerdown', (e)=>{
    if(!camLivre) return;
    try { cv.setPointerCapture(e.pointerId); } catch(_){}
    const p = pontoNaMoldura(e.clientX, e.clientY);
    ponteiros.set(e.pointerId, p);
    rearmar();

    /* 1 dedo parado por 3s = copiar. Com 2 dedos é pan/pinça, então cancela.
       Com Ctrl também: Ctrl+arrastar é pan, e um Ctrl+clique parado copiando
       a câmera sem querer seria uma surpresa desagradável no meio do ajuste. */
    if(ponteiros.size === 1 && !e.ctrlKey) iniciarSegurar(p.x, p.y);
    else cancelarSegurar();
  });

  cv.addEventListener('pointermove', (e)=>{
    if(!camLivre || !ponteiros.has(e.pointerId)) return;
    e.preventDefault();
    const p = pontoNaMoldura(e.clientX, e.clientY);
    ponteiros.set(e.pointerId, p);

    /* Cancela o "segurar para copiar" se virou outro gesto:
       - entrou um segundo dedo (pan/pinça)
       - o dedo andou mais que a tolerância (está girando)
       A checagem de 2 dedos também é feita no pointerdown; repetimos aqui
       porque nem todo navegador entrega o pointerdown do segundo dedo. */
    if(_segOrigem){
      if(ponteiros.size > 1) cancelarSegurar();
      else if(Math.hypot(p.x - _segOrigem.x, p.y - _segOrigem.y) > TOLERANCIA_PX) cancelarSegurar();
    }

    const c = centro();
    if(!centroAnterior){ centroAnterior = c; return; }
    const dx = c.x - centroAnterior.x;
    const dy = c.y - centroAnterior.y;

    if(ponteiros.size === 1){
      if(e.ctrlKey){
        /* --- Ctrl + arrastar: PAN com um ponteiro só ---
           No aparelho o pan é de dois dedos, mas com mouse não existe segundo
           dedo — e ajustar enquadramento sem poder mover o alvo é girar em
           torno do lugar errado. Ctrl é lido A CADA movimento, não no clique:
           dá para começar girando, segurar Ctrl para reposicionar o alvo e
           soltar para voltar a girar, no mesmo arrasto. Como o pan e a órbita
           trabalham sobre o DELTA do ponteiro, a troca no meio não dá salto. */
        panCamera(dx, dy);
      } else {
        /* --- 1 dedo: ÓRBITA --- */
        camEstado.theta -= dx * .0065;
        camEstado.phi    = clamp(camEstado.phi - dy * .0055, .06, Math.PI - .06);
      }
    } else {
      /* --- 2+ dedos: PAN pelo centroide + PINÇA pela abertura --- */
      panCamera(dx, dy);
      const ab = abertura();
      if(pincaAnterior > 0 && ab > 0){
        /* abrindo (ab > pincaAnterior) → razão < 1 → dist diminui → avança */
        camEstado.dist = clamp(camEstado.dist * (pincaAnterior / ab), .4, 60);
      }
      pincaAnterior = ab;
    }
    centroAnterior = c;
  }, { passive:false });

  const soltar = (e)=>{
    if(!ponteiros.has(e.pointerId)) return;
    ponteiros.delete(e.pointerId);
    rearmar();
    cancelarSegurar();       // soltou antes dos 3s → não copia
  };
  cv.addEventListener('pointerup', soltar);
  cv.addEventListener('pointercancel', soltar);

  /* Roda do mouse / trackpad */
  cv.addEventListener('wheel', (e)=>{
    if(!camLivre) return;
    e.preventDefault();
    const passo = 1 + clamp(e.deltaY, -120, 120) / 120 * .12;
    camEstado.dist = clamp(camEstado.dist * passo, .4, 60);
  }, { passive:false });

  /* ---- Teclado ---- */
  window.addEventListener('keydown', (e)=>{
    /* não sequestra teclas se algo estiver sendo digitado */
    const alvo = e.target;
    if(alvo && (alvo.tagName === 'INPUT' || alvo.tagName === 'TEXTAREA' || alvo.isContentEditable)) return;
    if(e.ctrlKey || e.metaKey || e.altKey) return;

    const k = (e.key || '').toLowerCase();

    /* L liga e desliga o modo (funciona mesmo fora da câmera livre) */
    if(k === 'l'){ e.preventDefault(); alternarCamLivre(); return; }
    if(!camLivre) return;

    /* C copia a posição atual */
    if(k === 'c'){ e.preventDefault(); copiarCamera(); return; }

    const p = e.shiftKey ? .5 : .15;
    let mexeu = true;
    switch(e.key){
      case 'ArrowUp':    camEstado.target.y += p; break;
      case 'ArrowDown':  camEstado.target.y -= p; break;
      case 'ArrowLeft':  camEstado.target.x -= p; break;
      case 'ArrowRight': camEstado.target.x += p; break;
      default:
        if(k === 'w')      camEstado.target.z -= p;
        else if(k === 's') camEstado.target.z += p;
        else if(k === '+' || k === '=') camEstado.dist = clamp(camEstado.dist * .92, .4, 60);
        else if(k === '-' || k === '_') camEstado.dist = clamp(camEstado.dist * 1.08, .4, 60);
        else if(k === 'r'){ camEstado.target.set(0, 1.4, 0); camEstado.dist = 11.5;
                            camEstado.theta = 0; camEstado.phi = 1.16; toast('câmera reiniciada'); }
        else mexeu = false;
    }
    if(mexeu) e.preventDefault();
  });
}

/* ==========================================================================
   9. GRÁFICOS SVG — o "coração didático"
   --------------------------------------------------------------------------
   abrirGrafico('conc' | 'energia' | 'mb')  → mostra o painel e o SVG certo
   Cada gráfico tem funções pequenas para as cues chamarem no tempo exato.
   ========================================================================== */
const GRAFICOS = { conc:'svgConc', energia:'svgEnergia', mb:'svgMB' };
const TITULOS_G = {
  conc:   'Concentração × tempo',
  energia:'Diagrama de energia',
  mb:     'Distribuição de Maxwell-Boltzmann'
};

function abrirGrafico(qual){
  Object.keys(GRAFICOS).forEach(k => $(GRAFICOS[k]).classList.add('g-oculto'));
  if(!GRAFICOS[qual]) return;
  $(GRAFICOS[qual]).classList.remove('g-oculto');
  $('painelTitulo').textContent = TITULOS_G[qual] || '';
  $('painelFormula').classList.remove('vis');   // limpa fórmula do gráfico anterior
  mostrar('painelGrafico'); popar('painelGrafico');
}

/* Mostra/esconde um <g class="aparece"> do SVG. */
function svgMostrar(id, v){
  const e = $(id); if(!e) return;
  e.classList.toggle('vis', v !== false);
}
/* Anima o traçado de um <path> (dash offset). */
function desenharPath(id, d, durMs){
  const p = $(id); if(!p) return;
  p.setAttribute('d', d);
  const L = p.getTotalLength ? p.getTotalLength() : 1000;
  p.style.transition = 'none';
  p.style.strokeDasharray  = L;
  p.style.strokeDashoffset = L;
  p.style.opacity = 1;
  void p.getBoundingClientRect();
  p.style.transition = 'stroke-dashoffset ' + ((durMs || 1400)/1000) + 's cubic-bezier(.4,.05,.2,1)';
  p.style.strokeDashoffset = 0;
}

/* --------------------------------------------------------------------------
   (1) CONCENTRAÇÃO × TEMPO
   Reagente decai exponencialmente, produto sobe. Domínio: t ∈ [0,10].
   -------------------------------------------------------------------------- */
const CX0 = 70, CX1 = 520, CY0 = 285, CY1 = 55;   // caixa do gráfico
function cX(t){ return CX0 + (t / 10) * (CX1 - CX0); }
function cY(c){ return CY0 - c * (CY0 - CY1); }    // c ∈ [0,1]

function pathConcentracao(k, produto){
  let d = '';
  for(let i = 0; i <= 60; i++){
    const t = i / 60 * 10;
    const c = produto ? (1 - Math.exp(-k*t)) : Math.exp(-k*t);
    d += (i ? ' L' : 'M') + cX(t).toFixed(1) + ',' + cY(c).toFixed(1);
  }
  return d;
}
function graficoConcGrade(){
  const g = $('cGrade');
  if(g.childNodes.length) return;
  let h = '';
  for(let i = 1; i <= 5; i++){
    const y = CY0 - i * (CY0 - CY1) / 5;
    h += '<line class="grade" x1="' + CX0 + '" y1="' + y.toFixed(1) + '" x2="' + CX1 + '" y2="' + y.toFixed(1) + '"/>';
  }
  for(let i = 1; i <= 5; i++){
    const x = CX0 + i * (CX1 - CX0) / 5;
    h += '<line class="grade" x1="' + x.toFixed(1) + '" y1="' + CY1 + '" x2="' + x.toFixed(1) + '" y2="' + CY0 + '"/>';
  }
  g.innerHTML = h;
}
/* --- API para as cues --- */
function concZerar(){

}
function concDesenharReagente(k, dur){ desenharPath('cReag', pathConcentracao(k || .35, false), dur || 1600); }
function concDesenharProduto(k, dur){  desenharPath('cProd', pathConcentracao(k || .35, true),  dur || 1600); }
function concMostrarDelta(){ svgMostrar('cDelta', true); }

/* --------------------------------------------------------------------------

const E_REAG = 205, E_TOPO = 72, E_PROD = 248, E_TOPO_CAT = 140;

}

/* --------------------------------------------------------------------------
   (3) MAXWELL-BOLTZMANN
   g(E) = sqrt(E)·e^(−E/T) normalizada pela área (por isso aquecer ACHATA e
   desloca para a direita — comportamento fisicamente correto).
   -------------------------------------------------------------------------- */
const MB_X0 = 70, MB_X1 = 520, MB_Y0 = 285, MB_Y1 = 40;
const MB_EMAX = 10, MB_EA = 5.75, MB_ESC = .55;
function mbX(E){ return MB_X0 + (E / MB_EMAX) * (MB_X1 - MB_X0); }
function mbY(g){ return MB_Y0 - (g / MB_ESC) * (MB_Y0 - MB_Y1); }
function mbG(E, T){
  if(E <= 0) return 0;
  return Math.sqrt(E) * Math.exp(-E / T) / (0.8862269 * Math.pow(T, 1.5));
}
function mbPath(T){
  let d = '';
  for(let i = 0; i <= 110; i++){
    const E = i / 110 * MB_EMAX;
    d += (i ? ' L' : 'M') + mbX(E).toFixed(1) + ',' + mbY(mbG(E, T)).toFixed(1);
  }
  return d;
}
function mbPathArea(T){
  let d = 'M' + mbX(MB_EA).toFixed(1) + ',' + MB_Y0;
  for(let i = 0; i <= 60; i++){
    const E = MB_EA + (i / 60) * (MB_EMAX - MB_EA);
    d += ' L' + mbX(E).toFixed(1) + ',' + mbY(mbG(E, T)).toFixed(1);
  }
  d += ' L' + mbX(MB_EMAX).toFixed(1) + ',' + MB_Y0 + ' Z';
  return d;
}
/* linha da Ea posicionada de acordo com MB_EA */
function mbPosicionarEa(){
  const x = mbX(MB_EA);
  const g = $('mbLinhaEa');
  g.querySelector('line').setAttribute('x1', x); g.querySelector('line').setAttribute('x2', x);
  g.querySelector('rect').setAttribute('x', x - 43);
  g.querySelector('text').setAttribute('x', x);
}
/* Escala ÚNICA de temperatura: T=1 → 25 °C (ambiente), T=2.2 → 100 °C
   (água fervendo). Gráfico e termômetro usam esta mesma função, senão os
   dois mostram números diferentes na mesma cena. */
const T_AMBIENTE = 25, T_POR_UNIDADE = 62.5;
function tempCelsius(T){ return T_AMBIENTE + (T - 1) * T_POR_UNIDADE; }

let mbT = 1.0, mbTweenT = null;
function mbDesenhar(T){
  $('mbCurva').setAttribute('d', mbPath(T));
  $('mbArea').setAttribute('d', mbPathArea(T));
  $('mbTxtT').textContent = 'T = ' + Math.round(tempCelsius(T)) + ' °C';
}
function mbZerar(T){
  mbT = (T === undefined) ? 1.0 : T;
  mbPosicionarEa();
  mbDesenhar(mbT);
  svgMostrar('mbLinhaEa', false); svgMostrar('mbRotuloArea', false); svgMostrar('mbLegenda', false);
  $('mbFria').style.opacity = 0;
}
function mbMostrarEa(){ svgMostrar('mbLinhaEa', true); svgMostrar('mbLegenda', true); }
function mbMostrarRotuloArea(){ svgMostrar('mbRotuloArea', true); }
/* aquecer: guarda a curva fria tracejada e anima T → alvo */
function mbAquecer(Talvo, durMs){
  $('mbFria').setAttribute('d', mbPath(mbT));
  $('mbFria').style.opacity = .7;
  mbTweenT = { de: mbT, para: Talvo, t0: performance.now(), dur: durMs || 2600 };
}
function tickMB(){
  if(!mbTweenT) return;
  const p = clamp((performance.now() - mbTweenT.t0) / mbTweenT.dur, 0, 1);
  mbT = lerp(mbTweenT.de, mbTweenT.para, easeInOutCubic(p));
  mbDesenhar(mbT);
  /* termômetro acompanha a curva (microinteração pedida) */
  setTermometro(tempCelsius(mbT));
  if(p >= 1) mbTweenT = null;
}

/* --------------------------------------------------------------------------
   TERMÔMETRO — sincronizado com a temperatura
   -------------------------------------------------------------------------- */
const T_MAX_TERM = 120;                    // topo da escala do termômetro
function setTermometro(celsius){
  const c = clamp(celsius, 0, T_MAX_TERM);
  const p = c / T_MAX_TERM;                // 0..1
  const altura = 12 + p * 52;              // px no viewBox
  const col = $('termColuna'), bulbo = $('termBulbo');
  if(!col) return;
  col.setAttribute('y', (122 - altura).toFixed(1));
  col.setAttribute('height', altura.toFixed(1));
  const cor = corTemperatura(p);
  col.setAttribute('fill', cor); bulbo.setAttribute('fill', cor);
  $('termValor').textContent = Math.round(c) + ' °C';
}
/* azul (frio) → âmbar → vermelho (quente) */
function corTemperatura(p){
  const a = [0x6f,0xb7,0xff], b = [0xff,0x9d,0x33], c = [0xff,0x5a,0x3c];
  const mix = (x, y, t) => Math.round(lerp(x, y, t));
  let r, g, bl;
  if(p < .5){ const t = p/.5;      r = mix(a[0],b[0],t); g = mix(a[1],b[1],t); bl = mix(a[2],b[2],t); }
  else      { const t = (p-.5)/.5; r = mix(b[0],c[0],t); g = mix(b[1],c[1],t); bl = mix(b[2],c[2],t); }
  return 'rgb(' + r + ',' + g + ',' + bl + ')';
}

/* ------------------------------ estado ---------------------------------- */
let quizAtivo   = null;   // id do quiz aberto
let quizItem    = -1;     // índice do item atual
let quizAcertos = 0;
let quizRespondido = false;
let quizAcertouAtual = false;

function abrirQuiz(id){
  quizAtivo = id; quizItem = -1; quizAcertos = 0;
  esconder('play');
  proximoItemQuiz();
}
function fecharQuiz(){
  quizAtivo = null; quizItem = -1;
  esconder('quiz'); esconder('quiz3dAviso');
  $('quiz').innerHTML = '';
  alvos3D = null;
}

/* Avança para o próximo item (com transição deslizante). */
function proximoItemQuiz(){
  const q = QUIZZES[quizAtivo];
  const card = $('quiz').firstElementChild;

  const entrar = ()=>{
    quizItem++;
    if(quizItem >= q.itens.length){ terminarQuiz(); return; }
    montarItemQuiz(q.itens[quizItem]);
  };

  if(card){
    playSfx('proxima', .5);
    card.classList.add('sai-direita');
    setTimeout(entrar, 480);
  } else {
    entrar();
  }
}

function terminarQuiz(){
  /* Lido ANTES de fecharQuiz(), que zera quizAtivo. */
  const aoTerminar = QUIZZES[quizAtivo] && QUIZZES[quizAtivo].aoTerminar;
  fecharQuiz();
  if(aoTerminar){ aoTerminar(); return; }

  /* placar rápido + segue para o encerramento */
  const total = QUIZZES.quiz1.itens.length;
  tituloSecao(quizAcertos + ' / ' + total, quizAcertos === total
    ? 'Gabaritou! Cinética dominada.'
    : 'Bom trabalho — revise o que escapou no sumário.');
  if(quizAcertos >= Math.ceil(total * .7)){ playSfx('funfare'); festaConfete(180); }
  setTimeout(()=>{ esconder('titulo'); tocarFaixaPorId('encerramento'); }, 3200);
}

/* ------------------------- montagem de um item -------------------------- */
function montarItemQuiz(item){
  quizRespondido = false; quizAcertouAtual = false;
  alvos3D = null;
  esconder('quiz3dAviso');

  /* 1) prepara a cena 3D / câmera do item */
  if(item.cena) item.cena();
  if(item.prepararCena) item.prepararCena();
  if(item.camera) irParaCamera(item.camera, true, 900);

  /* 2) monta o card */
  const q = QUIZZES[quizAtivo];
  const n = quizItem + 1, total = q.itens.length;
  const card = document.createElement('div');
  card.className = 'quiz-card entra-esquerda';
  card.innerHTML =
    '<div class="quiz-topo">' +
      '<span class="quiz-passo">Questão ' + n + ' de ' + total + '</span>' +
      '<span class="quiz-pontos">acertos: ' + quizAcertos + '</span>' +
    '</div>' +
    '<div class="quiz-barra"><i style="width:' + ((n-1)/total*100) + '%"></i></div>' +
    (item.figura ? '<div class="quiz-figura">' + item.figura + '</div>' : '') +
    '<p class="quiz-enunciado">' + item.enunciado + '</p>' +
    '<div id="quizCorpo"></div>';

  const cx = $('quiz');
  cx.innerHTML = ''; cx.appendChild(card);
  mostrar('quiz');

  /* dispara a animação de entrada pela esquerda */
  requestAnimationFrame(()=>{
    card.classList.remove('entra-esquerda');
    requestAnimationFrame(()=>{ card.querySelector('.quiz-barra i').style.width = (n/total*100) + '%'; });
  });

  /* 3) corpo conforme o tipo */
  const corpo = $('quizCorpo');
  if(item.tipo === 'figuras')       montarFiguras(item, corpo);
  else if(item.tipo === 'arrastar') montarArrastar(item, corpo);
  else if(item.tipo === '3d')       montar3D(item, corpo);
  else                              montarAlternativas(item, corpo);

  /* 4) toca a faixa da pergunta e revela as opções no tempo certo */
  /* Sem legenda global aqui: o enunciado já está no card, e o overlay
     #legenda (z-index menor) apareceria por trás dele. */
  if(item.faixaEmCurso){
    /* O áudio da pergunta é a faixa que JÁ está tocando: o card entrou no
       meio dela. Não tocar de novo — e, sobretudo, não chamar rodarStory
       aqui, que apagaria as cues restantes da faixa. As alternativas entram
       quando o áudio terminar, por quizAoTerminarFaixa(). */
    esconder('legenda');
  } else if(item.faixa && idxFaixa(item.faixa) >= 0){
    tocarFaixaPorId(item.faixa);
    esconder('legenda');
    rodarStory([{ t: item.revelarEm || 3, fn: revelarOpcoes }]);
  } else {
    revelarOpcoes();
  }
}

/* Revela as alternativas escalonadamente. */
function revelarOpcoes(){
  const alvos = $$('#quizCorpo .alt, #quizCorpo .fig-alt, #quizCorpo .chip');
  alvos.forEach((el, i)=> setTimeout(()=> el.classList.add('vis'), i * 110));
  const av = $('quiz3dTxt');
  if(av && av.dataset.pendente === '1'){ mostrar('quiz3dAviso'); av.dataset.pendente = '0'; }
}

/* ---------------------------- tipo: alternativas ------------------------ */
/* item.compacto  → dois botões estreitos lado a lado, sem o selo de letra.
   Serve para alternativas de uma palavra; as longas continuam em lista. */
function montarAlternativas(item, corpo){
  const letras = 'ABCDEFGH';
  const div = document.createElement('div');
  div.className = 'quiz-alts' +
    (item.duasCol  ? ' duas-col' : '') +
    (item.compacto ? ' compacta' : '');
  item.alternativas.forEach((a, i)=>{
    const b = document.createElement('button');
    b.className = 'alt'; b.type = 'button';
    const selo = item.compacto ? '' : '<span class="letra">' + letras[i] + '</span>';
    b.innerHTML = selo + '<span>' + a.txt + '</span>';
    b.onclick = ()=> responder(item, i, b, div);
    div.appendChild(b);

/* ---------------------------- tipo: figuras ----------------------------- */
function montarFiguras(item, corpo){
  const div = document.createElement('div');

    const b = document.createElement('button');
    b.className = 'fig-alt'; b.type = 'button';
    b.innerHTML = a.fig + '<div class="rot">' + (a.rot || ('Opção ' + (i+1))) + '</div>';
    b.onclick = ()=> responder(item, i, b, div);
    div.appendChild(b);

/* -------------------- resposta padrão (acerto / erro) -------------------- */
function responder(item, escolha, botao, container){
  if(quizRespondido) return;
  quizRespondido = true;

  const certo = (escolha === item.correta);
  /* Gancho por item: o que a CENA faz ao receber a resposta, seja ela qual
     for. Na pergunta das torneiras é aqui que o quadro troca de bloco. */
  if(item.aoResponder){ try { item.aoResponder(certo); } catch(e){ console.error(e); } }
  const filhos = Array.prototype.slice.call(container.children);
  /* '.vis' é o que dá opacity:1. Se a resposta chegar antes de revelarOpcoes()
     terminar (áudio curto, toque rápido), a alternativa marcada ficaria
     invisível. Garantimos a revelação de todas antes de marcar. */
  filhos.forEach(f => { f.classList.add('vis'); f.classList.add('travada'); });

  if(certo){
    /* --- ACERTO: aplausos + fanfarra + confete --- */
    quizAcertos++; quizAcertouAtual = true;
    botao.classList.add('certa');
    filhos.forEach(f => { if(f !== botao) f.classList.add('apagada'); });
    playSfx('applause'); playSfx('funfare');
    festaConfete(150);
    ramoQuiz(item, true);
  } else {
    /* --- ERRO: som de erro + tremer vermelho + marcar a correta --- */
    botao.classList.add('errada');
    if(filhos[item.correta]) filhos[item.correta].classList.add('certa');
    playSfx('error');
    tremerVermelho();
    ramoQuiz(item, false);
  }
}

/* Toca a faixa do ramo (acerto/erro). O comentário que ficava embaixo das
   alternativas (#quizDica) saiu inteiro — elemento, CSS e escrita: ele
   repetia palavra por palavra a narração que começa a tocar logo em seguida.
   Quem explica a resposta é o áudio. */
function ramoQuiz(item, acertou){
  const id = acertou ? item.faixaAcerto : item.faixaErro;
  if(!(id && idxFaixa(id) >= 0)){ setTimeout(proximoItemQuiz, 1800); return; }

  /* item.fecharCardEm = { acerto, erro } — segundos do ÁUDIO DO RAMO em que o
     card (pergunta + alternativas) some em fade. Sem isso ele fica até o fim. */
  const quando = item.fecharCardEm
    ? (acertou ? item.fecharCardEm.acerto : item.fecharCardEm.erro) : 0;

  setTimeout(()=>{
    tocarFaixaPorId(id, { manterQuiz:true });

    /* tocarFaixa monta uma coreografia PADRÃO para faixas sem EVENTOS: ela
       digita o campo `texto` da faixa na legenda do rodapé. Nos ramos isso
       vira um segundo feedback escrito, repetindo a narração — limpamos a
       story e a legenda antes de instalar a nossa. */
    limparStory();
    esconder('legenda');

    if(quando > 0) rodarStory([{ t:quando, fn:()=>{
      esconder('quiz');
      /* Depois do fade, esvazia o card. Sem isso, proximoItemQuiz() ainda
         encontraria o elemento no fim do ramo e tocaria o som de "próxima"
         com a animação de saída — de um card que já não está na tela. */
      setTimeout(()=>{
        const c = $('quiz');
        if(c && !c.classList.contains('show')) c.innerHTML = '';
      }, 520);
    } }]);
  }, acertou ? 900 : 700);
}

/* ---------------------------- tipo: arrastar ---------------------------- */
function montarArrastar(item, corpo){
  const alvosHtml = item.alvos.map(a =>
    '<div class="dnd-alvo" data-alvo="' + a.id + '"><span class="cab">' + a.cab + '</span></div>').join('');
  corpo.innerHTML =
    '<div class="dnd-alvos">' + alvosHtml + '</div>' +
    '<div class="dnd-chips" id="dndChips"></div>' +
    '<button class="quiz-acao" id="dndConferir" disabled>Conferir</button>';

  const bandeja = $('dndChips');
  /* embaralha para não decorar a ordem */
  const chips = item.chips.slice().sort(()=> Math.random() - .5);
  chips.forEach((c)=>{
    const el = document.createElement('div');
    el.className = 'chip'; el.textContent = c.txt; el.dataset.alvo = c.alvo;
    bandeja.appendChild(el);
    ligarArrasto(el, item);
  });

  $('dndConferir').onclick = ()=> conferirArrastar(item, corpo);
}

function ligarArrasto(chip, item){
  let arrastando = false, offX = 0, offY = 0, origem = null;

  /* Tudo aqui em coordenadas de MOLDURA. getBoundingClientRect() devolve
     janela e já com a ampliação embutida, então o canto e a largura passam
     por pontoNaMoldura()/escalaMoldura antes de virarem style. */
  chip.addEventListener('pointerdown', (e)=>{
    if(quizRespondido) return;
    arrastando = true; origem = chip.parentElement;
    const r = chip.getBoundingClientRect();
    const canto = pontoNaMoldura(r.left, r.top);
    const p = pontoNaMoldura(e.clientX, e.clientY);
    offX = p.x - canto.x; offY = p.y - canto.y;
    chip.classList.add('arrastando');
    chip.style.left = canto.x + 'px'; chip.style.top = canto.y + 'px';
    chip.style.width = (r.width / (escalaMoldura || 1)) + 'px';
    /* Para dentro da MOLDURA, não para o body: fora dela o chip não seria
       ampliado junto e encolheria de estalo no meio do arrasto. */
    $('app').appendChild(chip);
    chip.setPointerCapture(e.pointerId);
    playSfx('click', .35);
  });

  chip.addEventListener('pointermove', (e)=>{
    if(!arrastando) return;
    const p = pontoNaMoldura(e.clientX, e.clientY);
    chip.style.left = (p.x - offX) + 'px';
    chip.style.top  = (p.y - offY) + 'px';
    /* elementsFromPoint quer coordenadas de JANELA e sabe lidar com a
       ampliação sozinho — este par fica sem converter, de propósito. */
    const sob = alvoSobPonteiro(e.clientX, e.clientY);
    $$('.dnd-alvo').forEach(a => a.classList.toggle('sobre', a === sob));
  });

  const soltar = (e)=>{
    if(!arrastando) return;
    arrastando = false;
    chip.classList.remove('arrastando');
    chip.style.left = chip.style.top = chip.style.width = '';
    const sob = alvoSobPonteiro(e.clientX, e.clientY);
    $$('.dnd-alvo').forEach(a => a.classList.remove('sobre'));
    if(sob){
      chip.classList.add('encaixado');
      sob.appendChild(chip);
      playSfx('pop', .35);
    } else {
      chip.classList.remove('encaixado');
      (origem && origem.classList.contains('dnd-alvo') ? $('dndChips') : ($('dndChips') || origem)).appendChild(chip);
    }
    const faltam = $('dndChips').children.length;
    const bt = $('dndConferir'); if(bt) bt.disabled = faltam > 0;
  };
  chip.addEventListener('pointerup', soltar);
  chip.addEventListener('pointercancel', soltar);
}

function alvoSobPonteiro(x, y){
  const els = document.elementsFromPoint ? document.elementsFromPoint(x, y) : [document.elementFromPoint(x, y)];
  for(let i = 0; i < els.length; i++){
    const a = els[i] && els[i].closest ? els[i].closest('.dnd-alvo') : null;
    if(a) return a;
  }
  return null;
}

function conferirArrastar(item, corpo){
  if(quizRespondido) return;
  quizRespondido = true;

  let todosOk = true;
  $$('.dnd-alvo', corpo).forEach((alvo)=>{
    const dentro = $$('.chip', alvo);
    const ok = dentro.length === 1 && dentro[0].dataset.alvo === alvo.dataset.alvo;
    alvo.classList.add(ok ? 'ok' : 'nok');
    if(!ok) todosOk = false;
  });
  $('dndConferir').disabled = true;
  $$('.chip', corpo).forEach(c => c.style.pointerEvents = 'none');

  if(todosOk){
    quizAcertos++; quizAcertouAtual = true;
    playSfx('applause'); playSfx('funfare'); festaConfete(150);
    ramoQuiz(item, true);
  } else {
    playSfx('error'); tremerVermelho();
    /* mostra o gabarito movendo cada chip para o alvo certo */
    setTimeout(()=>{
      item.chips.forEach((c)=>{
        const chip = $$('.chip', corpo).filter(el => el.textContent === c.txt)[0];
        const alvo = $$('.dnd-alvo', corpo).filter(a => a.dataset.alvo === c.alvo)[0];
        if(chip && alvo){ alvo.appendChild(chip); alvo.classList.remove('nok'); alvo.classList.add('ok'); }
      });
    }, 900);
    ramoQuiz(item, false);
  }
}

/* ------------------------------ tipo: 3D -------------------------------- */
/* Guarda o que é clicável na cena enquanto um item '3d' está ativo. */
let alvos3D = null;

function montar3D(item, corpo){
  corpo.innerHTML = '';
  $('quiz3dTxt').textContent = item.aviso || 'Toque no objeto certo na cena';
  $('quiz3dTxt').dataset.pendente = '1';

  /* mapeia os meshes clicáveis dos dois béqueres */
  alvos3D = { item, mapa: [] };
  if(bancada && bancada.A && bancada.B){
    bancada.A.alvos.forEach(o => alvos3D.mapa.push({ obj:o, chave:'A' }));
    bancada.B.alvos.forEach(o => alvos3D.mapa.push({ obj:o, chave:'B' }));
  }
}

let raycaster = null, ponteiro = null;

function cliqueNaCena(ev){
  if(camLivre) return;
  if(!alvos3D || quizRespondido) return;
  if(!raycaster){ raycaster = new THREE.Raycaster(); ponteiro = new THREE.Vector2(); }

  /* clientX/Y são da JANELA; o canvas vive dentro da moldura, deslocada e
     ampliada. pontoNaMoldura() desfaz as duas coisas — sem isso o toque cairia
     longe do béquer que o aluno tocou. */
  const p = pontoNaMoldura(ev.clientX, ev.clientY);
  ponteiro.x =  (p.x / telaW()) * 2 - 1;
  ponteiro.y = -(p.y / telaH()) * 2 + 1;
  raycaster.setFromCamera(ponteiro, camera);

  const objetos = alvos3D.mapa.map(m => m.obj);
  const hits = raycaster.intersectObjects(objetos, true);
  if(!hits.length) return;

  /* sobe na hierarquia até achar um objeto mapeado */
  let alvo = hits[0].object, chave = null;
  while(alvo && !chave){
    const m = alvos3D.mapa.filter(x => x.obj === alvo)[0];
    if(m) chave = m.chave; else alvo = alvo.parent;
  }
  if(!chave) return;

  responder3D(alvos3D.item, chave);
}

function responder3D(item, chave){
  quizRespondido = true;
  esconder('quiz3dAviso');
  const certo = item.checar(chave);
  const bq = (chave === 'A') ? bancada.A : bancada.B;

  if(certo){
    quizAcertos++; quizAcertouAtual = true;
    playSfx('applause'); playSfx('funfare'); festaConfete(150); flashBranco();
    irParaCamera(chave === 'A' ? CAM_BEQUER : CAM_BEQUER_B, true, 800);
    ramoQuiz(item, true);
  } else {
    playSfx('error'); tremerVermelho();
    /* destaca o correto */
    const certoBq = item.checar('A') ? bancada.A : bancada.B;
    irParaCamera(item.checar('A') ? CAM_BEQUER : CAM_BEQUER_B, true, 900);
    certoBq.setTaxa(3.2);
    ramoQuiz(item, false);
  }
}

/* Fluxo do quiz quando uma faixa termina (ramos R/W e pergunta). */
function quizAoTerminarFaixa(id){
  const item = QUIZZES[quizAtivo].itens[quizItem];
  if(!item) return;

  /* fim do áudio da PERGUNTA → não faz nada: espera a resposta */
  if(id === item.faixa){
    revelarOpcoes();            // garante que apareceram
    return;
  }
  /* fim do ramo de ACERTO ou de ERRO → próxima questão */
  if(id === item.faixaAcerto || id === item.faixaErro){
    esconder('legenda');
    proximoItemQuiz();
    return;
  }
}
